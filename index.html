 describes a person's walking trip through the neighborhood. Regular verbs: walked, stepped, stopped, waited, crossed, used. Irregular verbs: run-ran, take-took. Time adverbs: once, sometimes, when he could.", "zh": "一般过去时描述一个人步行穿过街区的过程。规则动词：walked、stepped、stopped、waited、crossed、used。不规则动词：run-ran、take-took。时间副词：once（有一次）、sometimes（有时）、when he could（来得及的时候）。"}, "steps": [{"en": "Tom walked to school on the sidewalk.", "zh": "汤姆沿着人行道走去学校。"}, {"en": "Sometimes he stepped over dirt or puddles.", "zh": "有时他会跨过泥土或小水坑。"}, {"en": "Once, he tripped on a crack in the sidewalk.", "zh": "有一次，他被人行道上的裂缝绊了一下。"}, {"en": "At a corner, he stopped at the curb and waited for traffic to pass.", "zh": "在路口，他站在路边等车辆通过。"}, {"en": "Then he crossed the street by walking in the crosswalk.", "zh": "然后他沿着斑马线穿过了马路。"}, {"en": "Once he took a shortcut through the park.", "zh": "有一次，他从公园里抄了近路。"}, {"en": "When he could, he ran because he was late.", "zh": "能跑的时候他就跑，因为他要迟到了。"}, {"en": "He crossed a busy street by using a pedestrian overpass.", "zh": "他通过人行天桥穿过了繁忙的马路。"}], "vocab": {"verbs": [{"w": "cross", "ipa": "/krɔːs/", "zh": "穿过，横过"}, {"w": "pass", "ipa": "/pæs/", "zh": "通过，经过"}, {"w": "run (ran)", "ipa": "/rʌn/", "zh": "跑"}, {"w": "step", "ipa": "/step/", "zh": "跨步，踩"}, {"w": "stop", "ipa": "/stɑːp/", "zh": "停下"}, {"w": "take (took)", "ipa": "/teɪk/", "zh": "走（捷径）"}, {"w": "trip", "ipa": "/trɪp/", "zh": "绊倒"}, {"w": "use", "ipa": "/juːz/", "zh": "使用"}, {"w": "wait", "ipa": "/weɪt/", "zh": "等待"}, {"w": "walk", "ipa": "/wɔːk/", "zh": "步行"}], "nouns": [{"w": "corner", "ipa": "/ˈkɔːrnər/", "zh": "街角"}, {"w": "crack", "ipa": "/kræk/", "zh": "裂缝"}, {"w": "crosswalk", "ipa": "/ˈkrɔːswɔːk/", "zh": "斑马线"}, {"w": "curb", "ipa": "/kɜːrb/", "zh": "路缘石"}, {"w": "dirt", "ipa": "/dɜːrt/", "zh": "泥土"}, {"w": "overpass", "ipa": "/ˈoʊvərpæs/", "zh": "天桥"}, {"w": "parking lot", "ipa": "/ˈpɑːrkɪŋ lɑːt/", "zh": "停车场"}, {"w": "pedestrian", "ipa": "/pəˈdestriən/", "zh": "行人"}, {"w": "puddle", "ipa": "/ˈpʌdl/", "zh": "水坑"}, {"w": "shortcut", "ipa": "/ˈʃɔːrtkʌt/", "zh": "捷径"}, {"w": "sidewalk", "ipa": "/ˈsaɪdwɔːk/", "zh": "人行道"}, {"w": "street", "ipa": "/striːt/", "zh": "街道"}, {"w": "traffic", "ipa": "/ˈtræfɪk/", "zh": "车流"}], "others": [{"w": "busy (adj.)", "ipa": "/ˈbɪzi/", "zh": "繁忙的"}, {"w": "late (adj.)", "ipa": "/leɪt/", "zh": "迟到的"}, {"w": "once (adv.)", "ipa": "/wʌns/", "zh": "有一次"}, {"w": "sometimes (adv.)", "ipa": "/ˈsʌmtaɪmz/", "zh": "有时"}]}, "notes": [{"en": "A sidewalk is a paved (concrete) place for walking.", "zh": "人行道是铺好（水泥）的走路地方。"}, {"en": "traffic = the group of cars, trucks, buses, bikes, etc., on a street.", "zh": "traffic 指街上行驶的汽车、卡车、公交车、自行车等的总称。"}, {"en": "When you take a shortcut, you use a shorter way than the usual way.", "zh": "走捷径就是走一条比平时更短的路。"}, {"en": "a pedestrian = someone who is walking.", "zh": "pedestrian 就是正在走路的人，即行人。"}, {"en": "An overpass is a bridge for passing over the street.", "zh": "overpass 是供人横穿街道上方的桥，即人行天桥。"}], "dialogue": [], "china": [{"en": "In China, children often walk to school with their parents or grandparents.", "zh": "在中国，孩子常由父母或爷爷奶奶陪着步行上学。可以说 walk to school（走路上学）。"}, {"en": "Pedestrian overpasses are common near Chinese schools.", "zh": "中国学校附近常见人行天桥。可以说 pedestrian overpass（人行天桥）。"}], "en": "Walking Somewhere", "zh": "步行去某处", "grammarZh": "一般过去时"}, {"id": 19, "section": 2, "level": 1, "img": "assets/img/unit19.jpg", "grammar": "SIMPLE PAST", "grammarNote": {"en": "The simple past tells a first-person bike ride story. Regular verbs: started, moved, shifted, squeezed, locked. Irregular verbs: get-got off, hold-held, put-put, ride-rode, swing-swung. The first-person \"I\" makes the past actions immediate and personal.", "zh": "一般过去时以第一人称讲述一次骑自行车的经历。规则动词：started、moved、shifted、squeezed、locked。不规则动词：get-got off、hold-held、put-put、ride-rode、swing-swung。第一人称 I 让过去的动作显得直接、亲切。"}, "steps": [{"en": "I put on my helmet.", "zh": "我戴上头盔。"}, {"en": "I held the handlebars...", "zh": "我握住车把……"}, {"en": "...and swung my leg over the bike.", "zh": "然后抬腿跨上自行车。"}, {"en": "I started pedaling, and the bike moved.", "zh": "我开始蹬踏板，自行车动了起来。"}, {"en": "To go uphill, I shifted into a lower gear.", "zh": "上坡时，我换到低速挡。"}, {"en": "To slow down, I squeezed the brakes.", "zh": "要减速时，我捏紧刹车。"}, {"en": "I scanned the code and unlocked a shared bike.", "zh": "我扫码解锁了一辆共享单车。"}, {"en": "After the ride, I parked it in the bike parking area.", "zh": "骑完后，我把车停在自行车停放区。"}], "vocab": {"verbs": [{"w": "hold", "ipa": "/hoʊld/", "zh": "握住"}, {"w": "lock up", "ipa": "/lɑːk ʌp/", "zh": "锁好"}, {"w": "move", "ipa": "/muːv/", "zh": "移动"}, {"w": "park", "ipa": "/pɑːrk/", "zh": "停放"}, {"w": "pedal", "ipa": "/ˈpedl/", "zh": "蹬踏板"}, {"w": "put on", "ipa": "/pʊt ɑːn/", "zh": "戴上"}, {"w": "scan", "ipa": "/skæn/", "zh": "扫码"}, {"w": "shift", "ipa": "/ʃɪft/", "zh": "换挡"}, {"w": "slow down", "ipa": "/sloʊ daʊn/", "zh": "减速"}, {"w": "squeeze", "ipa": "/skwiːz/", "zh": "捏"}, {"w": "swing", "ipa": "/swɪŋ/", "zh": "摆动；跨"}, {"w": "unlock", "ipa": "/ˌʌnˈlɑːk/", "zh": "解锁"}], "nouns": [{"w": "bike", "ipa": "/baɪk/", "zh": "自行车"}, {"w": "brakes", "ipa": "/breɪks/", "zh": "刹车"}, {"w": "gear", "ipa": "/ɡɪr/", "zh": "挡位"}, {"w": "handlebars", "ipa": "/ˈhændlbɑːrz/", "zh": "车把"}, {"w": "helmet", "ipa": "/ˈhelmɪt/", "zh": "头盔"}, {"w": "leg", "ipa": "/leɡ/", "zh": "腿"}, {"w": "parking area", "ipa": "/ˈpɑːrkɪŋ ˈeriə/", "zh": "停放区"}], "others": [{"w": "lower (adj.)", "ipa": "/ˈloʊər/", "zh": "更低的"}, {"w": "uphill (adv.)", "ipa": "/ˌʌpˈhɪl/", "zh": "上坡"}]}, "notes": [{"en": "Always wear a helmet when you ride a bike.", "zh": "骑车一定要戴头盔。"}, {"en": "Scan the code to unlock a shared bike, and park it in the parking area when you finish.", "zh": "扫码解锁共享单车，骑完停在停放区。"}], "dialogue": [], "china": [{"en": "Shared bikes like Meituan and Hello are very popular in China; you unlock them by scanning a code.", "zh": "美团、哈啰等共享单车在中国很流行，扫码即可解锁。"}, {"en": "Chinese cities have bike lanes, but e-bikes also use them, so be careful.", "zh": "中国城市有自行车道，但电动车也走非机动车道，骑车要小心。"}], "en": "Riding a Bicycle", "zh": "骑自行车", "grammarZh": "一般过去时"}, {"id": 20, "section": 3, "level": 1, "img": "assets/img/unit20.jpg", "grammar": "SIMPLE PAST", "grammarNote": {"en": "Most of the verbs in 'At Home in the Evening' are in the simple past tense (e.g. got, checked, took, walked, opened). Some verbs also appear in their '-ing' form acting as nouns (pressing, waiting) or adjectives (answering machine).", "zh": "“晚间在家”这一部分的动词大多使用一般过去时（如 got、checked、took、walked、opened）。有些动词以 -ing 形式出现，作动名词（pressing、waiting）或形容词（answering machine 答录机）。"}, "steps": [{"en": "After school, Jenny got back to her apartment building.", "zh": "放学后，珍妮回到了公寓楼下。"}, {"en": "She pressed the code on the keypad to open the door.", "zh": "她在密码门上输了密码开门。"}, {"en": "She took the elevator up to her floor.", "zh": "她乘电梯上到自己住的楼层。"}, {"en": "She walked down the hall to her home.", "zh": "她走过走廊，来到家门口。"}, {"en": "She unlocked the door with her key.", "zh": "她用钥匙打开了家门。"}, {"en": "She put down her schoolbag and took off her shoes.", "zh": "她放下书包，脱下鞋子。"}, {"en": "Mom said, \"Welcome home, Jenny!\"", "zh": "妈妈说：“欢迎回家，珍妮！”"}], "vocab": {"verbs": [{"w": "get back", "ipa": "/ɡet bæk/", "zh": "回到"}, {"w": "open", "ipa": "/ˈoʊpən/", "zh": "打开"}, {"w": "press", "ipa": "/pres/", "zh": "按"}, {"w": "put down", "ipa": "/pʊt daʊn/", "zh": "放下"}, {"w": "take off", "ipa": "/teɪk ɔːf/", "zh": "脱下"}, {"w": "take the elevator", "ipa": "/teɪk ðə ˈelɪveɪtər/", "zh": "乘电梯"}, {"w": "unlock", "ipa": "/ˌʌnˈlɑːk/", "zh": "开锁"}, {"w": "walk", "ipa": "/wɔːk/", "zh": "走"}], "nouns": [{"w": "apartment building", "ipa": "/əˈpɑːrtmənt ˈbɪldɪŋ/", "zh": "公寓楼"}, {"w": "door", "ipa": "/dɔːr/", "zh": "门"}, {"w": "elevator", "ipa": "/ˈelɪveɪtər/", "zh": "电梯"}, {"w": "floor", "ipa": "/flɔːr/", "zh": "楼层"}, {"w": "hall", "ipa": "/hɔːl/", "zh": "走廊"}, {"w": "key", "ipa": "/kiː/", "zh": "钥匙"}, {"w": "keypad", "ipa": "/ˈkiːpæd/", "zh": "密码键盘"}, {"w": "schoolbag", "ipa": "/ˈskuːlbæɡ/", "zh": "书包"}, {"w": "shoe", "ipa": "/ʃuː/", "zh": "鞋"}], "others": [{"w": "home (adv.)", "ipa": "/hoʊm/", "zh": "回家"}]}, "notes": [{"en": "Many apartment buildings open the door with a code or a card.", "zh": "很多公寓楼用密码或门禁卡开门。"}, {"en": "Take off your shoes when you come home and wash your hands.", "zh": "回家后脱鞋、洗手。"}], "dialogue": [{"speaker": "Mom", "role": "mom", "en": "Welcome home, Jenny! How was school?", "zh": "欢迎回家，珍妮！今天在学校怎么样？"}, {"speaker": "Jenny", "role": "girl", "en": "It was fun! We drew pictures today.", "zh": "很开心！我们今天画画了。"}, {"speaker": "Mom", "role": "mom", "en": "Great! Wash your hands, and have a snack.", "zh": "真棒！去洗洗手，吃点零食吧。"}], "china": [{"en": "In China, apartment buildings usually have a keypad or card reader at the door.", "zh": "中国公寓楼单元门通常有密码键盘或门禁刷卡。"}, {"en": "Children take off their shoes at the door and change into slippers at home.", "zh": "孩子进门换拖鞋是常见的中国家庭习惯。"}], "en": "Returning Home", "zh": "放学回家", "grammarZh": "一般过去时"}, {"id": 21, "section": 3, "level": 1, "img": "assets/img/unit21.jpg", "grammar": "SIMPLE PAST", "grammarNote": {"en": "The narration uses the simple past (rinsed, drained, sliced, mixed, laid, sprinkled, poured) to describe a sequence of completed actions in the kitchen.", "zh": "叙述使用一般过去时（rinsed 冲洗、drained 沥干、sliced 切片、mixed 混合、laid 摆放、sprinkled 撒、poured 浇），描述厨房里一连串已完成的动作。"}, "steps": [{"en": "Paul rinsed some lettuce by running water over it, and drained it in a colander.", "zh": "保罗用水冲洗生菜，再用沥水篮把水沥干。"}, {"en": "He also rinsed some tomatoes and cucumbers, and sliced them with a knife.", "zh": "他还洗了西红柿和黄瓜，用刀切成片。"}, {"en": "He mixed the lettuce and the cucumber in a salad bowl, and laid the tomatoes on top.", "zh": "他把生菜和黄瓜在沙拉碗里拌好，把西红柿片摆在上面。"}, {"en": "Then he sprinkled some raisins on the salad.", "zh": "然后他往沙拉上撒了一些葡萄干。"}, {"en": "He poured some salad dressing on his salad.", "zh": "他往沙拉上倒了些沙拉酱。"}], "vocab": {"verbs": [{"w": "drain", "ipa": "/dreɪn/", "zh": "沥干；滤干"}, {"w": "grate", "ipa": "/ɡreɪt/", "zh": "擦碎（奶酪等）"}, {"w": "lay / laid", "ipa": "/leɪ / leɪd/", "zh": "摆放；放置"}, {"w": "make / made", "ipa": "/meɪk / meɪd/", "zh": "制作"}, {"w": "mix", "ipa": "/mɪks/", "zh": "混合；拌匀"}, {"w": "pour", "ipa": "/pɔːr/", "zh": "倒；浇"}, {"w": "rinse", "ipa": "/rɪns/", "zh": "冲洗；漂洗"}, {"w": "run (water over)", "ipa": "/rʌn/", "zh": "用水冲"}, {"w": "slice", "ipa": "/slaɪs/", "zh": "切成片"}, {"w": "sprinkle", "ipa": "/ˈsprɪŋkl/", "zh": "撒（少量）"}], "nouns": [{"w": "bowl", "ipa": "/boʊl/", "zh": "碗"}, {"w": "cheese", "ipa": "/tʃiːz/", "zh": "奶酪"}, {"w": "colander", "ipa": "/ˈkɑːləndər/", "zh": "滤水篮；滤锅"}, {"w": "cucumber", "ipa": "/ˈkjuːkʌmbər/", "zh": "黄瓜"}, {"w": "cutting board", "ipa": "/ˈkʌtɪŋ bɔːrd/", "zh": "砧板"}, {"w": "dressing", "ipa": "/ˈdresɪŋ/", "zh": "沙拉酱"}, {"w": "grater", "ipa": "/ˈɡreɪtər/", "zh": "擦丝器；擦板"}, {"w": "knife", "ipa": "/naɪf/", "zh": "刀"}, {"w": "lettuce", "ipa": "/ˈletɪs/", "zh": "生菜；莴苣"}, {"w": "salad", "ipa": "/ˈsæləd/", "zh": "沙拉"}, {"w": "slice", "ipa": "/slaɪs/", "zh": "薄片"}, {"w": "tomato", "ipa": "/təˈmeɪtoʊ/", "zh": "西红柿"}, {"w": "water", "ipa": "/ˈwɔːtər/", "zh": "水"}], "others": [{"w": "on top (adverbial)", "ipa": "/ɑːn tɑːp/", "zh": "在上面；在顶部"}]}, "notes": [{"en": "'On top' means 'on the top of' something we already know. Example: 'a bus with a sign on top' = 'on top of the bus.'", "zh": "on top 指“在我们已知事物的顶部”。例如“车顶有标志的公交车”即 on top of the bus。"}, {"en": "Paul rinsed the lettuce. You can also say 'Paul washed some lettuce.'", "zh": "Paul rinsed the lettuce. 也可以说成 Paul washed some lettuce."}, {"en": "You drain something by letting water go off it or out of it.", "zh": "drain（沥干）就是让水从食物上流走或漏掉。"}, {"en": "Grated cheese has been cut or shaved into very small pieces with a grater.", "zh": "grated cheese（擦碎的奶酪）是用擦板把奶酪切成很细的屑。"}, {"en": "When you sprinkle something, you spread small amounts of a liquid or solid over a wide area.", "zh": "sprinkle（撒）指把少量液体或固体均匀地撒在一大片表面上。"}], "dialogue": [], "china": [{"en": "In China, children help make salad or cold dishes (liangcai) at home.", "zh": "在中国，孩子在家会帮忙做沙拉或凉菜。可以说 cold dish（凉菜）、salad（沙拉）。"}, {"en": "Raisins are a healthy sweet topping children love.", "zh": "葡萄干是孩子喜欢的健康甜味配料。可以说 raisins（葡萄干）。"}], "en": "Making a Salad", "zh": "做沙拉", "grammarZh": "一般过去时"}, {"id": 22, "section": 3, "level": 1, "img": "assets/img/unit22.jpg", "grammar": "SIMPLE PAST", "grammarNote": {"en": "Simple past narration (peeled, sliced, chopped, threw, rinsed, put, lit, boiled, steamed) describes a sequence of cooking actions.", "zh": "用一般过去时（peeled 削皮、sliced 切片、chopped 切块、threw 扔掉、rinsed 冲洗、put 放、lit 点燃、boiled 煮开、steamed 蒸）叙述一系列做菜动作。"}, "steps": [{"en": "Kate peeled some carrots and sliced them.", "zh": "凯特给胡萝卜去皮，然后切成片。"}, {"en": "She also chopped up some broccoli and threw the stalk away.", "zh": "她还把西兰花切成小朵，把菜梗扔掉。"}, {"en": "She rinsed the broccoli and put some water in a saucepan.", "zh": "她把西兰花冲洗干净，在汤锅里加了些水。"}, {"en": "She put a steamer basket inside, then put the vegetables in the basket.", "zh": "她在锅里放上蒸格，再把蔬菜放进蒸格。"}, {"en": "She put a lid on the saucepan and lit the burner under it.", "zh": "她盖上锅盖，点燃炉子。"}, {"en": "The water boiled and steamed the vegetables.", "zh": "水烧开后，蒸汽把菜蒸熟了。"}], "vocab": {"verbs": [{"w": "boil", "ipa": "/bɔɪl/", "zh": "煮沸；烧开"}, {"w": "chop up", "ipa": "/tʃɑːp ʌp/", "zh": "切碎；剁开"}, {"w": "light / lit", "ipa": "/laɪt / lɪt/", "zh": "点燃（火）"}, {"w": "peel", "ipa": "/piːl/", "zh": "削皮；去皮"}, {"w": "prepare", "ipa": "/prɪˈper/", "zh": "准备（食材）"}, {"w": "rinse", "ipa": "/rɪns/", "zh": "冲洗"}, {"w": "slice", "ipa": "/slaɪs/", "zh": "切成片"}, {"w": "steam", "ipa": "/stiːm/", "zh": "蒸"}, {"w": "throw away", "ipa": "/θroʊ əˈweɪ/", "zh": "扔掉"}], "nouns": [{"w": "basket", "ipa": "/ˈbæskɪt/", "zh": "篮子"}, {"w": "broccoli", "ipa": "/ˈbrɑːkəli/", "zh": "西兰花；西蓝花"}, {"w": "burner", "ipa": "/ˈbɜːrnər/", "zh": "炉头；燃烧器"}, {"w": "carrot", "ipa": "/ˈkærət/", "zh": "胡萝卜"}, {"w": "floret", "ipa": "/ˈflɔːrɪt/", "zh": "（菜花的）小朵"}, {"w": "lid", "ipa": "/lɪd/", "zh": "锅盖；盖子"}, {"w": "saucepan", "ipa": "/ˈsɔːspæn/", "zh": "深汤锅"}, {"w": "stalk", "ipa": "/stɔːk/", "zh": "（植物的）茎；梗"}, {"w": "steam", "ipa": "/stiːm/", "zh": "蒸汽"}, {"w": "steamer", "ipa": "/ˈstiːmər/", "zh": "蒸锅；蒸格"}, {"w": "vegetable", "ipa": "/ˈvedʒtəbl/", "zh": "蔬菜"}, {"w": "water", "ipa": "/ˈwɔːtər/", "zh": "水"}], "others": [{"w": "boiling (adj.)", "ipa": "/ˈbɔɪlɪŋ/", "zh": "沸腾的；滚烫的"}, {"w": "inside (adv.)", "ipa": "/ˌɪnˈsaɪd/", "zh": "在里面"}]}, "notes": [{"en": "When you steam something, you put it above—but not in—boiling water. The steam rises and cooks the food.", "zh": "蒸菜时把食物放在沸水上方（但不泡在水里），蒸汽上升把食物蒸熟。"}, {"en": "Slice means cutting into thin, flat pieces with a smooth, gentle motion. Chop means cutting into irregular pieces by cutting forcefully.", "zh": "slice（切片）是用平稳、轻柔的动作切成薄而平的片；chop（切块）是用力切成不规则的小块。"}], "dialogue": [], "china": [{"en": "Steaming is one of the most common cooking methods in Chinese kitchens; bamboo steamers are widely used instead of metal steamer baskets.", "zh": "蒸是中国厨房里最常见的做法之一，常用竹制蒸笼而不是金属蒸格。"}, {"en": "Chinese homes almost always use a gas stove or induction cooktop; the burner being lit here looks the same.", "zh": "中国家庭几乎都用燃气灶或电磁炉，图里点燃炉头的样子和国内一样。"}, {"en": "Stir-frying (chǎo) is far more common than steaming for dinner vegetables; steaming is usually reserved for fish, buns or dumplings.", "zh": "晚餐蔬菜更多是大火快炒，蒸菜通常留给鱼、包子或饺子。"}], "en": "Preparing Vegetables", "zh": "准备蔬菜", "grammarZh": "一般过去时"}, {"id": 23, "section": 3, "level": 1, "img": "assets/img/unit23.jpg", "grammar": "SIMPLE PAST", "grammarNote": {"en": "The whole recipe is narrated in the simple past (diced, fried, stirred, heated, added, boiled, drained, ladled). Some verbs also have active intransitive uses such as 'the meat fried' and 'the water boiled.'", "zh": "整个食谱都用一般过去时叙述（diced 切丁、fried 煎、stirred 翻炒、heated 加热、added 加入、boiled 煮、drained 沥干、ladled 舀浇）。有些动词也作不及物动词用，如 the meat fried（肉煎着）、the water boiled（水煮开了）。"}, "steps": [{"en": "Tom diced a tomato and fried an egg in a frying pan.", "zh": "汤姆把番茄切丁，在煎锅里炒了一个鸡蛋。"}, {"en": "As the egg and tomato fried, he stirred them.", "zh": "鸡蛋和番茄在锅里炒时，他不停翻炒。"}, {"en": "He boiled some water in a pot.", "zh": "他在锅里烧了一些水。"}, {"en": "He put some noodles into the boiling water.", "zh": "他把面条放进开水里。"}, {"en": "He boiled the noodles until they were soft, then drained them in a colander.", "zh": "他把面条煮软，然后倒进滤篮里沥干。"}, {"en": "He put the noodles on a plate.", "zh": "他把面条盛到盘子里。"}, {"en": "He ladled the egg and tomato over the noodles.", "zh": "他把番茄鸡蛋浇在面条上。"}, {"en": "He added a little salt and mixed everything together.", "zh": "他加了一点盐，把面拌匀。"}], "vocab": {"verbs": [{"w": "add", "ipa": "/æd/", "zh": "加入"}, {"w": "boil", "ipa": "/bɔɪl/", "zh": "煮；烧开"}, {"w": "dice", "ipa": "/daɪs/", "zh": "切丁"}, {"w": "drain", "ipa": "/dreɪn/", "zh": "沥干"}, {"w": "fry", "ipa": "/fraɪ/", "zh": "炒；煎"}, {"w": "ladle", "ipa": "/ˈleɪdl/", "zh": "用勺浇"}, {"w": "mix", "ipa": "/mɪks/", "zh": "搅拌"}, {"w": "put", "ipa": "/pʊt/", "zh": "放"}, {"w": "stir", "ipa": "/stɜːr/", "zh": "翻炒；搅拌"}], "nouns": [{"w": "colander", "ipa": "/ˈkɑːlændər/", "zh": "滤篮"}, {"w": "egg", "ipa": "/eɡ/", "zh": "鸡蛋"}, {"w": "frying pan", "ipa": "/ˈfraɪɪŋ pæn/", "zh": "煎锅"}, {"w": "noodles", "ipa": "/ˈnuːdlz/", "zh": "面条"}, {"w": "plate", "ipa": "/pleɪt/", "zh": "盘子"}, {"w": "pot", "ipa": "/pɑːt/", "zh": "锅"}, {"w": "salt", "ipa": "/sɔːlt/", "zh": "盐"}, {"w": "tomato", "ipa": "/təˈmeɪtoʊ/", "zh": "番茄"}], "others": [{"w": "a little (quantifier)", "ipa": "/ə ˈlɪtl/", "zh": "一点"}, {"w": "together (adv.)", "ipa": "/təˈɡeðər/", "zh": "一起"}]}, "notes": [{"en": "Tomato and egg noodles are a simple, popular Chinese home dish.", "zh": "番茄鸡蛋面是一道简单又受欢迎的中国家常菜。"}, {"en": "Drain the noodles in a colander before putting them on the plate.", "zh": "面条盛盘前要用滤篮沥干。"}], "dialogue": [{"speaker": "Mom", "role": "mom", "en": "Tom, what did you make?", "zh": "汤姆，你做了什么？"}, {"speaker": "Tom", "role": "clerk", "en": "Tomato and egg noodles! Yum!", "zh": "番茄鸡蛋面！真香！"}], "china": [{"en": "Chinese kids often learn to cook simple noodle dishes like tomato and egg noodles.", "zh": "中国孩子常从番茄鸡蛋面这类简单的面条菜学起做饭。"}, {"en": "Fresh noodles and dried noodles are both common in Chinese supermarkets.", "zh": "中国超市既有鲜面条也有挂面。"}], "en": "Making Spaghetti", "zh": "做番茄鸡蛋面", "grammarZh": "一般过去时"}, {"id": 24, "section": 3, "level": 1, "img": "assets/img/unit24.jpg", "grammar": "SIMPLE PAST", "grammarNote": {"en": "Simple past narration (measured, poured, rinsed, heated, turned down, checked, decided) describes how rice was cooked on the stove.", "zh": "用一般过去时（measured 量、poured 倒、rinsed 淘洗、heated 加热、turned down 调小、checked 查看、decided 判断）讲述在炉子上煮饭的过程。"}, "steps": [{"en": "Paul measured out one cup of rice and poured it into the pot.", "zh": "保罗量出一杯米，倒进锅胆里。"}, {"en": "He rinsed the rice with water to clean it.", "zh": "他用水把米淘洗干净。"}, {"en": "Then he measured out two cups of clean water and poured it into the pot.", "zh": "然后他量出两杯清水，倒进锅里。"}, {"en": "He put a lid on the pot and plugged in the rice cooker.", "zh": "他盖上锅盖，插上电饭煲的电源。"}, {"en": "He pressed the cook button.", "zh": "他按下了煮饭键。"}, {"en": "After about 20 minutes, the rice cooker clicked, and the rice was ready.", "zh": "大约 20 分钟后，电饭煲跳闸，饭煮好了。"}, {"en": "He fluffed the rice with a spatula and put it into bowls.", "zh": "他用饭勺把米饭打松，盛进碗里。"}], "vocab": {"verbs": [{"w": "fluff", "ipa": "/flʌf/", "zh": "打松"}, {"w": "measure out", "ipa": "/ˈmeʒər aʊt/", "zh": "量出"}, {"w": "plug in", "ipa": "/plʌɡ ɪn/", "zh": "插上电源"}, {"w": "pour", "ipa": "/pɔːr/", "zh": "倒入"}, {"w": "press", "ipa": "/pres/", "zh": "按"}, {"w": "put", "ipa": "/pʊt/", "zh": "放"}, {"w": "rinse", "ipa": "/rɪns/", "zh": "淘洗"}], "nouns": [{"w": "bowl", "ipa": "/boʊl/", "zh": "碗"}, {"w": "button", "ipa": "/ˈbʌtn/", "zh": "按键"}, {"w": "cup", "ipa": "/kʌp/", "zh": "杯（量杯）"}, {"w": "lid", "ipa": "/lɪd/", "zh": "锅盖"}, {"w": "pot", "ipa": "/pɑːt/", "zh": "锅胆"}, {"w": "rice", "ipa": "/raɪs/", "zh": "米饭；大米"}, {"w": "rice cooker", "ipa": "/raɪs ˈkʊkər/", "zh": "电饭煲"}, {"w": "spatula", "ipa": "/ˈspætʃələ/", "zh": "饭勺"}, {"w": "water", "ipa": "/ˈwɔːtər/", "zh": "水"}], "others": [{"w": "about (prep.)", "ipa": "/əˈbaʊt/", "zh": "大约"}]}, "notes": [{"en": "A rice cooker cooks the rice by itself; you just press the cook button.", "zh": "电饭煲会自动煮饭，你只需按下煮饭键。"}, {"en": "Rinse the rice before cooking to make it clean and soft.", "zh": "煮饭前先淘米，饭会更干净松软。"}], "dialogue": [{"speaker": "Paul", "role": "clerk", "en": "Let's see if this rice is ready.", "zh": "看看这锅饭好了没。"}, {"speaker": "Mom", "role": "mom", "en": "It smells great! Yep, it's done.", "zh": "闻起来真香！好了，可以吃了。"}], "china": [{"en": "Almost every Chinese family cooks rice with an electric rice cooker.", "zh": "几乎每个中国家庭都用电磁炉配锅或电饭煲煮饭。"}, {"en": "Rinsing rice is still common, but many people buy ready-to-cook rice.", "zh": "淘米在中国很常见，也有人直接买免淘米。"}], "en": "Cooking Rice", "zh": "煮米饭", "grammarZh": "一般过去时"}, {"id": 25, "section": 3, "level": 1, "img": "assets/img/unit25.jpg", "grammar": "SIMPLE PAST", "grammarNote": {"en": "Simple past (sat down, put, used, helped, passed, ate, talked, had) describes the whole dinner sequence. Note set the table uses the fixed expression 'set a table.'", "zh": "用一般过去时（sat down 坐下、put 放、used 使用、helped oneself 自取、passed 递、ate 吃、talked 聊天、had 吃）描述整个晚餐过程。注意摆桌固定说法是 set a table。"}, "steps": [{"en": "Paul and Kate set the table. Everyone sat down at the round table.", "zh": "保罗和凯特摆好餐具，大家围坐在圆桌旁。"}, {"en": "They put some paper tissues on the table.", "zh": "他们在桌上放了一些纸巾。"}, {"en": "Everyone used chopsticks to pick up food from the shared dishes.", "zh": "大家用筷子从共享的菜盘里夹菜。"}, {"en": "Paul passed the rice bowl to Kate.", "zh": "保罗把饭碗递给凯特。"}, {"en": "As they ate, they talked.", "zh": "他们一边吃一边聊天。"}, {"en": "After the meal, they had some fruit.", "zh": "饭后，他们吃了一些水果。"}, {"en": "Then they helped clear the table together.", "zh": "然后他们一起帮忙收拾桌子。"}], "vocab": {"verbs": [{"w": "clear (the table)", "ipa": "/klɪr/", "zh": "收拾（桌子）"}, {"w": "eat / ate", "ipa": "/iːt / eɪt/", "zh": "吃"}, {"w": "have / had", "ipa": "/hæv / hæd/", "zh": "吃；喝；有"}, {"w": "help oneself", "ipa": "/help wʌnˈself/", "zh": "自取（食物）"}, {"w": "pass", "ipa": "/pæs/", "zh": "递过去；传"}, {"w": "pick up", "ipa": "/pɪk ʌp/", "zh": "夹起；拿起"}, {"w": "put", "ipa": "/pʊt/", "zh": "放"}, {"w": "set (a table)", "ipa": "/set/", "zh": "摆（餐具）"}, {"w": "sit down", "ipa": "/sɪt daʊn/", "zh": "坐下"}, {"w": "talk", "ipa": "/tɔːk/", "zh": "聊天；说话"}, {"w": "use", "ipa": "/juːz/", "zh": "使用"}], "nouns": [{"w": "chopsticks", "ipa": "/ˈtʃɑːpstɪks/", "zh": "筷子"}, {"w": "dinner", "ipa": "/ˈdɪnər/", "zh": "晚餐；正餐"}, {"w": "food", "ipa": "/fuːd/", "zh": "食物"}, {"w": "fruit", "ipa": "/fruːt/", "zh": "水果"}, {"w": "plate", "ipa": "/pleɪt/", "zh": "盘子"}, {"w": "rice", "ipa": "/raɪs/", "zh": "米饭"}, {"w": "round table", "ipa": "/raʊnd ˈteɪbl/", "zh": "圆桌"}, {"w": "shared dish", "ipa": "/ʃerd dɪʃ/", "zh": "共享的菜盘"}, {"w": "table", "ipa": "/ˈteɪbl/", "zh": "桌子；餐桌"}, {"w": "tissue", "ipa": "/ˈtɪʃuː/", "zh": "纸巾"}, {"w": "watermelon", "ipa": "/ˈwɔːtərmelən/", "zh": "西瓜"}], "others": [{"w": "together (adv.)", "ipa": "/təˈɡeðər/", "zh": "一起"}]}, "notes": [{"en": "help yourself = take something for yourself.", "zh": "help yourself 意思是自己动手拿（食物），别客气。"}, {"en": "In China, everyone eats from shared dishes in the middle of the table with chopsticks.", "zh": "在中国，大家围着圆桌用筷子夹取中间的共享菜。"}, {"en": "Paper tissues are more common than cloth napkins at Chinese dinner tables.", "zh": "中式餐桌更多用纸巾，而不是布餐巾。"}], "dialogue": [{"speaker": "Kate", "role": "girl", "en": "Pass the rice, please.", "zh": "请把米饭递一下。"}, {"speaker": "Mom", "role": "mom", "en": "So, where did you go today?", "zh": "你今天去哪儿了？"}, {"speaker": "Paul", "role": "clerk", "en": "Nowhere special. I played with Tom.", "zh": "没去哪儿，我和汤姆玩了。"}, {"speaker": "Paul", "role": "clerk", "en": "I'll have a bit more rice.", "zh": "我再添点米饭。"}, {"speaker": "Tom", "role": "clerk", "en": "Mmm. Watermelon!", "zh": "嗯，西瓜！"}, {"speaker": "Mom", "role": "mom", "en": "Looks good. Have some more.", "zh": "看起来不错，多吃点。"}], "china": [{"en": "Chinese dinner tables are usually round, with shared dishes in the middle; everyone uses chopsticks and paper tissues.", "zh": "中式晚餐一般是圆桌、菜放中间，大家用筷子和纸巾。"}, {"en": "Fruit often comes after the meal instead of Western-style dessert.", "zh": "中式晚餐饭后常吃水果，而不是西式甜点。"}, {"en": "When Chinese people want more food they often say \"再添点饭\" rather than helping themselves without asking.", "zh": "中国人添饭时常会说“再给我盛点饭”，而不是默不作声地自己加。"}], "en": "Eating Dinner", "zh": "一家人吃晚餐", "grammarZh": "一般过去时"}, {"id": 26, "section": 3, "level": 1, "img": "assets/img/unit26.jpg", "grammar": "SIMPLE PAST", "grammarNote": {"en": "Simple past (offered, stacked, carried, took, put, scraped, wiped, threw) describes cleaning up after dinner.", "zh": "用一般过去时（offered 主动提出、stacked 摞起、carried 端走、took 拿走、put 放、scraped 刮、wiped 擦、threw 扔）描述饭后收拾餐桌的过程。"}, "steps": [{"en": "After everyone was done, Paul and Kate offered to clear the table.", "zh": "大家吃完后，保罗和凯特主动提出收拾桌子。"}, {"en": "They stacked up the dirty dishes and carried them to the kitchen.", "zh": "他们把脏盘子摞起来，端到厨房。"}, {"en": "They took the serving dishes off the table and put the leftovers into containers, which they put into the refrigerator.", "zh": "他们把大盘子端下餐桌，把剩菜装进保鲜盒，再放进冰箱。"}, {"en": "They scraped the scraps from the plates into the garbage.", "zh": "他们把盘子里的残渣刮进垃圾桶。"}, {"en": "Then they wiped the table off and threw the scraps and crumbs from the table into the garbage.", "zh": "然后把桌子擦干净，把桌上的残渣和面包屑也扫进垃圾桶。"}], "vocab": {"verbs": [{"w": "carry", "ipa": "/ˈkæri/", "zh": "端；搬；拿"}, {"w": "clear", "ipa": "/klɪr/", "zh": "收拾（餐桌）"}, {"w": "offer", "ipa": "/ˈɔːfər/", "zh": "主动提出；主动帮忙"}, {"w": "put into", "ipa": "/pʊt ˈɪntuː/", "zh": "放进"}, {"w": "scrape", "ipa": "/skreɪp/", "zh": "刮；擦刮"}, {"w": "stack up", "ipa": "/stæk ʌp/", "zh": "把…摞起来"}, {"w": "take off", "ipa": "/teɪk ɔːf/", "zh": "从…拿走；撤下"}, {"w": "throw", "ipa": "/θroʊ/", "zh": "扔"}, {"w": "wipe off", "ipa": "/waɪp ɔːf/", "zh": "擦干净；擦去"}], "nouns": [{"w": "container", "ipa": "/kənˈteɪnər/", "zh": "容器；保鲜盒"}, {"w": "crumb", "ipa": "/krʌm/", "zh": "面包屑；碎屑"}, {"w": "dish", "ipa": "/dɪʃ/", "zh": "盘子；餐具"}, {"w": "garbage", "ipa": "/ˈɡɑːrbɪdʒ/", "zh": "垃圾"}, {"w": "kitchen", "ipa": "/ˈkɪtʃɪn/", "zh": "厨房"}, {"w": "leftovers", "ipa": "/ˈleftoʊvərz/", "zh": "剩菜剩饭"}, {"w": "plate", "ipa": "/pleɪt/", "zh": "盘子"}, {"w": "refrigerator", "ipa": "/rɪˈfrɪdʒəreɪtər/", "zh": "冰箱"}, {"w": "scrap", "ipa": "/skræp/", "zh": "（食物的）残渣"}, {"w": "serving dish", "ipa": "/ˈsɜːrvɪŋ dɪʃ/", "zh": "盛菜的大盘"}, {"w": "table", "ipa": "/ˈteɪbl/", "zh": "餐桌"}], "others": [{"w": "dirty (adj.)", "ipa": "/ˈdɜːrti/", "zh": "脏的"}, {"w": "done (adj.)", "ipa": "/dʌn/", "zh": "吃完的；做完的"}]}, "notes": [{"en": "If you offer to do something, you say you'll do it even though no one asked you to.", "zh": "offer to do something 指没人请你，你也主动说要去做。"}, {"en": "Leftovers are amounts of food to keep after a dinner.", "zh": "leftovers 指饭后留下来的剩菜。"}, {"en": "Crumbs (small pieces of bread) and scraps are pieces of food to throw away after a dinner.", "zh": "crumbs（面包屑）和 scraps（食物残渣）是饭后要扔掉的零碎食物。"}, {"en": "You stack things up by putting them on top of one another. You are done eating when you have finished your meal.", "zh": "stack up 就是把东西一个摞一个。吃完饭就说 you are done eating。"}], "dialogue": [{"speaker": "Kate", "role": "家人", "en": "Paul and I will clear up.", "zh": "我和保罗来收拾。"}, {"speaker": "Paul", "role": "家人", "en": "Yeah. The rest of you just sit and relax.", "zh": "对，你们其他人坐着歇会儿吧。"}], "china": [{"en": "In many Chinese families, one person (often the mother or whoever cooked) clears the table; using plastic food containers (保鲜盒) for leftovers is also very common.", "zh": "中国家庭饭后通常由一个人（常是做饭的妈妈）收拾；用保鲜盒装剩菜放进冰箱也很普遍。"}, {"en": "Chinese homes usually have a kitchen waste (湿垃圾) and other waste (干垃圾) sorting bin, especially in cities like Beijing and Shanghai.", "zh": "现在中国城市（如北京、上海）家里一般会把厨余垃圾和其他垃圾分类装桶。"}, {"en": "Leftovers are often eaten for the next day's lunch, rather than being thrown away.", "zh": "剩菜常常留到第二天中午热一热再吃，而不是直接扔掉。"}], "en": "Clearing the Table", "zh": "收拾餐桌", "grammarZh": "一般过去时"}, {"id": 27, "section": 3, "level": 1, "img": "assets/img/unit27.jpg", "grammar": "SIMPLE PAST", "grammarNote": {"en": "Simple past (put, filled, washed, scrubbed, rinsed, pulled, dried) describes the whole hand-washing-dishes routine.", "zh": "用一般过去时（put 塞、filled 放水、washed 洗、scrubbed 用力刷、rinsed 冲净、pulled 拔、dried 擦干）描述整套手洗碗筷的流程。"}, "steps": [{"en": "Paul put the plug into the drain in the sink and filled the sink with water.", "zh": "保罗把水槽塞子塞好，往水槽里放满水。"}, {"en": "He put some dish soap into the water.", "zh": "他在水里挤了些洗洁精。"}, {"en": "He washed the dirty dishes with a dishcloth, and scrubbed some very dirty dishes with a scrubbing pad.", "zh": "他用洗碗布洗脏盘子，特别脏的地方用百洁布刷一刷。"}, {"en": "Then he rinsed the dishes.", "zh": "然后他把碗碟冲洗干净。"}, {"en": "He put the wet dishes in the dish rack, where the water dripped off them.", "zh": "他把湿碗碟放进碗架，让水沥掉。"}, {"en": "Then he pulled the plug from the sink and the dirty water went down the drain.", "zh": "接着他拔出水槽塞子，脏水流进下水道。"}, {"en": "He dried the dishes with a dish towel and put the dishes away in the cupboard.", "zh": "他用抹布把碗碟擦干，再放进碗橱收好。"}], "vocab": {"verbs": [{"w": "do dishes", "ipa": "/duː ˈdɪʃɪz/", "zh": "洗碗"}, {"w": "drip", "ipa": "/drɪp/", "zh": "（水）滴落；滴"}, {"w": "dry", "ipa": "/draɪ/", "zh": "擦干；弄干"}, {"w": "fill", "ipa": "/fɪl/", "zh": "装满；放满"}, {"w": "go down", "ipa": "/ɡoʊ daʊn/", "zh": "流下去；（水）流走"}, {"w": "pull", "ipa": "/pʊl/", "zh": "拔；拉"}, {"w": "put away", "ipa": "/pʊt əˈweɪ/", "zh": "收好；放回原处"}, {"w": "rinse", "ipa": "/rɪns/", "zh": "冲洗干净"}, {"w": "scrub", "ipa": "/skrʌb/", "zh": "用力刷；擦洗"}, {"w": "wash", "ipa": "/wɑːʃ/", "zh": "洗"}], "nouns": [{"w": "cupboard", "ipa": "/ˈkʌbərd/", "zh": "碗柜；橱柜"}, {"w": "dish", "ipa": "/dɪʃ/", "zh": "盘子；碗碟"}, {"w": "dishcloth", "ipa": "/ˈdɪʃklɔːθ/", "zh": "洗碗布"}, {"w": "dish rack", "ipa": "/dɪʃ ræk/", "zh": "碗碟沥水架"}, {"w": "dish towel", "ipa": "/dɪʃ ˈtaʊəl/", "zh": "擦碗布"}, {"w": "drain", "ipa": "/dreɪn/", "zh": "下水道；排水口"}, {"w": "plug", "ipa": "/plʌɡ/", "zh": "水槽塞子"}, {"w": "scrubbing pad", "ipa": "/ˈskrʌbɪŋ pæd/", "zh": "百洁布；刷碗垫"}, {"w": "sink", "ipa": "/sɪŋk/", "zh": "水槽；洗碗池"}, {"w": "soap", "ipa": "/soʊp/", "zh": "肥皂；洗洁精"}, {"w": "towel", "ipa": "/ˈtaʊəl/", "zh": "毛巾；布"}, {"w": "water", "ipa": "/ˈwɔːtər/", "zh": "水"}], "others": [{"w": "dirty (adj.)", "ipa": "/ˈdɜːrti/", "zh": "脏的"}, {"w": "wet (adj.)", "ipa": "/wet/", "zh": "湿的"}]}, "notes": [{"en": "Dish soap is also called 'detergent.'", "zh": "dish soap 也叫 detergent（洗涤剂）。"}, {"en": "You scrub something by rubbing very hard and for a long time as you wash it.", "zh": "scrub（用力刷）指洗碗时使劲、长时间地摩擦。"}, {"en": "Water that goes down the drain is gone. 'Down the drain' is used to mean 'wasted' or 'gone': 'All his hard work went down the drain.'", "zh": "水流进下水道就没了。down the drain 引申为“白费、付诸东流”，比如 All his hard work went down the drain.（他的努力全白费了。）"}], "dialogue": [], "china": [{"en": "Dishwashers are still not common in Chinese homes; most people wash dishes by hand at the kitchen sink.", "zh": "洗碗机在中国家庭里还不普及，大多数人还是在水槽边手洗碗筷。"}, {"en": "Chinese kitchens usually have a two-compartment sink with hot water on tap; a dish rack near the window is very common.", "zh": "中国厨房一般是双槽洗菜池，有热水；窗边放个沥水碗架也很常见。"}, {"en": "Dish soap is usually called 'xiéjīng (洗洁精)' in Chinese; people also use baking soda or hot water to cut grease.", "zh": "洗洁精中文就叫“洗洁精”；去油重时也会用热水或小苏打。"}], "en": "Doing Dishes", "zh": "洗碗", "grammarZh": "一般过去时"}, {"id": 28, "section": 3, "level": 1, "img": "assets/img/unit28.jpg", "grammar": "SIMPLE PAST", "grammarNote": {"en": "Simple past narration (chose, put on, pressed, listened, paused, stopped, put down) describes listening to songs on a phone in the evening.", "zh": "用一般过去时（chose 选择、put on 戴上、pressed 按下、listened 听、paused 暂停、stopped 停止、put down 放下）描述晚上用手机听歌的过程。"}, "steps": [{"en": "I chose a song on my mom's phone.", "zh": "我在妈妈手机上选了一首歌。"}, {"en": "I put on my earphones.", "zh": "我戴上耳机。"}, {"en": "I pressed play.", "zh": "我按下播放键。"}, {"en": "I listened to the music.", "zh": "我听着音乐。"}, {"en": "When Dad called me, I pressed pause.", "zh": "爸爸叫我时，我按了暂停。"}, {"en": "Then I pressed play again.", "zh": "然后我又按下播放键。"}, {"en": "At night, I stopped the music and put the phone down.", "zh": "晚上，我停掉音乐，把手机放下。"}], "vocab": {"verbs": [{"w": "choose / chose", "ipa": "/tʃuːz / tʃoʊz/", "zh": "选择"}, {"w": "listen to", "ipa": "/ˈlɪsn tuː/", "zh": "听"}, {"w": "pause", "ipa": "/pɔːz/", "zh": "暂停"}, {"w": "play", "ipa": "/pleɪ/", "zh": "播放"}, {"w": "press", "ipa": "/pres/", "zh": "按（按钮）"}, {"w": "put down", "ipa": "/pʊt daʊn/", "zh": "放下"}, {"w": "put on", "ipa": "/pʊt ɑːn/", "zh": "戴上（耳机）"}, {"w": "skip", "ipa": "/skɪp/", "zh": "跳（到下一首）"}, {"w": "stop", "ipa": "/stɑːp/", "zh": "停止"}, {"w": "turn up", "ipa": "/tɜːrn ʌp/", "zh": "调大（音量）"}], "nouns": [{"w": "app", "ipa": "/æp/", "zh": "应用程序"}, {"w": "button", "ipa": "/ˈbʌtn/", "zh": "按钮"}, {"w": "earphone(s)", "ipa": "/ˈɪrfoʊnz/", "zh": "耳机"}, {"w": "music", "ipa": "/ˈmjuːzɪk/", "zh": "音乐"}, {"w": "phone", "ipa": "/foʊn/", "zh": "手机"}, {"w": "song", "ipa": "/sɔːŋ/", "zh": "歌曲"}], "others": [{"w": "again (adv.)", "ipa": "/əˈɡen/", "zh": "再一次"}, {"w": "finally (adv.)", "ipa": "/ˈfaɪnəli/", "zh": "最后"}, {"w": "next (adj.)", "ipa": "/nekst/", "zh": "下一首的"}]}, "notes": [{"en": "A music app on the phone, like QQ Music or NetEase Cloud Music, lets you choose songs and press play.", "zh": "手机上的音乐 App（如 QQ 音乐、网易云音乐）可以让你选歌并按下播放。"}, {"en": "Pause means to stop for a short time. You can press play again to continue.", "zh": "pause 是暂停一会儿，再按播放键可以继续。"}, {"en": "Put on your earphones before you press play, so the music is only for you.", "zh": "按播放前先戴上耳机，这样音乐只属于你自己。"}], "dialogue": [], "china": [{"en": "In China, children listen to songs and audio stories on their parents' phones with apps like QQ Music and NetEase Cloud Music.", "zh": "在中国，孩子常用爸爸妈妈的手机，通过 QQ 音乐、网易云音乐等 App 听歌和听故事。"}, {"en": "Many Chinese families limit screen time for kids, so the phone is often Mom or Dad's, not the child's own.", "zh": "很多中国家庭会控制孩子看屏幕的时间，手机通常是爸爸妈妈的，不是孩子自己的。"}], "en": "Listening to Music on a Phone", "zh": "用手机听歌", "grammarZh": "一般过去时"}, {"id": 29, "section": 3, "level": 1, "img": "assets/img/unit29.jpg", "grammar": "SIMPLE PAST", "grammarNote": {"en": "Simple past (put on, chose, pressed, turned up, turned down, listened, took off) describes listening to songs with earphones on a phone.", "zh": "用一般过去时（put on 戴上、chose 选择、pressed 按下、turned up 调大、turned down 调小、listened 听、took off 摘下）描述戴耳机用手机听歌的过程。"}, "steps": [{"en": "I put on my earphones.", "zh": "我戴上耳机。"}, {"en": "I chose a song on the phone.", "zh": "我在手机上选了一首歌。"}, {"en": "I pressed play.", "zh": "我按下播放键。"}, {"en": "I turned the volume up a little to hear it better.", "zh": "我把音量调大一点，听得更清楚。"}, {"en": "Then I turned it down a little.", "zh": "然后我又调小了一点。"}, {"en": "I listened to the songs for a while.", "zh": "我听了一会儿歌。"}, {"en": "When I finished, I took off my earphones.", "zh": "听完后，我摘下耳机。"}], "vocab": {"verbs": [{"w": "choose / chose", "ipa": "/tʃuːz / tʃoʊz/", "zh": "选择"}, {"w": "listen", "ipa": "/ˈlɪsn/", "zh": "听"}, {"w": "play", "ipa": "/pleɪ/", "zh": "播放"}, {"w": "press", "ipa": "/pres/", "zh": "按（按钮）"}, {"w": "put on", "ipa": "/pʊt ɑːn/", "zh": "戴上（耳机）"}, {"w": "take off", "ipa": "/teɪk ɔːf/", "zh": "摘下"}, {"w": "turn down", "ipa": "/tɜːrn daʊn/", "zh": "调小（音量）"}, {"w": "turn up", "ipa": "/tɜːrn ʌp/", "zh": "调大（音量）"}], "nouns": [{"w": "button", "ipa": "/ˈbʌtn/", "zh": "按钮"}, {"w": "earphone(s)", "ipa": "/ˈɪrfoʊnz/", "zh": "耳机"}, {"w": "music", "ipa": "/ˈmjuːzɪk/", "zh": "音乐"}, {"w": "phone", "ipa": "/foʊn/", "zh": "手机"}, {"w": "song", "ipa": "/sɔːŋ/", "zh": "歌曲"}, {"w": "volume", "ipa": "/ˈvɑːljuːm/", "zh": "音量"}], "others": [{"w": "a little (adverbial)", "ipa": "/ə ˈlɪtl/", "zh": "一点点"}, {"w": "better (adj.)", "ipa": "/ˈbetər/", "zh": "更清楚的"}, {"w": "for a while (adverbial)", "ipa": "/fər ə waɪl/", "zh": "一会儿"}]}, "notes": [{"en": "Turn up means to make the sound louder. Turn down means to make the sound softer.", "zh": "turn up 是把声音调大，turn down 是把声音调小。"}, {"en": "Wearing earphones helps others in the room enjoy quiet. You hear the music only yourself.", "zh": "戴上耳机不会吵到房间里的其他人，音乐只属于你自己。"}, {"en": "Too much loud music is bad for your ears, so keep the volume low.", "zh": "音乐太响会伤耳朵，所以要控制音量。"}], "dialogue": [], "china": [{"en": "In China, most people listen to music with Bluetooth earphones or earbuds; wired earphone jacks are disappearing from new phones.", "zh": "在中国，大家主要用蓝牙耳机听歌，新手机几乎没有了耳机孔。"}, {"en": "Kids' listening time on the phone is often limited by parents, for eye and ear health.", "zh": "为了保护视力和听力，中国家长常会限制孩子用手机听音频的时间。"}], "en": "Listening with Earphones", "zh": "戴耳机听音频", "grammarZh": "一般过去时"}, {"id": 30, "section": 3, "level": 1, "img": "assets/img/unit30.jpg", "grammar": "SIMPLE PAST", "grammarNote": {"en": "Simple past (opened, turned, saw, looked up, finished, closed, picked up, flipped through, found, read) describes reading a book and a magazine.", "zh": "用一般过去时（opened 打开、turned 翻页、saw 看到、looked up 查阅、finished 读完、closed 合上、picked up 拿起、flipped through 快速翻、found 找到、read 读）描述看书和翻杂志的过程。"}, "steps": [{"en": "Jenny opened her picture book and turned the pages.", "zh": "珍妮翻开图画书，一页页翻看。"}, {"en": "She looked at the pictures and read the story.", "zh": "她看着插图，读着故事。"}, {"en": "When she saw a word she didn't know, she looked it up in a dictionary.", "zh": "遇到不认识的单词，她就查词典。"}, {"en": "When she finished reading, she closed the book.", "zh": "读完后，她合上了书。"}, {"en": "She picked up another book from the shelf.", "zh": "她从书架上拿起另一本书。"}, {"en": "She flipped through it until she found an interesting story.", "zh": "她快速翻页，找到一篇有趣的故事。"}, {"en": "She read the story and looked at the pictures.", "zh": "她读着故事，看着插图。"}], "vocab": {"verbs": [{"w": "close", "ipa": "/kloʊz/", "zh": "合上"}, {"w": "find", "ipa": "/faɪnd/", "zh": "找到"}, {"w": "finish", "ipa": "/ˈfɪnɪʃ/", "zh": "完成；读完"}, {"w": "flip through", "ipa": "/flɪp θruː/", "zh": "快速翻阅"}, {"w": "look at", "ipa": "/lʊk æt/", "zh": "看"}, {"w": "look up", "ipa": "/lʊk ʌp/", "zh": "查（词典）"}, {"w": "open", "ipa": "/ˈoʊpən/", "zh": "打开"}, {"w": "pick up", "ipa": "/pɪk ʌp/", "zh": "拿起"}, {"w": "read", "ipa": "/riːd/", "zh": "读"}, {"w": "see", "ipa": "/siː/", "zh": "看见"}, {"w": "turn", "ipa": "/tɜːrn/", "zh": "翻（页）"}], "nouns": [{"w": "book", "ipa": "/bʊk/", "zh": "书"}, {"w": "dictionary", "ipa": "/ˈdɪkʃəneri/", "zh": "词典"}, {"w": "page", "ipa": "/peɪdʒ/", "zh": "页"}, {"w": "picture", "ipa": "/ˈpɪktʃər/", "zh": "插图；图画"}, {"w": "picture book", "ipa": "/ˈpɪktʃər bʊk/", "zh": "图画书"}, {"w": "rabbit", "ipa": "/ˈræbɪt/", "zh": "兔子"}, {"w": "shelf", "ipa": "/ʃelf/", "zh": "书架"}, {"w": "story", "ipa": "/ˈstɔːri/", "zh": "故事"}], "others": [{"w": "until (conj.)", "ipa": "/ənˈtɪl/", "zh": "直到"}]}, "notes": [{"en": "Reading picture books every day is a good habit.", "zh": "每天读图画书是个好习惯。"}, {"en": "When you see a new word, look it up in a dictionary or ask a grown-up.", "zh": "遇到生词时，查词典或问大人。"}], "dialogue": [{"speaker": "Mom", "role": "mom", "en": "What are you reading, Jenny?", "zh": "你在读什么呀，珍妮？"}, {"speaker": "Jenny", "role": "girl", "en": "A story about a little rabbit.", "zh": "一个关于小兔子的故事。"}, {"speaker": "Mom", "role": "mom", "en": "Nice! Read it to me later.", "zh": "真好！一会儿读给我听听。"}], "china": [{"en": "Chinese children often read picture books and leveled readers at home.", "zh": "中国孩子在家常读图画书和分级读物。"}, {"en": "Many kids use an e-dictionary or a reading pen to look up new words.", "zh": "很多孩子用电子词典或点读笔查生词。"}], "en": "Reading", "zh": "阅读", "grammarZh": "一般过去时"}, {"id": 31, "section": 3, "level": 1, "img": "assets/img/unit31.jpg", "grammar": "Simple Past", "grammarNote": {"en": "The simple past tense describes completed actions that happened and finished at a specific time in the past. Regular verbs add -ed (e.g., watched, turned), while irregular verbs change form (e.g., go→went). / 一般过去时描述在过去某个特定时间发生并已完成的动作。规则动词加 -ed（如 watched、turned），不规则动词则改变形式（如 go→went）。", "zh": "一般过去时"}, "steps": [{"en": "Tom picked up the remote for the TV...", "zh": "汤姆拿起电视遥控器……"}, {"en": "...and turned the TV on.", "zh": "……打开了电视。"}, {"en": "A cartoon was on.", "zh": "电视上正在播动画片。"}, {"en": "Tom didn't want to watch it...", "zh": "汤姆不想看这个……"}, {"en": "...so he used the remote...", "zh": "……于是他拿起遥控器……"}, {"en": "...to change channels.", "zh": "……换频道。"}, {"en": "He turned up the volume so he could hear better.", "zh": "他调大了音量，好听得更清楚。"}, {"en": "During a commercial...", "zh": "放广告的时候……"}, {"en": "...he went to the kitchen for a snack.", "zh": "……他去厨房找零食吃。"}, {"en": "He watched his favorite cartoon again...", "zh": "他又看起了最喜欢的动画片……"}, {"en": "...and when it ended,...", "zh": "……等动画片结束……"}, {"en": "...he turned the TV off.", "zh": "……他关掉了电视。"}], "vocab": {"verbs": [{"w": "change", "ipa": "/tʃeɪndʒ/", "zh": "改变；更换"}, {"w": "end", "ipa": "/end/", "zh": "结束"}, {"w": "go / went", "ipa": "/ɡoʊ/", "zh": "去"}, {"w": "hear / heard", "ipa": "/hɪr/", "zh": "听见"}, {"w": "pick up", "ipa": "/pɪk ʌp/", "zh": "拿起；捡起"}, {"w": "turn off", "ipa": "/tɜːrn ɔːf/", "zh": "关掉"}, {"w": "turn on", "ipa": "/tɜːrn ɑːn/", "zh": "打开"}, {"w": "turn up", "ipa": "/tɜːrn ʌp/", "zh": "调大（音量）"}, {"w": "use", "ipa": "/juːz/", "zh": "使用"}, {"w": "want", "ipa": "/wɑːnt/", "zh": "想要"}, {"w": "watch", "ipa": "/wɑːtʃ/", "zh": "观看"}], "nouns": [{"w": "channel", "ipa": "/ˈtʃænəl/", "zh": "频道"}, {"w": "commercial", "ipa": "/kəˈmɜːrʃəl/", "zh": "商业广告"}, {"w": "game show", "ipa": "/ɡeɪm ʃoʊ/", "zh": "游戏节目"}, {"w": "kitchen", "ipa": "/ˈkɪtʃɪn/", "zh": "厨房"}, {"w": "news", "ipa": "/nuːz/", "zh": "新闻"}, {"w": "remote", "ipa": "/rɪˈmoʊt/", "zh": "遥控器"}, {"w": "snack", "ipa": "/snæk/", "zh": "零食"}, {"w": "television", "ipa": "/ˈtelɪvɪʒn/", "zh": "电视（机）"}, {"w": "TV", "ipa": "/ˌtiːˈviː/", "zh": "电视"}, {"w": "volume", "ipa": "/ˈvɑːljuːm/", "zh": "音量"}], "others": [{"w": "better (adv.)", "ipa": "/ˈbetər/", "zh": "更好地（well 的比较级）"}]}, "notes": [{"en": "TV is a short way of saying \"television.\"", "zh": "TV 是 television 的简称。"}, {"en": "Tom says a show is boring. That means it is not interesting.", "zh": "汤姆说节目很无聊，意思是这个节目没意思。"}, {"en": "A commercial is advertising on TV or radio.", "zh": "商业广告是电视或广播上播出的广告。"}, {"en": "The news is a report about what has happened. It always has an \"s\" at the end.", "zh": "news 是关于所发生事情的报道，词尾总是带 \"s\"。"}, {"en": "TVs have channels while radios have stations.", "zh": "电视机有频道（channels），而收音机有电台（stations）。"}, {"en": "A remote is also called a remote control.", "zh": "remote 也叫作 remote control。"}], "dialogue": [{"speaker": "TV", "role": "teacher", "en": "Now, for fifty-three dollars, what's the name of...", "zh": "现在，五十三美元奖金，请问……叫什么名字？"}, {"speaker": "Tom", "role": "clerk", "en": "That's boring.", "zh": "真无聊。"}, {"speaker": "Tom", "role": "clerk", "en": "That's the end of the cartoon.", "zh": "动画片放完了。"}], "china": [{"en": "In China, children watch cartoons on TV, and parents often limit screen time.", "zh": "在中国，孩子看电视上的动画片，爸爸妈妈常常会限制看电视的时间。可以说 cartoon（动画片）、screen time（屏幕时间）。"}, {"en": "The remote control is called yaokongqi (遥控器) in Chinese.", "zh": "在中国，遥控器叫“遥控器”。可以说 remote control（遥控器）。"}], "en": "Watching Television", "zh": "看电视", "grammarZh": "一般过去时"}, {"id": 32, "section": 3, "level": 1, "img": "assets/img/unit32.jpg", "grammar": "Simple Past", "grammarNote": {"en": "The simple past tense describes completed actions: chose, pressed, watched, replayed, paused, stopped, closed. Irregular verbs: choose→chose, see→saw.", "zh": "一般过去时描述已完成的动作：chose、pressed、watched、replayed、paused、stopped、closed。不规则动词：choose→chose。"}, "steps": [{"en": "Jenny chose a cartoon on the tablet.", "zh": "珍妮在平板上选了一部动画片。"}, {"en": "She pressed play.", "zh": "她按下播放键。"}, {"en": "She and Tom watched the video.", "zh": "她和汤姆一起看视频。"}, {"en": "To see something again, she tapped replay.", "zh": "为了再看一遍某段，她点了重播。"}, {"en": "Jenny paused it when Mom called her.", "zh": "妈妈叫她时，珍妮按了暂停。"}, {"en": "At the end of the video, she stopped it.", "zh": "视频结束时，她按了停止。"}, {"en": "She closed the app and put the tablet down.", "zh": "她关掉应用，放下平板。"}], "vocab": {"verbs": [{"w": "choose / chose", "ipa": "/tʃuːz / tʃoʊz/", "zh": "选择"}, {"w": "close", "ipa": "/kloʊz/", "zh": "关闭（应用）"}, {"w": "pause", "ipa": "/pɔːz/", "zh": "暂停"}, {"w": "play", "ipa": "/pleɪ/", "zh": "播放"}, {"w": "press", "ipa": "/pres/", "zh": "按（按钮）"}, {"w": "put down", "ipa": "/pʊt daʊn/", "zh": "放下"}, {"w": "replay", "ipa": "/ˌriːˈpleɪ/", "zh": "重播"}, {"w": "stop", "ipa": "/stɑːp/", "zh": "停止"}, {"w": "tap", "ipa": "/tæp/", "zh": "轻点"}, {"w": "watch", "ipa": "/wɑːtʃ/", "zh": "观看"}], "nouns": [{"w": "app", "ipa": "/æp/", "zh": "应用程序"}, {"w": "cartoon", "ipa": "/kɑːrˈtuːn/", "zh": "动画片"}, {"w": "end", "ipa": "/end/", "zh": "结尾；结束"}, {"w": "tablet", "ipa": "/ˈtæblət/", "zh": "平板电脑"}, {"w": "video", "ipa": "/ˈvɪdioʊ/", "zh": "视频"}], "others": [{"w": "again (adv.)", "ipa": "/əˈɡen/", "zh": "再一次"}, {"w": "later (adv.)", "ipa": "/ˈleɪtər/", "zh": "后来；稍后"}]}, "notes": [{"en": "Replay means to play something again from the beginning or from where you tapped.", "zh": "replay 是从头或从你点的地方再播放一遍。"}, {"en": "When you pause a video, the picture stops but stays on the screen. Press play to go on.", "zh": "暂停视频时画面停下来但还在屏幕上，按播放键继续。"}, {"en": "Watching too long is bad for your eyes. Take a break after a while.", "zh": "看太久伤眼睛，看一会儿要休息一下。"}], "dialogue": [{"speaker": "Tom", "role": "clerk", "en": "I'd like to see that again.", "zh": "我想再看一遍那段。"}], "china": [{"en": "In China, kids watch cartoons on a tablet or phone with apps like iQiyi Kids, Tencent Video, or Bilibili; video stores are long gone.", "zh": "在中国，孩子用平板或手机在爱奇艺儿童、腾讯视频、哔哩哔哩等应用上看动画片，实体影碟店早已消失。"}, {"en": "Many Chinese parents set a screen-time limit and a kids mode on the tablet.", "zh": "很多中国家长会给平板设置使用时长限制和儿童模式。"}], "en": "Watching a Video", "zh": "看视频", "grammarZh": "一般过去时"}, {"id": 33, "section": 3, "level": 1, "img": "assets/img/unit33.jpg", "grammar": "Simple Past", "grammarNote": {"en": "The simple past tense describes completed actions in the past. Many verbs here are irregular: babysit→babysat, draw→drew, put→put, read→read, take→took. / 一般过去时描述过去已完成的动作。本单元很多动词是不规则的：babysit→babysat、draw→drew、put→put、read→read、take→took。", "zh": "一般过去时"}, "steps": [{"en": "Tom took care of his little sister and brother while Mom went out.", "zh": "妈妈出门时，汤姆照顾弟弟和妹妹。"}, {"en": "Mom told them, \"Be good and listen to Tom.\"", "zh": "妈妈叮嘱他们：“要乖，听汤姆的话。”"}, {"en": "Tom took them to the playground.", "zh": "汤姆带他们去游乐场玩。"}, {"en": "Back home, they played with blocks...", "zh": "回到家里，他们玩积木……"}, {"en": "...and drew pictures with crayons.", "zh": "还用蜡笔画画。"}, {"en": "They put a puzzle together.", "zh": "他们一起拼拼图。"}, {"en": "Tom read them a story...", "zh": "汤姆给他们读故事……"}, {"en": "...and they watched a cartoon on TV.", "zh": "然后他们在电视上看动画片。"}, {"en": "When Mom came back, she said, \"Thank you, Tom!\"", "zh": "妈妈回来后说：“谢谢你，汤姆！”"}], "vocab": {"verbs": [{"w": "babysit", "ipa": "/ˈbeɪbisɪt/", "zh": "照看小孩"}, {"w": "come back", "ipa": "/kʌm bæk/", "zh": "回来"}, {"w": "draw", "ipa": "/drɔː/", "zh": "画"}, {"w": "go out", "ipa": "/ɡoʊ aʊt/", "zh": "出门"}, {"w": "listen to", "ipa": "/ˈlɪsn tuː/", "zh": "听……的话"}, {"w": "play", "ipa": "/pleɪ/", "zh": "玩"}, {"w": "put together", "ipa": "/pʊt təˈɡeðər/", "zh": "拼装"}, {"w": "read", "ipa": "/riːd/", "zh": "读"}, {"w": "take", "ipa": "/teɪk/", "zh": "带"}, {"w": "take care of", "ipa": "/teɪk ker əv/", "zh": "照顾"}, {"w": "watch", "ipa": "/wɑːtʃ/", "zh": "看（电视）"}], "nouns": [{"w": "block", "ipa": "/blɑːk/", "zh": "积木"}, {"w": "brother", "ipa": "/ˈbrʌðər/", "zh": "弟弟；哥哥"}, {"w": "cartoon", "ipa": "/kɑːrˈtuːn/", "zh": "动画片"}, {"w": "crayon", "ipa": "/ˈkreɪɑːn/", "zh": "蜡笔"}, {"w": "playground", "ipa": "/ˈpleɪɡraʊnd/", "zh": "游乐场"}, {"w": "puzzle", "ipa": "/ˈpʌzl/", "zh": "拼图"}, {"w": "sister", "ipa": "/ˈsɪstər/", "zh": "妹妹；姐姐"}, {"w": "story", "ipa": "/ˈstɔːri/", "zh": "故事"}], "others": [{"w": "back (adv.)", "ipa": "/bæk/", "zh": "回到家"}]}, "notes": [{"en": "Big brothers and sisters can help take care of little ones.", "zh": "哥哥姐姐可以帮忙照顾弟弟妹妹。"}, {"en": "Play blocks, draw pictures, and put puzzles together to keep kids busy.", "zh": "玩积木、画画、拼拼图能让小孩安静下来。"}], "dialogue": [{"speaker": "Mom", "role": "mom", "en": "Bye, kids. Be good!", "zh": "再见，孩子们。要乖哦！"}, {"speaker": "Tom", "role": "clerk", "en": "Don't worry, Mom. They'll be fine.", "zh": "别担心，妈妈。他们会很乖的。"}, {"speaker": "Tom's sister", "role": "girl", "en": "Tom, can we watch a cartoon?", "zh": "汤姆，我们能看动画片吗？"}, {"speaker": "Tom", "role": "clerk", "en": "Sure. After the puzzle.", "zh": "可以，拼完拼图就看。"}], "china": [{"en": "In two-child families, big siblings often help look after the little ones.", "zh": "在二胎家庭里，大孩子常帮忙照顾弟弟妹妹。"}, {"en": "Community playgrounds with slides and swings are common in Chinese neighborhoods.", "zh": "中国小区里常见带滑梯和秋千的儿童游乐场。"}], "en": "Babysitting", "zh": "照顾弟弟妹妹", "grammarZh": "一般过去时"}, {"id": 34, "section": 3, "level": 1, "img": "assets/img/unit34.jpg", "grammar": "Simple Past", "grammarNote": {"en": "The simple past tense describes completed actions in the evening routine. Irregular verbs include: fall→fell, get→got, go→went, hang→hung, lie→lay, put→put, read→read, say→said, set→set. / 一般过去时描述晚间日常中已完成的动作。不规则动词包括：fall→fell、get→got、go→went、hang→hung、lie→lay、put→put、read→read、say→said、set→set。", "zh": "一般过去时"}, "steps": [{"en": "When it got late,...", "zh": "天晚了……"}, {"en": "...Jenny yawned.", "zh": "……珍妮打了个哈欠。"}, {"en": "She said goodnight to her parents.", "zh": "她跟爸爸妈妈说了晚安。"}, {"en": "She went upstairs to her room...", "zh": "她上楼回到自己的房间……"}, {"en": "...and changed into her nightgown.", "zh": "……换上了睡裙。"}, {"en": "She hung some of her clothes up in the closet...", "zh": "她把一些衣服挂进衣柜……"}, {"en": "...and put her dirty clothes in the laundry basket.", "zh": "……把脏衣服放进洗衣篮。"}, {"en": "She brushed her teeth,...", "zh": "她刷了牙……"}, {"en": "...washed her face,...", "zh": "……洗了脸……"}, {"en": "...and used the toilet.", "zh": "……上了厕所。"}, {"en": "After turning on her bedside lamp,...", "zh": "打开床头灯之后……"}, {"en": "...she turned off the room light.", "zh": "……她关掉了房间的大灯。"}, {"en": "She pulled back the covers...", "zh": "她掀开被子……"}, {"en": "...and got into bed.", "zh": "……躺上了床。"}, {"en": "She set the alarm on her phone...", "zh": "她在手机上设了闹铃……"}, {"en": "...and put it on her nightstand.", "zh": "……把手机放在床头柜上。"}, {"en": "She read in bed for a while.", "zh": "她靠在床上读了一会儿书。"}, {"en": "Finally, she turned off the lamp,...", "zh": "最后，她关掉了台灯……"}, {"en": "...lay down,...", "zh": "……躺好……"}, {"en": "...and fell asleep.", "zh": "……睡着了。"}], "vocab": {"verbs": [{"w": "brush", "ipa": "/brʌʃ/", "zh": "刷"}, {"w": "change", "ipa": "/tʃeɪndʒ/", "zh": "更换"}, {"w": "fall / fell asleep", "ipa": "/fɔːl/", "zh": "入睡"}, {"w": "get / got into", "ipa": "/ɡet/", "zh": "进入；上（床）"}, {"w": "go / went", "ipa": "/ɡoʊ/", "zh": "去"}, {"w": "hang / hung up", "ipa": "/hæŋ/", "zh": "挂起"}, {"w": "lie / lay down", "ipa": "/laɪ/", "zh": "躺下"}, {"w": "pull back", "ipa": "/pʊl/", "zh": "拉开"}, {"w": "put / put in", "ipa": "/pʊt/", "zh": "放入"}, {"w": "put / put on", "ipa": "/pʊt/", "zh": "放在……上"}, {"w": "read / read", "ipa": "/riːd/", "zh": "读"}, {"w": "say / said goodnight", "ipa": "/seɪ/", "zh": "道晚安"}, {"w": "set / set", "ipa": "/set/", "zh": "设置（闹钟）"}, {"w": "turn off", "ipa": "/tɜːrn ɔːf/", "zh": "关掉"}, {"w": "turn on", "ipa": "/tɜːrn ɑːn/", "zh": "打开"}, {"w": "use", "ipa": "/juːz/", "zh": "使用"}, {"w": "wash", "ipa": "/wɑːʃ/", "zh": "洗"}, {"w": "yawn", "ipa": "/jɔːn/", "zh": "打哈欠"}], "nouns": [{"w": "alarm clock", "ipa": "/əˈlɑːrm klɑːk/", "zh": "闹钟"}, {"w": "bed", "ipa": "/bed/", "zh": "床"}, {"w": "closet", "ipa": "/ˈklɑːzɪt/", "zh": "壁橱；衣柜"}, {"w": "clothes", "ipa": "/kloʊðz/", "zh": "衣服"}, {"w": "covers", "ipa": "/ˈkʌvərz/", "zh": "被子；床罩"}, {"w": "face", "ipa": "/feɪs/", "zh": "脸"}, {"w": "lamp", "ipa": "/læmp/", "zh": "灯"}, {"w": "laundry basket", "ipa": "/ˈlɔːndri ˈbæskɪt/", "zh": "洗衣篮"}, {"w": "light", "ipa": "/laɪt/", "zh": "灯；光线"}, {"w": "nightgown", "ipa": "/ˈnaɪtɡaʊn/", "zh": "睡衣"}, {"w": "nightstand", "ipa": "/ˈnaɪtstænd/", "zh": "床头柜"}, {"w": "parents", "ipa": "/ˈperənts/", "zh": "父母"}, {"w": "room", "ipa": "/ruːm/", "zh": "房间"}, {"w": "stairs", "ipa": "/sterz/", "zh": "楼梯"}, {"w": "tooth / teeth", "ipa": "/tuːθ/", "zh": "牙齿"}, {"w": "toilet", "ipa": "/ˈtɔɪlət/", "zh": "马桶"}], "others": [{"w": "bedside (adj.)", "ipa": "/ˈbedsaɪd/", "zh": "床边的"}, {"w": "dirty (adj.)", "ipa": "/ˈdɜːrti/", "zh": "脏的"}, {"w": "finally (adv.)", "ipa": "/ˈfaɪnəli/", "zh": "最后"}, {"w": "for a while (adverbial)", "ipa": "/fər ə waɪl/", "zh": "一会儿"}, {"w": "late (adj.)", "ipa": "/leɪt/", "zh": "晚的"}, {"w": "upstairs (adv.)", "ipa": "/ˌʌpˈsterz/", "zh": "在楼上"}]}, "notes": [{"en": "When she set her alarm clock, she turned the alarm to the time for it to ring in the morning.", "zh": "她设闹钟时，把闹铃调到早上要响的时间。"}, {"en": "The covers are a topsheet, blanket, bedspread, and anything else that someone sleeps under.", "zh": "covers 指床单、毯子、床罩等睡觉时盖的所有东西。"}, {"en": "A nightstand is also called a bedside table.", "zh": "nightstand 也叫作 bedside table。"}, {"en": "A bedside lamp is next to a bed.", "zh": "bedside lamp 就是床头灯，放在床边。"}], "dialogue": [{"speaker": "Mom", "role": "mom", "en": "Goodnight, Jen.", "zh": "晚安，珍。"}, {"speaker": "Jenny", "role": "girl", "en": "Goodnight, Mom, Dad.", "zh": "晚安，妈妈，爸爸。"}], "china": [{"en": "In China, children often say 'wan an' (晚安) to parents before bed.", "zh": "在中国，孩子睡前会对爸爸妈妈说“晚安”。可以说 say goodnight（说晚安）。"}, {"en": "Many children use their phone as an alarm clock now.", "zh": "现在很多孩子用手机当闹钟。可以说 set an alarm（定闹铃）。"}], "en": "Going to Bed", "zh": "上床睡觉", "grammarZh": "一般过去时"}, {"id": 35, "section": 4, "level": 1, "img": "assets/img/unit35.jpg", "grammar": "Simple Future", "grammarNote": {"en": "The simple future tense uses \"will\" (contracted as 'll) or \"be going to\" to describe actions that will happen later. This unit describes a laundry plan. / 一般将来时用 will（缩略为 'll）或 be going to 描述稍后要做的动作。本单元描述一个洗衣计划。", "zh": "一般将来时"}, "steps": [{"en": "Later today, I'm going to do my laundry.", "zh": "今天晚些时候，我要洗衣服。"}, {"en": "I'll put my dirty clothes in the laundry basket.", "zh": "我把脏衣服放进洗衣篮。"}, {"en": "I'll sort them by separating dark colors from light.", "zh": "我把深色和浅色的衣服分开。"}, {"en": "I'll check the pockets and take out anything in them.", "zh": "我检查口袋，把里面的东西都拿出来。"}, {"en": "I'll put a load of laundry into the washing machine.", "zh": "我把一批衣服放进洗衣机。"}, {"en": "I'll put in some detergent and turn the machine on.", "zh": "我放一些洗衣液，然后开机。"}, {"en": "The machine will wash and spin the laundry.", "zh": "洗衣机会洗涤、脱水。"}, {"en": "I'll take the wet clothes out and hang them on the balcony rack.", "zh": "我把湿衣服拿出来，挂到阳台晾衣架上。"}, {"en": "When they're dry, I'll fold the clothes.", "zh": "衣服干了，我就叠好。"}, {"en": "I'll put them into the drawers.", "zh": "我把叠好的衣服放进抽屉。"}], "vocab": {"verbs": [{"w": "be going to (aux.)", "ipa": "/bi ˈɡoʊɪŋ tuː/", "zh": "将要"}, {"w": "check", "ipa": "/tʃek/", "zh": "检查"}, {"w": "do laundry", "ipa": "/duː ˈlɔːndri/", "zh": "洗衣服"}, {"w": "fold", "ipa": "/foʊld/", "zh": "叠"}, {"w": "hang out", "ipa": "/hæŋ aʊt/", "zh": "晾晒"}, {"w": "put", "ipa": "/pʊt/", "zh": "放"}, {"w": "sort", "ipa": "/sɔːrt/", "zh": "分类"}, {"w": "spin", "ipa": "/spɪn/", "zh": "脱水；旋转"}, {"w": "take out", "ipa": "/teɪk aʊt/", "zh": "拿出"}, {"w": "turn on", "ipa": "/tɜːrn ɑːn/", "zh": "打开（开关）"}, {"w": "wash", "ipa": "/wɑːʃ/", "zh": "洗"}], "nouns": [{"w": "balcony", "ipa": "/ˈbælkəni/", "zh": "阳台"}, {"w": "clothes", "ipa": "/kloʊðz/", "zh": "衣服"}, {"w": "detergent", "ipa": "/dɪˈtɜːrdʒənt/", "zh": "洗衣液"}, {"w": "drawer", "ipa": "/drɔːr/", "zh": "抽屉"}, {"w": "laundry", "ipa": "/ˈlɔːndri/", "zh": "待洗衣物"}, {"w": "laundry basket", "ipa": "/ˈlɔːndri ˈbæskɪt/", "zh": "洗衣篮"}, {"w": "pocket", "ipa": "/ˈpɑːkɪt/", "zh": "口袋"}, {"w": "rack", "ipa": "/ræk/", "zh": "晾衣架"}, {"w": "washing machine", "ipa": "/ˈwɑːʃɪŋ məˈʃiːn/", "zh": "洗衣机"}], "others": [{"w": "dark (adj.)", "ipa": "/dɑːrk/", "zh": "深色的"}, {"w": "light (adj.)", "ipa": "/laɪt/", "zh": "浅色的"}, {"w": "wet (adj.)", "ipa": "/wet/", "zh": "湿的"}]}, "notes": [{"en": "Sort dark and light clothes before washing.", "zh": "洗之前把深色和浅色衣服分开。"}, {"en": "Hang the laundry on the balcony rack to dry in the sun.", "zh": "把衣服挂到阳台晾衣架上晒太阳晾干。"}], "dialogue": [], "china": [{"en": "Most Chinese apartments have an automatic washing machine; people use detergent or pods.", "zh": "中国公寓大多有全自动洗衣机，用洗衣液或洗衣凝珠。"}, {"en": "Dryers are uncommon; many families hang clothes on the balcony to dry.", "zh": "烘干机不常见，很多家庭把衣服晾在阳台。"}], "en": "Doing Laundry", "zh": "洗衣服", "grammarZh": "一般将来时"}, {"id": 36, "section": 4, "level": 1, "img": "assets/img/unit36.jpg", "grammar": "Simple Present", "grammarNote": {"en": "The simple present tense describes habits, routines, and general facts. Here Pam and Dan regularly clean different rooms of the house. / 一般现在时描述习惯、日常和一般事实。这里帕姆和丹定期打扫家里不同的房间。", "zh": "一般现在时"}, "steps": [{"en": "Tom and Jenny help Mom clean the house.", "zh": "汤姆和珍妮帮妈妈打扫房子。"}, {"en": "Tom dusts the furniture...", "zh": "汤姆掸掉家具上的灰尘……"}, {"en": "...and the woodwork.", "zh": "……还有木制门窗框。"}, {"en": "Then Mom vacuums the carpet.", "zh": "然后妈妈用吸尘器吸地毯。"}, {"en": "Mom cleans the refrigerator...", "zh": "妈妈清理冰箱……"}, {"en": "...and throws out spoiled food.", "zh": "……扔掉坏掉的食物。"}, {"en": "Jenny wipes the countertops...", "zh": "珍妮擦拭台面……"}, {"en": "...and sweeps the floor.", "zh": "……还扫了地。"}, {"en": "Dad scrubs the toilet with a toilet brush,...", "zh": "爸爸用马桶刷刷洗马桶……"}, {"en": "...cleans the sink...", "zh": "……清理水池……"}, {"en": "...and scrubs the bathtub.", "zh": "……刷洗浴缸。"}, {"en": "He washes the mirror on the medicine cabinet.", "zh": "他擦干净镜柜上的镜子。"}, {"en": "Then he sweeps the floor...", "zh": "然后他扫了地……"}, {"en": "...and mops it.", "zh": "……又拖了地。"}, {"en": "They bundle old newspapers...", "zh": "他们把旧报纸捆起来……"}, {"en": "...and put empty bottles, cans and jars into bags.", "zh": "……把空瓶子、易拉罐和瓶子装进袋子。"}, {"en": "They set them out for recycling.", "zh": "他们把这些东西放好等待回收。"}, {"en": "Then they empty wastebaskets...", "zh": "然后他们倒掉废纸篓……"}, {"en": "...and the kitchen garbage into a big garbage bag...", "zh": "……把厨房垃圾倒进大垃圾袋……"}, {"en": "...and take it out to the garbage can.", "zh": "……把垃圾袋提出去扔进垃圾桶。"}], "vocab": {"verbs": [{"w": "bundle", "ipa": "/ˈbʌndl/", "zh": "捆扎"}, {"w": "clean", "ipa": "/kliːn/", "zh": "清洁"}, {"w": "dust", "ipa": "/dʌst/", "zh": "掸灰"}, {"w": "empty", "ipa": "/ˈempti/", "zh": "倒空"}, {"w": "lie around", "ipa": "/laɪ/", "zh": "散落"}, {"w": "mop", "ipa": "/mɑːp/", "zh": "拖地"}, {"w": "pick up", "ipa": "/pɪk ʌp/", "zh": "捡起；收拾"}, {"w": "put into", "ipa": "/pʊt/", "zh": "放入"}, {"w": "recycle", "ipa": "/ˌriːˈsaɪkl/", "zh": "回收利用"}, {"w": "scrub", "ipa": "/skrʌb/", "zh": "擦洗"}, {"w": "set out", "ipa": "/set aʊt/", "zh": "摆出；放出去"}, {"w": "sweep", "ipa": "/swiːp/", "zh": "扫"}, {"w": "take out", "ipa": "/teɪk/", "zh": "拿出去"}, {"w": "throw out", "ipa": "/θroʊ/", "zh": "扔掉"}, {"w": "vacuum", "ipa": "/ˈvækjuːm/", "zh": "用吸尘器吸"}, {"w": "wash", "ipa": "/wɑːʃ/", "zh": "洗"}, {"w": "wipe", "ipa": "/waɪp/", "zh": "擦"}], "nouns": [{"w": "bag", "ipa": "/bæɡ/", "zh": "袋子"}, {"w": "bathroom", "ipa": "/ˈbæθruːm/", "zh": "浴室"}, {"w": "bathtub", "ipa": "/ˈbæθtʌb/", "zh": "浴缸"}, {"w": "bottle", "ipa": "/ˈbɑːtl/", "zh": "瓶子"}, {"w": "broom", "ipa": "/bruːm/", "zh": "扫帚"}, {"w": "brush", "ipa": "/brʌʃ/", "zh": "刷子"}, {"w": "bucket", "ipa": "/ˈbʌkɪt/", "zh": "水桶"}, {"w": "can", "ipa": "/kæn/", "zh": "罐子；金属桶"}, {"w": "carpet", "ipa": "/ˈkɑːrpɪt/", "zh": "地毯"}, {"w": "countertop", "ipa": "/ˈkaʊntərtɑːp/", "zh": "台面"}, {"w": "dustpan", "ipa": "/ˈdʌstpæn/", "zh": "簸箕"}, {"w": "floor", "ipa": "/flɔːr/", "zh": "地板"}, {"w": "food", "ipa": "/fuːd/", "zh": "食物"}, {"w": "furniture", "ipa": "/ˈfɜːrnɪtʃər/", "zh": "家具"}, {"w": "garbage", "ipa": "/ˈɡɑːrbɪdʒ/", "zh": "垃圾"}, {"w": "house", "ipa": "/haʊs/", "zh": "房子"}, {"w": "jar", "ipa": "/dʒɑːr/", "zh": "玻璃罐"}, {"w": "kitchen", "ipa": "/ˈkɪtʃɪn/", "zh": "厨房"}, {"w": "living room", "ipa": "/ˈlɪvɪŋ ruːm/", "zh": "客厅"}, {"w": "medicine cabinet", "ipa": "/ˈmedɪsn ˈkæbɪnət/", "zh": "药柜"}, {"w": "mirror", "ipa": "/ˈmɪrər/", "zh": "镜子"}, {"w": "mop", "ipa": "/mɑːp/", "zh": "拖把"}, {"w": "newspaper", "ipa": "/ˈnuːzpeɪpər/", "zh": "报纸"}, {"w": "recycling", "ipa": "/ˌriːˈsaɪklɪŋ/", "zh": "回收"}, {"w": "refrigerator", "ipa": "/rɪˈfrɪdʒəreɪtər/", "zh": "冰箱"}, {"w": "sink", "ipa": "/sɪŋk/", "zh": "洗手池"}, {"w": "toilet", "ipa": "/ˈtɔɪlət/", "zh": "马桶"}, {"w": "trash", "ipa": "/træʃ/", "zh": "垃圾"}, {"w": "vacuum cleaner", "ipa": "/ˈvækjuːm ˈkliːnər/", "zh": "吸尘器"}, {"w": "wastebasket", "ipa": "/ˈweɪstbæskɪt/", "zh": "废纸篓"}, {"w": "woodwork", "ipa": "/ˈwʊdwɜːrk/", "zh": "木制品（门框等）"}], "others": [{"w": "big (adj.)", "ipa": "/bɪɡ/", "zh": "大的"}, {"w": "empty (adj.)", "ipa": "/ˈempti/", "zh": "空的"}, {"w": "old (adj.)", "ipa": "/oʊld/", "zh": "旧的"}, {"w": "spoiled (adj.)", "ipa": "/spɔɪld/", "zh": "变质的"}]}, "notes": [{"en": "When you dust furniture, you remove dust from it. Dust is a very light kind of dirt that makes a thin layer on furniture.", "zh": "给家具掸灰时，你把上面的灰尘擦掉。灰尘是很轻的污垢，会在家具上形成薄薄一层。"}], "dialogue": [{"speaker": "Jenny", "role": "girl", "en": "Yecch! This cucumber is mushy.", "zh": "咦！这根黄瓜都软烂了。"}], "china": [{"en": "In China, children help with housework: dust, sweep, and tidy up.", "zh": "在中国，孩子会帮忙做家务：掸灰、扫地、收拾。可以说 do housework（做家务）。"}, {"en": "Waste sorting (recycling) is common in Chinese cities.", "zh": "中国城市里垃圾分类很普遍。可以说 sort the garbage（垃圾分类）。"}], "en": "Cleaning the House", "zh": "打扫房屋", "grammarZh": "一般现在时"}, {"id": 37, "section": 4, "level": 1, "img": "assets/img/unit37.jpg", "grammar": "Simple Past", "grammarNote": {"en": "The simple past tense describes completed actions of caring for a cat. Irregular verbs: feed→fed, put→put, take→took. / 一般过去时描述照顾猫的一系列已完成动作。不规则动词：feed→fed、put→put、take→took。", "zh": "一般过去时"}, "steps": [{"en": "To feed his cat, Tom opened a can of cat food...", "zh": "为了喂猫，汤姆打开一罐猫罐头……"}, {"en": "...and put it in the cat's dish.", "zh": "然后放到猫碗里。"}, {"en": "He put some fresh water in the water dish.", "zh": "他在水碗里放了新鲜的水。"}, {"en": "He also cleaned the litter box.", "zh": "他还清理了猫砂盆。"}, {"en": "He petted the cat...", "zh": "他抚摸猫……"}, {"en": "...and she purred and rubbed against his leg.", "zh": "猫发出呼噜声，蹭他的腿。"}, {"en": "He played with the cat by moving a piece of string...", "zh": "他晃动一根绳子和猫玩……"}, {"en": "...which the cat pounced on.", "zh": "猫扑了上去。"}], "vocab": {"verbs": [{"w": "clean", "ipa": "/kliːn/", "zh": "清理"}, {"w": "feed / fed", "ipa": "/fiːd/", "zh": "喂"}, {"w": "move", "ipa": "/muːv/", "zh": "移动"}, {"w": "open", "ipa": "/ˈoʊpən/", "zh": "打开"}, {"w": "pet", "ipa": "/pet/", "zh": "抚摸"}, {"w": "play", "ipa": "/pleɪ/", "zh": "玩耍"}, {"w": "pounce", "ipa": "/paʊns/", "zh": "扑过去"}, {"w": "purr", "ipa": "/pɜːr/", "zh": "发出呼噜声"}, {"w": "put / put in", "ipa": "/pʊt/", "zh": "放入"}, {"w": "rub", "ipa": "/rʌb/", "zh": "蹭；摩擦"}, {"w": "take / took care of", "ipa": "/teɪk/", "zh": "照顾"}], "nouns": [{"w": "box", "ipa": "/bɑːks/", "zh": "盒子"}, {"w": "can", "ipa": "/kæn/", "zh": "罐；听"}, {"w": "cat", "ipa": "/kæt/", "zh": "猫"}, {"w": "dish", "ipa": "/dɪʃ/", "zh": "盘子；碗"}, {"w": "food", "ipa": "/fuːd/", "zh": "食物"}, {"w": "leg", "ipa": "/leɡ/", "zh": "腿"}, {"w": "litter", "ipa": "/ˈlɪtər/", "zh": "猫砂"}, {"w": "(a) piece (of)", "ipa": "/piːs/", "zh": "一根/片"}, {"w": "string", "ipa": "/strɪŋ/", "zh": "绳子"}, {"w": "water", "ipa": "/ˈwɔːtər/", "zh": "水"}], "others": [{"w": "fresh (adj.)", "ipa": "/freʃ/", "zh": "新鲜的"}]}, "notes": [{"en": "A litter box is where a cat \"goes to the bathroom.\"", "zh": "猫砂盆就是猫\"上厕所\"的地方。"}, {"en": "When a cat pounces, it jumps quickly on something.", "zh": "猫扑（pounce）就是快速跳向某物。"}, {"en": "Most people call their own cats \"he\" or \"she,\" not \"it.\"", "zh": "大多数人用 he 或 she 称呼自己的猫，而不用 it。"}, {"en": "The noise a cat usually makes is \"meowing.\" When a cat is calm and happy, it \"purrs.\" When a cat is fighting, it might \"hiss.\"", "zh": "猫平时的叫声是 meow（喵），平静开心时会 purr（呼噜），打架时可能会 hiss（嘶嘶叫）。"}], "dialogue": [{"speaker": "cat", "role": "猫", "en": "Meow!", "zh": "喵！"}, {"speaker": "Tom", "role": "汤姆", "en": "Good Kitty.", "zh": "乖猫咪。"}, {"speaker": "cat", "role": "猫", "en": "Rrrrr...", "zh": "呼噜噜……"}, {"speaker": "Tom", "role": "汤姆", "en": "Come on Kitty, get the string.", "zh": "来吧猫咪，抓绳子。"}], "china": [{"en": "In China, cats are very popular pets in city apartments; litter boxes are used indoors, and owners buy canned cat food and dry kibble.", "zh": "在中国，猫是城市公寓里非常受欢迎的宠物；猫砂盆在室内使用，主人买猫罐头和猫粮。"}, {"en": "Chinese cat owners often share cute cat videos on Douyin and Xiaohongshu.", "zh": "中国的猫主人常在抖音和小红书上分享可爱的猫咪视频。"}], "en": "Taking Care of a Cat", "zh": "照顾猫", "grammarZh": "一般过去时"}, {"id": 38, "section": 4, "level": 1, "img": "assets/img/unit38.jpg", "grammar": "Simple Past", "grammarNote": {"en": "The simple past tense describes completed actions of caring for a dog. Irregular verbs: come→came, put→put, take→took, throw→threw. / 一般过去时描述照顾狗的一系列已完成动作。不规则动词：come→came、put→put、take→took、throw→threw。", "zh": "一般过去时"}, "steps": [{"en": "I called my dog.", "zh": "我呼唤我的狗。"}, {"en": "After he came, I petted him.", "zh": "他过来后，我抚摸他。"}, {"en": "He wagged his tail...", "zh": "他摇尾巴……"}, {"en": "...and barked.", "zh": "然后叫了。"}, {"en": "I put some dog food in his dish...", "zh": "我在他碗里放了些狗粮……"}, {"en": "...and filled his water dish.", "zh": "然后装满水碗。"}, {"en": "Later, I clipped a leash to his collar...", "zh": "后来，我把牵引绳扣在他项圈上……"}, {"en": "...and took him out for a walk.", "zh": "带他出去散步。"}, {"en": "After his walk, I threw a stick for him...", "zh": "散步后，我扔了根棍子给他……"}, {"en": "...and he fetched it.", "zh": "他把它捡了回来。"}], "vocab": {"verbs": [{"w": "bark", "ipa": "/bɑːrk/", "zh": "吠叫"}, {"w": "call", "ipa": "/kɔːl/", "zh": "呼唤"}, {"w": "clip", "ipa": "/klɪp/", "zh": "扣上；夹上"}, {"w": "come / came", "ipa": "/kʌm/", "zh": "来"}, {"w": "fetch", "ipa": "/fetʃ/", "zh": "取回；捡回"}, {"w": "fill", "ipa": "/fɪl/", "zh": "装满"}, {"w": "pet", "ipa": "/pet/", "zh": "抚摸"}, {"w": "put / put in", "ipa": "/pʊt/", "zh": "放入"}, {"w": "take / took care of", "ipa": "/teɪk/", "zh": "照顾"}, {"w": "take / took", "ipa": "/teɪk/", "zh": "带"}, {"w": "throw / threw", "ipa": "/θroʊ/", "zh": "扔"}, {"w": "wag", "ipa": "/wæɡ/", "zh": "摇（尾巴）"}], "nouns": [{"w": "collar", "ipa": "/ˈkɑːlər/", "zh": "项圈"}, {"w": "dish", "ipa": "/dɪʃ/", "zh": "碗"}, {"w": "dog", "ipa": "/dɔːɡ/", "zh": "狗"}, {"w": "food", "ipa": "/fuːd/", "zh": "食物"}, {"w": "leash", "ipa": "/liːʃ/", "zh": "牵引绳"}, {"w": "stick", "ipa": "/stɪk/", "zh": "棍子"}, {"w": "tail", "ipa": "/teɪl/", "zh": "尾巴"}, {"w": "walk", "ipa": "/wɔːk/", "zh": "散步"}, {"w": "water", "ipa": "/ˈwɔːtər/", "zh": "水"}], "others": [{"w": "later (adv.)", "ipa": "/ˈleɪtər/", "zh": "后来"}]}, "notes": [{"en": "A dog's collar goes around his neck.", "zh": "狗的项圈戴在脖子上。"}, {"en": "A dog fetches something by picking it up in his mouth and taking it back to the person who threw it.", "zh": "狗捡东西是用嘴叼起来，带回给扔东西的人。"}, {"en": "Most people call their own dogs \"he\" or \"she,\" not \"it.\"", "zh": "大多数人用 he 或 she 称呼自己的狗，而不用 it。"}, {"en": "A dog wags his tail by moving it back and forth.", "zh": "狗摇尾巴就是来回摆动尾巴。"}, {"en": "Usually a dog's noise is called barking. If a dog is hurt, it \"yelps\" (suddenly) or \"whines\" (for a longer time). A dog might also \"howl.\"", "zh": "狗通常的叫声叫 barking（吠）。受伤时会 yelp（突然叫）或 whine（哀鸣很久），狗还可能 howl（嚎叫）。"}], "dialogue": [{"speaker": "owner", "role": "主人", "en": "Here, Blackie. Come on, boy.", "zh": "来，布雷基，过来，小家伙。"}, {"speaker": "dog", "role": "狗", "en": "Woof! Woof!", "zh": "汪！汪！"}, {"speaker": "owner", "role": "主人", "en": "Go get it!", "zh": "去把它捡回来！"}], "china": [{"en": "In China, dog owners must register their dogs with the police and keep them on a leash in public, as required by local pet regulations.", "zh": "在中国，养犬人必须按当地规定给狗上户口，并在公共场合牵绳。"}, {"en": "Many Chinese parks have designated dog-walking areas, and dog-waste bags are commonly provided.", "zh": "很多中国公园有专门的遛狗区，通常会提供拾便袋。"}], "en": "Taking Care of a Dog", "zh": "照顾狗", "grammarZh": "一般过去时"}, {"id": 39, "section": 4, "level": 1, "img": "assets/img/unit39.jpg", "grammar": "Simple Past", "grammarNote": {"en": "The simple past tense describes completed plant-care actions. Irregular verbs include: fill→filled, water→watered, pull→pulled, loosen→loosened, pick→picked.", "zh": "一般过去时描述已完成的养花动作：filled 装满、watered 浇水、pulled 拔、loosened 松、picked 摘。"}, "steps": [{"en": "Jenny helped Grandma water the potted plants on the balcony.", "zh": "珍妮帮奶奶给阳台上的盆栽浇水。"}, {"en": "She filled a small watering can with water.", "zh": "她用喷壶装满水。"}, {"en": "She watered the plants.", "zh": "她给花浇水。"}, {"en": "She pulled the small weeds out of the pots.", "zh": "她把花盆里的小杂草拔掉。"}, {"en": "She loosened the soil with a small stick.", "zh": "她用小木棍松了松土。"}, {"en": "She picked a flower for Grandma.", "zh": "她给奶奶摘了一朵花。"}, {"en": "Grandma said, \"Thank you! You are a good helper.\"", "zh": "奶奶说：“谢谢你！你真是个好帮手。”"}], "vocab": {"verbs": [{"w": "fill", "ipa": "/fɪl/", "zh": "装满"}, {"w": "help", "ipa": "/help/", "zh": "帮助"}, {"w": "loosen", "ipa": "/ˈluːsn/", "zh": "松开（土）"}, {"w": "pick", "ipa": "/pɪk/", "zh": "摘"}, {"w": "pull", "ipa": "/pʊl/", "zh": "拔"}, {"w": "take care of", "ipa": "/teɪk ker əv/", "zh": "照顾；养护"}, {"w": "water", "ipa": "/ˈwɔːtər/", "zh": "浇水"}], "nouns": [{"w": "balcony", "ipa": "/ˈbælkəni/", "zh": "阳台"}, {"w": "flower", "ipa": "/ˈflaʊər/", "zh": "花"}, {"w": "plant", "ipa": "/plænt/", "zh": "植物"}, {"w": "pot", "ipa": "/pɑːt/", "zh": "花盆"}, {"w": "potted plant", "ipa": "/ˈpɑːtɪd plænt/", "zh": "盆栽"}, {"w": "soil", "ipa": "/sɔɪl/", "zh": "土壤"}, {"w": "stick", "ipa": "/stɪk/", "zh": "小棍"}, {"w": "watering can", "ipa": "/ˈwɔːtərɪŋ kæn/", "zh": "喷壶"}], "others": [{"w": "small (adj.)", "ipa": "/smɔːl/", "zh": "小的"}, {"w": "with (prep.)", "ipa": "/wɪð/", "zh": "用……"}]}, "notes": [{"en": "A watering can is a small container with a spout, used to water plants.", "zh": "watering can（喷壶）是带嘴的小容器，用来给植物浇水。"}, {"en": "A weed is a plant you don't want. Weeds grow between flowers and take their food.", "zh": "weed 是你不想要的植物（杂草），它长在花中间抢养分。"}, {"en": "Plants need water, sunlight and good soil to grow well.", "zh": "植物需要水、阳光和好土壤才能长得好。"}], "dialogue": [{"speaker": "Grandma", "role": "mom", "en": "Thank you! You are a good helper.", "zh": "谢谢你！你真是个好帮手。"}], "china": [{"en": "In Chinese cities, most families live in apartments and grow flowers in pots on the balcony; lawns are rare and maintained by property management.", "zh": "在中国城市，多数家庭住楼房，在阳台用花盆栽花；草坪很少见，由物业统一维护。"}, {"en": "Potted plants like pothos, lucky bamboo and mint are common choices for Chinese homes.", "zh": "绿萝、富贵竹、薄荷等盆栽是中国家庭常见的选择。"}], "en": "Taking Care of Potted Plants", "zh": "养护盆栽", "grammarZh": "一般过去时"}, {"id": 40, "section": 4, "level": 1, "img": "assets/img/unit40.jpg", "grammar": "Simple Future", "grammarNote": {"en": "The simple future tense uses \"will\" and contractions like 'll to describe actions Tom will do in his garden. / 一般将来时用 will 和缩略形式 'll 描述汤姆将在花园里做的事。", "zh": "一般将来时"}, "steps": [{"en": "Tom will turn the soil in a flowerpot with a small spade.", "zh": "汤姆会用小铲子翻花盆里的土。"}, {"en": "He'll plant some seeds...", "zh": "他会播一些种子……"}, {"en": "...and cover them with a little soil.", "zh": "然后用一点土盖上。"}, {"en": "He'll water the flowerpot every day.", "zh": "他每天给花盆浇水。"}, {"en": "He'll put the flowerpot on the sunny balcony.", "zh": "他会把花盆放到阳光充足的阳台上。"}, {"en": "When the seedlings come up, he'll weed the pot.", "zh": "幼苗长出来后，他会给花盆除草。"}, {"en": "Finally, he'll pick some flowers for the house.", "zh": "最后，他会摘一些花放进家里。"}], "vocab": {"verbs": [{"w": "come up", "ipa": "/kʌm ʌp/", "zh": "长出来"}, {"w": "cover", "ipa": "/ˈkʌvər/", "zh": "覆盖"}, {"w": "pick", "ipa": "/pɪk/", "zh": "摘"}, {"w": "plant", "ipa": "/plænt/", "zh": "种植"}, {"w": "turn", "ipa": "/tɜːrn/", "zh": "翻（土）"}, {"w": "water", "ipa": "/ˈwɔːtər/", "zh": "浇水"}, {"w": "weed", "ipa": "/wiːd/", "zh": "除草"}], "nouns": [{"w": "balcony", "ipa": "/ˈbælkəni/", "zh": "阳台"}, {"w": "flower", "ipa": "/ˈflaʊər/", "zh": "花"}, {"w": "flowerpot", "ipa": "/ˈflaʊərpɑːt/", "zh": "花盆"}, {"w": "seed", "ipa": "/siːd/", "zh": "种子"}, {"w": "seedling", "ipa": "/ˈsiːdlɪŋ/", "zh": "幼苗"}, {"w": "soil", "ipa": "/sɔɪl/", "zh": "土壤"}, {"w": "spade", "ipa": "/speɪd/", "zh": "小铲子"}, {"w": "sun", "ipa": "/sʌn/", "zh": "阳光"}], "others": [{"w": "finally (adv.)", "ipa": "/ˈfaɪnəli/", "zh": "最后"}, {"w": "sunny (adj.)", "ipa": "/ˈsʌni/", "zh": "阳光充足的"}]}, "notes": [{"en": "You can grow flowers or vegetables in a flowerpot on the balcony.", "zh": "在阳台花盆里可以种花或种菜。"}, {"en": "Water the plants every day and put them in the sun.", "zh": "每天浇水，把植物放在阳光下。"}], "dialogue": [], "china": [{"en": "Many Chinese city families grow flowers and herbs in pots on their balconies.", "zh": "很多中国城市家庭在阳台花盆里种花种草。"}, {"en": "Community shared gardens are becoming popular in some cities.", "zh": "一些城市里社区共享菜园越来越流行。"}], "en": "Gardening", "zh": "阳台种花", "grammarZh": "一般将来时"}, {"id": 41, "section": 4, "level": 1, "img": "assets/img/unit41.jpg", "grammar": "simple present", "grammarNote": {"en": "The simple present tense is used here to describe a regular, habitual routine and the standard steps of a process (cleaning a car). It expresses actions that are repeated or done according to a usual procedure.", "zh": "这里用一般现在时描述日常习惯和固定流程步骤（洗车的标准步骤），表示反复发生或按常规做法进行的动作。"}, "steps": [{"en": "I wash the windows inside,...", "zh": "我先擦车窗里面……"}, {"en": "...wipe off the dashboard...", "zh": "……擦干净仪表台……"}, {"en": "...and vacuum the floor.", "zh": "……再用吸尘器吸地板。"}, {"en": "I dip a sponge into soapy water...", "zh": "我把海绵蘸上肥皂水……"}, {"en": "...and wash the car with it.", "zh": "……用它擦洗车身。"}, {"en": "To rinse the car, I spray it with water.", "zh": "为了冲掉泡沫，我用清水喷洗车身。"}, {"en": "I dry it with some rags.", "zh": "我用干布把车擦干。"}, {"en": "Then I spread some wax on the car.", "zh": "然后我往车上打蜡。"}, {"en": "After it has dried,...", "zh": "等蜡干了……"}, {"en": "...I wipe the wax off...", "zh": "……我把蜡擦掉……"}, {"en": "...and buff the car with a soft cloth.", "zh": "……用软布把车身擦亮。"}, {"en": "Finally, I wash the windows outside.", "zh": "最后，我擦干净车窗外侧。"}], "vocab": {"verbs": [{"w": "buff", "ipa": "/bʌf/", "zh": "v. 擦亮，抛光"}, {"w": "clean", "ipa": "/kliːn/", "zh": "v. 清洁，打扫"}, {"w": "dip", "ipa": "/dɪp/", "zh": "v. 蘸，浸"}, {"w": "dry", "ipa": "/draɪ/", "zh": "v. 擦干，弄干"}, {"w": "rinse", "ipa": "/rɪns/", "zh": "v. 冲洗，漂洗"}, {"w": "spray", "ipa": "/spreɪ/", "zh": "v. 喷洒，喷射"}, {"w": "spread", "ipa": "/spred/", "zh": "v. 涂抹，铺开"}, {"w": "vacuum", "ipa": "/ˈvækjuːm/", "zh": "v. 用吸尘器吸尘"}, {"w": "wash", "ipa": "/wɑːʃ/", "zh": "v. 洗，清洗"}, {"w": "wipe off", "ipa": "/waɪp ɔːf/", "zh": "v. 擦去，抹掉"}], "nouns": [{"w": "bucket", "ipa": "/ˈbʌkɪt/", "zh": "n. 水桶"}, {"w": "car", "ipa": "/kɑːr/", "zh": "n. 汽车"}, {"w": "cloth", "ipa": "/klɔːθ/", "zh": "n. 布，抹布"}, {"w": "dashboard", "ipa": "/ˈdæʃbɔːrd/", "zh": "n. 仪表板"}, {"w": "floor", "ipa": "/flɔːr/", "zh": "n. 地板，车内底板"}, {"w": "rag", "ipa": "/ræɡ/", "zh": "n. 旧抹布，碎布"}, {"w": "sponge", "ipa": "/spʌndʒ/", "zh": "n. 海绵"}, {"w": "water", "ipa": "/ˈwɔːtər/", "zh": "n. 水"}, {"w": "wax", "ipa": "/wæks/", "zh": "n. 车蜡，蜡"}, {"w": "window", "ipa": "/ˈwɪndoʊ/", "zh": "n. 窗户，车窗"}], "others": [{"w": "dried", "ipa": "/draɪd/", "zh": "adj. 干了的"}, {"w": "finally", "ipa": "/ˈfaɪnəli/", "zh": "adv. 最后，终于"}, {"w": "inside", "ipa": "/ˌɪnˈsaɪd/", "zh": "adv. 在里面，在内部"}, {"w": "outside", "ipa": "/ˌaʊtˈsaɪd/", "zh": "adv. 在外面，在外部"}, {"w": "soapy", "ipa": "/ˈsoʊpi/", "zh": "adj. 肥皂的，多泡沫的"}, {"w": "soft", "ipa": "/sɔːft/", "zh": "adj. 柔软的"}]}, "notes": [{"en": "A rag is a kind of cloth used for cleaning. Many rags come from old clothing. A sponge has a lot of holes in it. It holds water and can be squeezed to a small size.", "zh": "rag（抹布）是一种用来清洁的布，很多抹布是用旧衣服改的。sponge（海绵）有很多小孔，能吸水，也可以被挤压得很小。"}, {"en": "You buff something by moving a cloth quickly back and forth.", "zh": "buff 是指用布快速来回擦拭，把东西擦亮。"}, {"en": "You spray a car with a widely-spread stream of water.", "zh": "spray 是用一束散开的水流喷洒汽车。"}, {"en": "Wax makes a car shine.", "zh": "wax（车蜡）能让汽车发亮。"}, {"en": "You rinse a car to remove soapy water.", "zh": "rinse（冲洗）是为了把车上的肥皂水冲掉。"}], "dialogue": [], "china": [{"en": "In China, many families go to a self-service car wash; you wash and vacuum the car yourself.", "zh": "在中国，很多家庭去自助洗车房，自己动手冲洗和吸尘。可以说 self-service car wash（自助洗车房）。"}, {"en": "You can learn car words: wax, buff, vacuum.", "zh": "可以学到汽车词汇：打蜡 wax、擦亮 buff、吸尘 vacuum。"}], "en": "Cleaning a Car", "zh": "洗车", "grammarZh": "一般现在时"}, {"id": 42, "section": 4, "level": 1, "img": "assets/img/unit42.jpg", "grammar": "simple past", "grammarNote": {"en": "The simple past tense narrates a completed sequence: calling the 4S shop for an appointment, taking the car in, getting an estimate, and picking it up later.", "zh": "这里用一般过去时叙述一连串已经发生的事情：打电话给 4S 店预约、送车维修、拿到估价，以及之后取车。"}, "steps": [{"en": "Dad called the 4S shop to book a repair for the car.", "zh": "爸爸打电话给 4S 店预约修车。"}, {"en": "Dad took the car to the 4S shop...", "zh": "爸爸把车送到 4S 店……"}, {"en": "...and Tom went with him.", "zh": "……汤姆陪爸爸一起去。"}, {"en": "The mechanic diagnosed the problem.", "zh": "技师诊断了故障。"}, {"en": "Dad asked him for an estimate of the cost.", "zh": "爸爸请他给出维修费用估价。"}, {"en": "He worked on the engine.", "zh": "他检修发动机。"}, {"en": "When they came back later to pick up the car,...", "zh": "后来他们回来取车时……"}, {"en": "...Dad paid the bill with his phone.", "zh": "……爸爸用手机付了账单。"}], "vocab": {"verbs": [{"w": "ask for", "ipa": "/æsk fɔːr/", "zh": "要求，请求"}, {"w": "book", "ipa": "/bʊk/", "zh": "预约"}, {"w": "call", "ipa": "/kɔːl/", "zh": "打电话"}, {"w": "come back", "ipa": "/kʌm bæk/", "zh": "回来"}, {"w": "diagnose", "ipa": "/ˌdaɪəɡˈnoʊs/", "zh": "诊断，判断"}, {"w": "fix", "ipa": "/fɪks/", "zh": "修理，修复"}, {"w": "pay", "ipa": "/peɪ/", "zh": "付款"}, {"w": "pick up", "ipa": "/pɪk ʌp/", "zh": "取回"}, {"w": "take (took) in", "ipa": "/teɪk ɪn/", "zh": "把（车）送去修理"}, {"w": "work on", "ipa": "/wɜːrk ɑːn/", "zh": "修理，检修"}], "nouns": [{"w": "4S shop", "ipa": "/fɔːr es ʃɑːp/", "zh": "4S 店"}, {"w": "appointment", "ipa": "/əˈpɔɪntmənt/", "zh": "预约"}, {"w": "bill", "ipa": "/bɪl/", "zh": "账单"}, {"w": "car", "ipa": "/kɑːr/", "zh": "汽车"}, {"w": "cost", "ipa": "/kɔːst/", "zh": "费用，成本"}, {"w": "engine", "ipa": "/ˈendʒɪn/", "zh": "发动机，引擎"}, {"w": "estimate", "ipa": "/ˈestɪmət/", "zh": "估价，预算"}, {"w": "mechanic", "ipa": "/məˈkænɪk/", "zh": "机修工，技师"}, {"w": "problem", "ipa": "/ˈprɑːbləm/", "zh": "问题，故障"}, {"w": "repair", "ipa": "/rɪˈper/", "zh": "修理"}], "others": [{"w": "later (adv.)", "ipa": "/ˈleɪtər/", "zh": "后来，稍后"}]}, "notes": [{"en": "A 4S shop is where Chinese drivers buy and repair cars.", "zh": "4S 店是中国车主买车和修车的地方。"}, {"en": "When you get something fixed, you arrange for someone else to fix it. You don't fix it yourself.", "zh": "get something fixed 是指安排别人来修，而不是自己动手修。"}, {"en": "An estimate is a guess about an amount (of money, time, etc.).", "zh": "estimate（估价）是对金额、时间等的大致估计。"}], "dialogue": [{"speaker": "Tom", "role": "clerk", "en": "Is the car fixed yet, Dad?", "zh": "爸爸，车修好了吗？"}, {"speaker": "Dad", "role": "mom", "en": "The mechanic says it will be ready tomorrow.", "zh": "技师说明天就能修好。"}, {"speaker": "Mechanic", "role": "teacher", "en": "Your car is ready, sir.", "zh": "先生，您的车修好了。"}, {"speaker": "Dad", "role": "mom", "en": "Great. I'll pay by phone.", "zh": "太好了，我用手机付款。"}], "china": [{"en": "In China, drivers usually book repairs through 4S shops or WeChat, and pay by mobile payment when picking up the car.", "zh": "在中国，车主通常通过 4S 店或微信预约修车，取车时用手机支付结账。"}, {"en": "Many Chinese car brands offer free roadside assistance and even door-to-door pick-up and delivery service.", "zh": "很多中国汽车品牌提供免费道路救援，甚至上门取送车服务。"}], "en": "Taking a Car to a Garage for Repairs", "zh": "送车去 4S 店维修", "grammarZh": "一般过去时"}, {"id": 43, "section": 4, "level": 1, "img": "assets/img/unit43.jpg", "grammar": "simple past", "grammarNote": {"en": "The simple past tense tells the story of one specific occasion: the car got a flat tire and a rescue mechanic changed it step by step.", "zh": "这里用一般过去时讲述一次具体经历：车胎瘪了，爸爸叫来救援技师，技师一步步把备胎换上。"}, "steps": [{"en": "Our car had a flat tire on the way home.", "zh": "回家路上，我们的车胎瘪了。"}, {"en": "Dad called the roadside rescue service.", "zh": "爸爸打电话叫道路救援。"}, {"en": "A mechanic came to help us.", "zh": "一位救援技师来帮我们。"}, {"en": "He jacked the car up.", "zh": "他用千斤顶把车顶起来。"}, {"en": "He took off the flat tire...", "zh": "他卸下瘪了的轮胎……"}, {"en": "...and put the spare tire on the wheel.", "zh": "……把备胎装到轮毂上。
