"}, {"en": "He tightened the lug nuts with a lug wrench.", "zh": "他用轮胎扳手把螺母拧紧。"}, {"en": "He lowered the car to the ground.", "zh": "他把车降到地面。"}, {"en": "Dad thanked the mechanic and paid by phone.", "zh": "爸爸感谢技师，用手机付了钱。"}], "vocab": {"verbs": [{"w": "change", "ipa": "/tʃeɪndʒ/", "zh": "更换，换（胎）"}, {"w": "come", "ipa": "/kʌm/", "zh": "来"}, {"w": "jack up", "ipa": "/dʒæk ʌp/", "zh": "用千斤顶顶起"}, {"w": "lower", "ipa": "/ˈloʊər/", "zh": "放下，降下"}, {"w": "put (put) on", "ipa": "/pʊt ɑːn/", "zh": "装上，放上"}, {"w": "take (took) off", "ipa": "/teɪk ɔːf/", "zh": "拆下，卸下"}, {"w": "thank", "ipa": "/θæŋk/", "zh": "感谢"}, {"w": "tighten", "ipa": "/ˈtaɪtn/", "zh": "拧紧"}], "nouns": [{"w": "car", "ipa": "/kɑːr/", "zh": "汽车"}, {"w": "ground", "ipa": "/ɡraʊnd/", "zh": "地面"}, {"w": "lug nut", "ipa": "/lʌɡ nʌt/", "zh": "车轮螺母"}, {"w": "lug wrench", "ipa": "/lʌɡ rentʃ/", "zh": "轮胎扳手"}, {"w": "mechanic", "ipa": "/məˈkænɪk/", "zh": "机修工，技师"}, {"w": "roadside rescue service", "ipa": "/ˈroʊdsaɪd ˈreskjuː ˈsɜːrvɪs/", "zh": "道路救援服务"}, {"w": "spare tire", "ipa": "/sper ˈtaɪər/", "zh": "备胎"}, {"w": "tire", "ipa": "/ˈtaɪər/", "zh": "轮胎"}, {"w": "wheel", "ipa": "/wiːl/", "zh": "车轮，轮毂"}], "others": [{"w": "flat (adj.)", "ipa": "/flæt/", "zh": "瘪了的，扁的"}]}, "notes": [{"en": "A spare thing is extra—something you don't usually need.", "zh": "spare 表示“额外的、备用的”，也就是平时用不到、临时才拿出来用的东西。"}, {"en": "You can jack something up but you cannot \"jack it down.\" Instead, you lower it.", "zh": "可以说 jack something up（用千斤顶顶起），但不能说 jack it down；要“放下”用 lower。"}, {"en": "In China, kids should stay in the car and wait while adults change the tire.", "zh": "在中国，换胎时孩子应待在车里等待，由大人处理。"}], "dialogue": [{"speaker": "Tom", "role": "clerk", "en": "Dad, the tire is flat!", "zh": "爸爸，轮胎瘪了！"}, {"speaker": "Dad", "role": "mom", "en": "Don't worry. I'll call for help.", "zh": "别担心，我叫救援。"}, {"speaker": "Mechanic", "role": "teacher", "en": "I'll put on the spare tire for you.", "zh": "我来给你换上备胎。"}], "china": [{"en": "In China, most drivers call roadside assistance (122 traffic police or the insurance hotline) rather than changing a tire themselves on the highway.", "zh": "在中国，大部分司机在高速上爆胎会打 122 或保险救援电话，而不是自己动手换胎。"}, {"en": "Many new Chinese cars are equipped with tire pressure monitors and repair kits; some use run-flat tires.", "zh": "很多国产新车配有胎压监测和补胎工具，部分车使用缺气保用胎。"}], "en": "Changing a Flat Tire", "zh": "车胎瘪了，爸爸叫救援", "grammarZh": "一般过去时"}, {"id": 44, "section": 4, "level": 1, "img": "assets/img/unit44.jpg", "grammar": "simple past", "grammarNote": {"en": "The simple past tense narrates a one-time event: a thunderstorm caused a power outage, and the family responded step by step until the power came back.", "zh": "这里用一般过去时叙述一次具体事件：雷雨导致停电，一家人一步步应对，直到恢复供电。"}, "steps": [{"en": "During a thunderstorm...", "zh": "下雷阵雨的时候……"}, {"en": "...our power went out.", "zh": "……我们家停电了。"}, {"en": "I turned on the flashlight on Mom's phone...", "zh": "我打开妈妈手机上的手电筒……"}, {"en": "...and my sister lit some candles.", "zh": "……妹妹点了几根蜡烛。"}, {"en": "We found the circuit-breaker box...", "zh": "我们找到了配电箱……"}, {"en": "...and found the breakers that had tripped.", "zh": "……找到了跳闸的开关。"}, {"en": "We reset the breakers...", "zh": "我们把开关复位……"}, {"en": "...and the power came back on.", "zh": "……电就来了。"}], "vocab": {"verbs": [{"w": "come-came on", "ipa": "/kʌm ɑːn/", "zh": "v. （电）恢复，到来（过去式 came）"}, {"w": "deal-dealt with", "ipa": "/diːl wɪð/", "zh": "v. 应对，处理（过去式 dealt）"}, {"w": "go-went out", "ipa": "/ɡoʊ aʊt/", "zh": "v. （灯、电）熄灭（过去式 went）"}, {"w": "find-found", "ipa": "/faɪnd/", "zh": "v. 找到（过去式 found）"}, {"w": "light-lit", "ipa": "/laɪt/", "zh": "v. 点燃（过去式 lit）"}, {"w": "reset", "ipa": "/ˌriːˈset/", "zh": "v. 复位，重新合上"}, {"w": "trip", "ipa": "/trɪp/", "zh": "v. （断路器）跳闸"}, {"w": "turn on", "ipa": "/tɜːrn ɑːn/", "zh": "v. 打开（电器）"}], "nouns": [{"w": "box", "ipa": "/bɑːks/", "zh": "n. 箱子，配电箱"}, {"w": "breaker", "ipa": "/ˈbreɪkər/", "zh": "n. 断路器"}, {"w": "candle", "ipa": "/ˈkændl/", "zh": "n. 蜡烛"}, {"w": "circuit-breaker", "ipa": "/ˈsɜːrkɪt ˈbreɪkər/", "zh": "n. 断路器，空气开关"}, {"w": "failure", "ipa": "/ˈfeɪljər/", "zh": "n. 故障，中断"}, {"w": "flashlight", "ipa": "/ˈflæʃlaɪt/", "zh": "n. 手电筒"}, {"w": "lightning", "ipa": "/ˈlaɪtnɪŋ/", "zh": "n. 闪电"}, {"w": "power", "ipa": "/ˈpaʊər/", "zh": "n. 电力，电"}, {"w": "sister", "ipa": "/ˈsɪstər/", "zh": "n. 姐妹"}, {"w": "thunderstorm", "ipa": "/ˈθʌndərstɔːrm/", "zh": "n. 雷暴雨"}], "others": [{"w": "back", "ipa": "/bæk/", "zh": "adv. 回来，恢复原状"}]}, "notes": [{"en": "Here, power means \"electric power.\"", "zh": "这里的 power 指“电力”。"}, {"en": "Circuit breakers look like switches. They trip—switch off—if too much electric power hits them.", "zh": "断路器看起来像开关。电流过大时它会跳闸（自动断开）。"}, {"en": "Some houses have fuses instead of circuit breakers.", "zh": "有些老房子用保险丝（fuse），而不是断路器。"}, {"en": "Breaker is a short form of \"circuit-breaker.\"", "zh": "breaker 是 circuit-breaker 的简称。"}, {"en": "In a thunderstorm, there are bright flashes of light called lightning. The sound that follows lightning is called \"thunder.\"", "zh": "雷暴雨时，天上明亮的闪光叫 lightning（闪电），随后听到的响声叫 thunder（雷）。"}, {"en": "To deal with a power failure is to do the right things after one happens.", "zh": "deal with a power failure 就是停电发生后采取正确的应对措施。"}], "dialogue": [{"speaker": "Tom", "role": "clerk", "en": "Good!", "zh": "太好了！"}, {"speaker": "Mom", "role": "mom", "en": "It worked.", "zh": "管用了。"}], "china": [{"en": "In China, when the power goes out, people use the flashlight on their phone or candles.", "zh": "在中国，停电时人们会用手机手电筒或蜡烛照明。可以说 flashlight（手电筒）。"}, {"en": "The breaker box is usually near the door; children can watch adults reset it.", "zh": "配电箱一般在门边，孩子可以看大人把跳闸开关复位。可以说 circuit-breaker box（配电箱）。"}], "en": "Dealing with a Power Failure", "zh": "应对停电", "grammarZh": "一般过去时"}, {"id": 45, "section": 4, "level": 1, "img": "assets/img/unit45.jpg", "grammar": "simple present", "grammarNote": {"en": "The simple present tense describes general, repeatable steps for building a bookshelf: measure, mark, cut, sand, glue, screw.", "zh": "这里用一般现在时讲解装书架的可重复步骤：量尺寸、划线、锯、打磨、粘、拧螺丝。"}, "steps": [{"en": "Tom and Dad are going to build a bookshelf for Jenny's room.", "zh": "汤姆和爸爸要给珍妮的房间装一个书架。"}, {"en": "First, they measure the boards...", "zh": "首先，他们量木板的尺寸……"}, {"en": "...and mark the places to cut.", "zh": "……并标出要锯的位置。"}, {"en": "Then Dad cuts the boards with a saw.", "zh": "然后爸爸用锯子锯木板。"}, {"en": "To make the edges smooth, they sand them.", "zh": "要把边缘磨光滑，他们用砂纸打磨。"}, {"en": "To join two boards, they glue them together...", "zh": "要把两块板接起来，他们用胶水粘……"}, {"en": "...and join them with screws.", "zh": "……并用螺丝固定。"}, {"en": "Finally, they put the shelves on the frame, and the bookshelf is ready!", "zh": "最后，他们把隔板装到架子上，书架做好了！"}], "vocab": {"verbs": [{"w": "build", "ipa": "/bɪld/", "zh": "建造，组装"}, {"w": "cut", "ipa": "/kʌt/", "zh": "锯，切割"}, {"w": "glue", "ipa": "/ɡluː/", "zh": "用胶水粘"}, {"w": "join", "ipa": "/dʒɔɪn/", "zh": "连接，接合"}, {"w": "mark", "ipa": "/mɑːrk/", "zh": "做标记，划线"}, {"w": "measure", "ipa": "/ˈmeʒər/", "zh": "测量，量尺寸"}, {"w": "sand", "ipa": "/sænd/", "zh": "用砂纸打磨"}, {"w": "screw", "ipa": "/skruː/", "zh": "用螺丝固定"}], "nouns": [{"w": "board", "ipa": "/bɔːrd/", "zh": "木板"}, {"w": "bookshelf", "ipa": "/ˈbʊkʃelf/", "zh": "书架"}, {"w": "edge", "ipa": "/edʒ/", "zh": "边缘，边"}, {"w": "frame", "ipa": "/freɪm/", "zh": "架子，框架"}, {"w": "saw", "ipa": "/sɔː/", "zh": "锯子"}, {"w": "screw", "ipa": "/skruː/", "zh": "螺丝"}, {"w": "screwdriver", "ipa": "/ˈskruːdraɪvər/", "zh": "螺丝刀"}, {"w": "shelf", "ipa": "/ʃelf/", "zh": "隔板；书架"}, {"w": "sawdust", "ipa": "/ˈsɔːdʌst/", "zh": "锯末"}, {"w": "sandpaper", "ipa": "/ˈsændpeɪpər/", "zh": "砂纸"}, {"w": "ruler", "ipa": "/ˈruːlər/", "zh": "尺子"}], "others": [{"w": "smooth (adj.)", "ipa": "/smuːð/", "zh": "光滑的，平整的"}, {"w": "together (adv.)", "ipa": "/təˈɡeðər/", "zh": "在一起，共同"}]}, "notes": [{"en": "To join things is to put them together.", "zh": "join 意思是把东西拼到一起。"}, {"en": "You glue things together with glue and screw them together with screws.", "zh": "用胶水粘是 glue together，用螺丝固定是 screw together。"}, {"en": "Measure twice, cut once! Always check the size before you cut.", "zh": "量两次，锯一次！动手前一定要核对尺寸。"}], "dialogue": [{"speaker": "Jenny", "role": "girl", "en": "Wow! The bookshelf is so cool!", "zh": "哇！书架好酷啊！"}, {"speaker": "Tom", "role": "clerk", "en": "Let's put our books on it!", "zh": "我们把书放上去吧！"}], "china": [{"en": "Many Chinese families buy flat-pack bookshelves from IKEA-style stores and assemble them at home.", "zh": "很多中国家庭从宜家式的商店买拼装书架，回家自己组装。"}, {"en": "A kids' bookshelf in a Chinese home often holds picture books, Chinese textbooks, and coloring books.", "zh": "中国孩子的书架上常常摆着绘本、课本和涂色书。"}], "en": "Working with Wood", "zh": "装书架", "grammarZh": "一般现在时"}, {"id": 46, "section": 4, "level": 1, "img": "assets/img/unit46.jpg", "grammar": "simple present", "grammarNote": {"en": "The simple present tense gives general, step-by-step instructions for fastening things with bolts and screws.", "zh": "这里用一般现在时讲解用螺栓和螺丝紧固东西的通用步骤。"}, "steps": [{"en": "You put a bolt through some holes...", "zh": "你把螺栓穿过一些孔……"}, {"en": "...put a washer onto the bolt...", "zh": "……把垫圈套到螺栓上……"}, {"en": "...and then tighten a nut by hand.", "zh": "……然后用手把螺母拧紧。"}, {"en": "Then you hold the nut with a pair of pliers...", "zh": "然后你用一把钳子夹住螺母……"}, {"en": "...and tighten the bolt with a wrench.", "zh": "……再用扳手把螺栓拧紧。"}, {"en": "You drill a hole for the screw.", "zh": "你给螺丝钻一个孔。"}, {"en": "You put a screwdriver into the slot on the head of the screw.", "zh": "你把螺丝刀插进螺丝头的槽里。"}, {"en": "You tighten the screw by turning the screwdriver clockwise.", "zh": "顺时针转动螺丝刀把螺丝拧紧。"}, {"en": "To loosen the screw, you turn it counter-clockwise.", "zh": "要拧松螺丝，就逆时针转动。"}], "vocab": {"verbs": [{"w": "bolt", "ipa": "/boʊlt/", "zh": "v. 用螺栓固定"}, {"w": "drill", "ipa": "/drɪl/", "zh": "v. 钻孔"}, {"w": "hold", "ipa": "/hoʊld/", "zh": "v. 握住，夹住"}, {"w": "join", "ipa": "/dʒɔɪn/", "zh": "v. 连接，接合"}, {"w": "loosen", "ipa": "/ˈluːsn/", "zh": "v. 松开，拧松"}, {"w": "put into", "ipa": "/pʊt ˈɪntuː/", "zh": "v. 放入，插进"}, {"w": "tighten", "ipa": "/ˈtaɪtn/", "zh": "v. 拧紧"}, {"w": "turn", "ipa": "/tɜːrn/", "zh": "v. 转动"}], "nouns": [{"w": "bolt", "ipa": "/boʊlt/", "zh": "n. 螺栓"}, {"w": "drill", "ipa": "/drɪl/", "zh": "n. 电钻，钻子"}, {"w": "head", "ipa": "/hed/", "zh": "n. （螺丝）头"}, {"w": "hole", "ipa": "/hoʊl/", "zh": "n. 孔，洞"}, {"w": "nut", "ipa": "/nʌt/", "zh": "n. 螺母"}, {"w": "(a pair of) pliers", "ipa": "/ˈplaɪərz/", "zh": "n. 钳子"}, {"w": "screw", "ipa": "/skruː/", "zh": "n. 螺丝"}, {"w": "screwdriver", "ipa": "/ˈskruːdraɪvər/", "zh": "n. 螺丝刀"}, {"w": "slot", "ipa": "/slɑːt/", "zh": "n. 槽，狭缝"}, {"w": "washer", "ipa": "/ˈwɑːʃər/", "zh": "n. 垫圈，垫片"}, {"w": "wrench", "ipa": "/rentʃ/", "zh": "n. 扳手"}], "others": [{"w": "by hand", "ipa": "/baɪ hænd/", "zh": "phr. 用手地"}, {"w": "clockwise", "ipa": "/ˈklɑːkwaɪz/", "zh": "adv. 顺时针地"}, {"w": "counter-clockwise", "ipa": "/ˌkaʊntər ˈklɑːkwaɪz/", "zh": "adv. 逆时针地"}, {"w": "together", "ipa": "/təˈɡeðər/", "zh": "adv. 在一起"}]}, "notes": [{"en": "It's always pliers—with an \"s.\"", "zh": "pliers 这个词总是带 s，是复数形式（一把钳子也要说 a pair of pliers）。"}, {"en": "Clockwise means \"in the same direction as the hands of a clock move.\"", "zh": "clockwise 意思是“和钟表指针转动方向相同”，即顺时针。"}, {"en": "Counter-clockwise is the opposite.", "zh": "counter-clockwise 意思正好相反，即逆时针。"}, {"en": "You drill holes with a drill. You bolt things together with bolts and screw them together with screws.", "zh": "用 drill（电钻）钻孔；用 bolts（螺栓）把东西 bolt together；用 screws（螺丝）把东西 screw together。"}], "dialogue": [], "china": [{"en": "In China, battery-powered screwdrivers and affordable electric drills are popular online (Taobao/JD) for self-assembly furniture.", "zh": "在中国，充电式螺丝刀和便宜的电钻在淘宝、京东上很畅销，多用于拼装家具。"}, {"en": "Chinese DIY culture is growing; many young people mount shelves, TVs and curtain rods themselves.", "zh": "中国的 DIY 文化越来越流行，很多年轻人自己装置物架、电视和窗帘杆。"}], "en": "Joining Things with Bolts/Screws", "zh": "用螺栓/螺丝拼接", "grammarZh": "一般现在时"}, {"id": 47, "section": 4, "level": 1, "img": "assets/img/unit47.jpg", "grammar": "simple present", "grammarNote": {"en": "The simple present tense describes Tom's regular routine of grocery shopping from start to finish.", "zh": "这里用一般现在时描述汤姆一贯的买菜购物流程，从进超市到结账。"}, "steps": [{"en": "Jenny and Mom get a shopping cart.", "zh": "珍妮和妈妈推了一辆购物车。"}, {"en": "Jenny checks her shopping list.", "zh": "珍妮看着购物清单。"}, {"en": "In the fresh produce section, she feels and smells the fruit.", "zh": "在生鲜区，她摸摸、闻闻水果挑新鲜。"}, {"en": "She puts some apples in a plastic bag.", "zh": "她把一些苹果装进塑料袋。"}, {"en": "She weighs the fruit on a scale.", "zh": "她在秤上给水果称重。"}, {"en": "Next, they pick up some fresh vegetables.", "zh": "接着，他们买了一些新鲜蔬菜。"}, {"en": "Then they get some milk in the dairy section.", "zh": "然后他们在乳制品区买了牛奶。"}, {"en": "They go through the snack aisle.", "zh": "他们走过零食货架。"}, {"en": "Finally, they go to the checkout counter.", "zh": "最后，他们走到收银台。"}, {"en": "Mom pays with her phone.", "zh": "妈妈用手机付了钱。"}], "vocab": {"verbs": [{"w": "check", "ipa": "/tʃek/", "zh": "查看"}, {"w": "feel", "ipa": "/fiːl/", "zh": "摸"}, {"w": "get", "ipa": "/ɡet/", "zh": "拿；买"}, {"w": "go through", "ipa": "/ɡoʊ θruː/", "zh": "走过"}, {"w": "pay", "ipa": "/peɪ/", "zh": "支付"}, {"w": "pick up", "ipa": "/pɪk ʌp/", "zh": "挑选"}, {"w": "put in", "ipa": "/pʊt ɪn/", "zh": "放进"}, {"w": "smell", "ipa": "/smel/", "zh": "闻"}, {"w": "weigh", "ipa": "/weɪ/", "zh": "称重"}], "nouns": [{"w": "apple", "ipa": "/ˈæpl/", "zh": "苹果"}, {"w": "cart", "ipa": "/kɑːrt/", "zh": "购物车"}, {"w": "checkout counter", "ipa": "/ˈtʃekaʊt ˈkaʊntər/", "zh": "收银台"}, {"w": "dairy section", "ipa": "/ˈderi ˈsekʃn/", "zh": "乳制品区"}, {"w": "fruit", "ipa": "/fruːt/", "zh": "水果"}, {"w": "list", "ipa": "/lɪst/", "zh": "清单"}, {"w": "milk", "ipa": "/mɪlk/", "zh": "牛奶"}, {"w": "plastic bag", "ipa": "/ˈplæstɪk bæɡ/", "zh": "塑料袋"}, {"w": "scale", "ipa": "/skeɪl/", "zh": "秤"}, {"w": "snack", "ipa": "/snæk/", "zh": "零食"}, {"w": "vegetable", "ipa": "/ˈvedʒtəbl/", "zh": "蔬菜"}, {"w": "yogurt", "ipa": "/ˈjoʊɡərt/", "zh": "酸奶"}], "others": [{"w": "fresh (adj.)", "ipa": "/freʃ/", "zh": "新鲜的"}, {"w": "finally (adv.)", "ipa": "/ˈfaɪnəli/", "zh": "最后"}]}, "notes": [{"en": "Feel and smell the fruit to check if it is fresh.", "zh": "摸摸、闻闻水果能判断新不新鲜。"}, {"en": "In China, people often pay at the supermarket with their phones.", "zh": "在中国，超市购物常用手机支付。"}], "dialogue": [{"speaker": "Jenny", "role": "girl", "en": "Mom, can we get some yogurt?", "zh": "妈妈，我们能买点酸奶吗？"}, {"speaker": "Mom", "role": "mom", "en": "Sure. Put it in the cart.", "zh": "当然可以，放进车里吧。"}, {"speaker": "Cashier", "role": "clerk", "en": "That's 45 yuan.", "zh": "一共 45 元。"}, {"speaker": "Mom", "role": "mom", "en": "I'll pay by phone.", "zh": "我用手机支付。"}], "china": [{"en": "Many Chinese people buy groceries with apps like Hema or Meituan; supermarkets also have self-checkout.", "zh": "很多人用盒马、美团等 App 买菜，超市也普遍有自助结账机。"}, {"en": "Plastic bags cost a little money at Chinese supermarkets, so people bring their own bags.", "zh": "中国超市塑料袋收费，很多人自带购物袋。"}], "en": "Shopping for Groceries", "zh": "帮妈妈买菜", "grammarZh": "一般现在时"}, {"id": 48, "section": 4, "level": 1, "img": "assets/img/unit48.jpg", "grammar": "simple present", "grammarNote": {"en": "The simple present tense describes the standard, repeated procedure of paying in a store—with cash or by scanning a payment code with the phone.", "zh": "这里用一般现在时描述在商店付款的两种常见流程：现金和手机扫码支付。"}, "steps": [{"en": "The cashier rings up Tom's purchases...", "zh": "收银员把汤姆买的东西扫码录入……"}, {"en": "...by scanning the bar codes...", "zh": "……通过扫描条形码……"}, {"en": "...and pressing keys on the cash register.", "zh": "……并在收银机上按键。"}, {"en": "She tells him the total to pay.", "zh": "她告诉他应付的总金额。"}, {"en": "Tom takes out his wallet, gives her the money...", "zh": "汤姆拿出钱包，把钱递给她……"}, {"en": "...and she gives him his change.", "zh": "……她给他找零。"}, {"en": "Then Tom takes out his phone and shows the payment code.", "zh": "然后汤姆拿出手机，出示付款码。"}, {"en": "The cashier scans the code with her scanner...", "zh": "收银员用扫码器扫他的付款码……"}, {"en": "...and gives him a receipt.", "zh": "……并给他一张小票。"}], "vocab": {"verbs": [{"w": "give", "ipa": "/ɡɪv/", "zh": "给"}, {"w": "pay", "ipa": "/peɪ/", "zh": "付款"}, {"w": "press", "ipa": "/pres/", "zh": "按（键）"}, {"w": "ring up", "ipa": "/rɪŋ ʌp/", "zh": "把（货款）记入收银机"}, {"w": "scan", "ipa": "/skæn/", "zh": "扫描"}, {"w": "show", "ipa": "/ʃoʊ/", "zh": "出示"}, {"w": "take out", "ipa": "/teɪk aʊt/", "zh": "取出"}, {"w": "tell", "ipa": "/tel/", "zh": "告诉"}], "nouns": [{"w": "bar code", "ipa": "/bɑːr koʊd/", "zh": "条形码"}, {"w": "cash", "ipa": "/kæʃ/", "zh": "现金"}, {"w": "cashier", "ipa": "/kæˈʃɪr/", "zh": "收银员"}, {"w": "change", "ipa": "/tʃeɪndʒ/", "zh": "找零；零钱"}, {"w": "payment code", "ipa": "/ˈpeɪmənt koʊd/", "zh": "付款码"}, {"w": "receipt", "ipa": "/rɪˈsiːt/", "zh": "收据；小票"}, {"w": "register", "ipa": "/ˈredʒɪstər/", "zh": "收银机"}, {"w": "scanner", "ipa": "/ˈskænər/", "zh": "扫码器"}, {"w": "total", "ipa": "/ˈtoʊtl/", "zh": "总计；总额"}, {"w": "wallet", "ipa": "/ˈwɑːlɪt/", "zh": "钱包"}, {"w": "yuan", "ipa": "/juˈɑːn/", "zh": "元（人民币）"}], "others": []}, "notes": [{"en": "To ring something up means to make a machine record its price.", "zh": "ring something up 意思是用收银机把商品价格录入并计算总额。"}, {"en": "The money I give the cashier is more than the total price. The difference is my change.", "zh": "我付给收银员的钱比应付总额多，多出来的部分就是找零（change）。"}, {"en": "In China, people usually pay by showing a payment code on the phone; the cashier scans it.", "zh": "在中国，大家通常出示手机付款码，收银员扫一下就能完成支付。"}], "dialogue": [{"speaker": "Cashier", "role": "mom", "en": "That'll be 23 yuan.", "zh": "一共 23 元。"}, {"speaker": "Tom", "role": "clerk", "en": "Here's 30.", "zh": "这是 30 元。"}, {"speaker": "Cashier", "role": "mom", "en": "23, 24, 25 and 5 makes 30.", "zh": "23，24，25，再加 5 块凑够 30。"}, {"speaker": "Cashier", "role": "mom", "en": "Here's your change and your receipt.", "zh": "这是找零和小票。"}, {"speaker": "Tom", "role": "clerk", "en": "Thanks. Bye.", "zh": "谢谢，再见。"}], "china": [{"en": "In China, WeChat Pay and Alipay dominate; showing a payment code or scanning the merchant's code is the norm, even at small shops.", "zh": "在中国，微信支付和支付宝无处不在；出示付款码或扫商家二维码是主流，小店也一样。"}, {"en": "The cashier often says the amount aloud, and the phone says \"Payment received\" (收款 X 元).", "zh": "收银员常会报出金额，手机也会语音提示“收款 X 元”。"}], "en": "Paying for Things", "zh": "付款", "grammarZh": "一般现在时"}, {"id": 49, "section": 4, "level": 1, "img": "assets/img/unit49.jpg", "grammar": "simple past", "grammarNote": {"en": "The simple past tense narrates one trip to the bank with Dad: took a number, waited, went to the counter, gave the ID card, checked, got the money and a receipt.", "zh": "这里用一般过去时讲述和爸爸去银行办业务的一次经历：取号、等待、去柜台、递身份证、核对、拿到钱和回执。"}, "steps": [{"en": "Tom went to the bank with his dad.", "zh": "汤姆和爸爸去了银行。"}, {"en": "He took a number ticket from the machine.", "zh": "他在取号机上取了一张号。"}, {"en": "They waited in the waiting area.", "zh": "他们在等候区等待。"}, {"en": "When the screen showed their number, they went to the counter.", "zh": "屏幕显示他们的号时，他们走到柜台。"}, {"en": "Dad gave the teller his ID card.", "zh": "爸爸把身份证递给柜员。"}, {"en": "The teller checked the information on the computer.", "zh": "柜员在电脑上核对信息。"}, {"en": "She gave Dad the money and a receipt.", "zh": "她把钱和回执交给爸爸。"}, {"en": "Tom helped Dad count the money.", "zh": "汤姆帮爸爸数钱。"}], "vocab": {"verbs": [{"w": "check", "ipa": "/tʃek/", "zh": "核对；检查"}, {"w": "count", "ipa": "/kaʊnt/", "zh": "数"}, {"w": "give", "ipa": "/ɡɪv/", "zh": "给"}, {"w": "go to", "ipa": "/ɡoʊ tuː/", "zh": "去；前往"}, {"w": "help", "ipa": "/help/", "zh": "帮助"}, {"w": "take", "ipa": "/teɪk/", "zh": "取（号）"}, {"w": "wait", "ipa": "/weɪt/", "zh": "等待"}], "nouns": [{"w": "bank", "ipa": "/bæŋk/", "zh": "银行"}, {"w": "counter", "ipa": "/ˈkaʊntər/", "zh": "柜台"}, {"w": "ID card", "ipa": "/ˌaɪˈdiː kɑːrd/", "zh": "身份证"}, {"w": "machine", "ipa": "/məˈʃiːn/", "zh": "机器"}, {"w": "money", "ipa": "/ˈmʌni/", "zh": "钱"}, {"w": "number", "ipa": "/ˈnʌmbər/", "zh": "号码；数字"}, {"w": "number ticket", "ipa": "/ˈnʌmbər ˈtɪkɪt/", "zh": "排队号"}, {"w": "receipt", "ipa": "/rɪˈsiːt/", "zh": "回执"}, {"w": "screen", "ipa": "/skriːn/", "zh": "屏幕"}, {"w": "teller", "ipa": "/ˈtelər/", "zh": "（银行）柜员"}, {"w": "waiting area", "ipa": "/ˈweɪtɪŋ ˈeriə/", "zh": "等候区"}], "others": []}, "notes": [{"en": "A number ticket tells you your turn. The screen calls your number, then you go to the counter.", "zh": "排队号告诉你轮到你没有，屏幕叫号后你再去柜台。"}, {"en": "A teller is a bank worker who helps people do business at the counter.", "zh": "teller（柜员）是在柜台帮客户办理业务的银行工作人员。"}, {"en": "Many people in China do banking on their phones, so banks are not very busy now.", "zh": "现在很多中国人用手机银行办业务，银行柜台不太忙了。"}], "dialogue": [{"speaker": "Teller", "role": "mom", "en": "Number 32, please go to Counter 3.", "zh": "32 号，请到 3 号柜台。"}, {"speaker": "Dad", "role": "clerk", "en": "That's us. Come on, Tom!", "zh": "到我们了。走吧，汤姆！"}, {"speaker": "Teller", "role": "mom", "en": "Thanks. Have a nice day!", "zh": "谢谢。祝您愉快！"}], "china": [{"en": "In Chinese banks, you take a number ticket, wait in the waiting area, and watch the screen for your number.", "zh": "在中国银行，你要取号、在等候区等待、看屏幕叫号。"}, {"en": "Chinese banks use ID cards and electronic records instead of passbooks; kids usually go with parents for big money or new cards.", "zh": "中国银行用身份证和电子记录，不用存折；孩子通常是陪家长去办大额业务或开新卡。"}], "en": "Going to a Bank", "zh": "去银行", "grammarZh": "一般过去时"}, {"id": 50, "section": 4, "level": 1, "img": "assets/img/unit50.jpg", "grammar": "simple past", "grammarNote": {"en": "The simple past tense tells the story of Kate's trip to an ATM to withdraw cash.", "zh": "这里用一般过去时讲述凯特去自动取款机取钱的经历。"}, "steps": [{"en": "Mom needed some money...", "zh": "妈妈需要取一些钱……"}, {"en": "...so she went to an ATM in the store.", "zh": "……于是她去了超市里的 ATM 机。"}, {"en": "She took her bank card out of her purse.", "zh": "她从钱包里拿出银行卡。"}, {"en": "She inserted the card into the slot on the ATM.", "zh": "她把卡插进 ATM 机的插卡口。"}, {"en": "A message on the screen asked for her PIN...", "zh": "屏幕上提示输入密码……"}, {"en": "...so she entered her PIN by pressing keys on the keypad.", "zh": "……于是她按下键盘上的数字，输入了密码。"}, {"en": "Then she entered the amount of money she needed.", "zh": "然后她输入需要的金额。"}, {"en": "The machine returned her card...", "zh": "机器把卡退了出来……"}, {"en": "...and gave her her money.", "zh": "……把钱给了她。"}], "vocab": {"verbs": [{"w": "ask", "ipa": "/æsk/", "zh": "v. 要求，询问"}, {"w": "enter", "ipa": "/ˈentər/", "zh": "v. 输入（密码）"}, {"w": "give-gave", "ipa": "/ɡɪv/", "zh": "v. 给（过去式 gave）"}, {"w": "insert", "ipa": "/ɪnˈsɜːrt/", "zh": "v. 插入"}, {"w": "line up", "ipa": "/laɪn ʌp/", "zh": "v. 对准，对齐"}, {"w": "need", "ipa": "/niːd/", "zh": "v. 需要"}, {"w": "press", "ipa": "/pres/", "zh": "v. 按（键）"}, {"w": "return", "ipa": "/rɪˈtɜːrn/", "zh": "v. 吐出，退回"}, {"w": "take-took out", "ipa": "/teɪk aʊt/", "zh": "v. 取出（过去式 took）"}], "nouns": [{"w": "amount", "ipa": "/əˈmaʊnt/", "zh": "n. 金额，数量"}, {"w": "ATM", "ipa": "/ˌeɪ tiː ˈem/", "zh": "n. 自动取款机"}, {"w": "card", "ipa": "/kɑːrd/", "zh": "n. 卡"}, {"w": "cash", "ipa": "/kæʃ/", "zh": "n. 现金"}, {"w": "cash card", "ipa": "/kæʃ kɑːrd/", "zh": "n. 银行卡，取现卡"}, {"w": "key", "ipa": "/kiː/", "zh": "n. 键，按键"}, {"w": "keypad", "ipa": "/ˈkiːpæd/", "zh": "n. 键盘，按键区"}, {"w": "machine", "ipa": "/məˈʃiːn/", "zh": "n. 机器"}, {"w": "magnetic strip", "ipa": "/mæɡˈnetɪk strɪp/", "zh": "n. 磁条"}, {"w": "message", "ipa": "/ˈmesɪdʒ/", "zh": "n. 提示信息，消息"}, {"w": "money", "ipa": "/ˈmʌni/", "zh": "n. 钱"}, {"w": "PIN", "ipa": "/pɪn/", "zh": "n. 密码，个人识别码"}, {"w": "purse", "ipa": "/pɜːrs/", "zh": "n. 女式钱包"}, {"w": "screen", "ipa": "/skriːn/", "zh": "n. 屏幕"}, {"w": "slot", "ipa": "/slɑːt/", "zh": "n. 插卡口，狭缝"}, {"w": "store", "ipa": "/stɔːr/", "zh": "n. 商店"}], "others": [{"w": "properly", "ipa": "/ˈprɑːpərli/", "zh": "adv. 正确地，适当地"}]}, "notes": [{"en": "An ATM is an Automated Teller Machine. Another name for it is \"cash machine.\"", "zh": "ATM 是 Automated Teller Machine（自动柜员机）的缩写，也叫 cash machine。"}, {"en": "Cash is money in the form of notes and coins (not checks).", "zh": "cash 指纸币和硬币形式的现金，不包括支票。"}, {"en": "A PIN is a Personal Identification Number.", "zh": "PIN 是 Personal Identification Number 的缩写，即个人密码。"}, {"en": "You enter a number by typing it into a machine or writing it on a form.", "zh": "enter a number 是指在机器上键入数字，或在表格上写下数字。"}, {"en": "Insert something into means \"put something in.\" You insert something into an opening (a hole, a slot, etc.).", "zh": "insert something into 意思是“把某物放进去”，即把它插进一个开口（洞、插槽等）里。"}], "dialogue": [{"speaker": "Tom", "role": "clerk", "en": "Oops. Mom, where is the ATM?", "zh": "哎呀，妈妈，ATM 机在哪里？"}], "china": [{"en": "In China, ATM is called ATM 机; people insert the card, enter the PIN, and take out money.", "zh": "在中国，ATM 机就叫 ATM 机：插卡、输密码、取钱。可以说 insert the card（插卡）、enter the PIN（输密码）。"}, {"en": "Children can go with Mom to the ATM and watch her take out money.", "zh": "孩子可以陪妈妈去 ATM 机，看她取钱。可以说 take out money（取钱）。"}], "en": "Using an ATM", "zh": "使用ATM", "grammarZh": "一般过去时"}, {"id": 51, "section": 5, "level": 1, "img": "assets/img/unit51.jpg", "grammar": "Simple Past", "grammarNote": {"en": "The simple past tense describes completed actions that happened in the past. Regular verbs add -ed, but many common verbs are irregular (find→found, hear→heard, say→said, make→made).", "zh": "一般过去时用来描述过去发生并已完成的动作。规则动词加 -ed，但很多常见动词是不规则的（如 find→found、hear→heard、say→said、make→made）。"}, "steps": [{"en": "Jenny found Kate's number in her phone contacts.", "zh": "珍妮在手机通讯录里找到了凯特的号码。"}, {"en": "She tapped the call button on her phone...", "zh": "她在手机上点下拨打键……"}, {"en": "...and heard the phone ringing.", "zh": "……然后听到电话铃响。"}, {"en": "When Kate answered...", "zh": "当凯特接起电话时……"}, {"en": "...Jenny said hello and identified herself.", "zh": "……珍妮打了招呼并报上自己的名字。"}, {"en": "Then she said why she called.", "zh": "然后她说明了打电话的原因。"}, {"en": "They talked for a while, and Jenny said goodbye.", "zh": "她们聊了一会儿，珍妮说了再见。"}], "vocab": {"verbs": [{"w": "answer", "ipa": "/ˈænsər/", "zh": "接（电话）"}, {"w": "call", "ipa": "/kɔːl/", "zh": "打电话"}, {"w": "find (found)", "ipa": "/faɪnd/", "zh": "找到"}, {"w": "hear (heard)", "ipa": "/hɪr/", "zh": "听见"}, {"w": "identify", "ipa": "/aɪˈdentɪfaɪ/", "zh": "确认身份；识别"}, {"w": "make (made)", "ipa": "/meɪk/", "zh": "进行；做"}, {"w": "say (said)", "ipa": "/seɪ/", "zh": "说"}, {"w": "say goodbye", "ipa": "/seɪ ˌɡʊdˈbaɪ/", "zh": "道别"}, {"w": "say hello", "ipa": "/seɪ həˈloʊ/", "zh": "打招呼"}, {"w": "tap", "ipa": "/tæp/", "zh": "点按"}, {"w": "talk", "ipa": "/tɔːk/", "zh": "说话；通话"}], "nouns": [{"w": "call button", "ipa": "/kɔːl ˈbʌtn/", "zh": "拨打键"}, {"w": "contacts", "ipa": "/ˈkɑːntækts/", "zh": "通讯录"}, {"w": "mobile phone", "ipa": "/ˈmoʊbl foʊn/", "zh": "手机"}, {"w": "number", "ipa": "/ˈnʌmbər/", "zh": "号码"}], "others": [{"w": "why (conj.)", "ipa": "/waɪ/", "zh": "为什么；……的原因"}]}, "notes": [{"en": "Phone is a short way of saying \"telephone.\"", "zh": "phone 是 telephone（电话）的简略说法。"}, {"en": "On a mobile phone, you tap the call button to call someone.", "zh": "在手机上，点一下拨打键就可以给别人打电话。"}, {"en": "It's polite to say who you are first when you call someone.", "zh": "打电话时先报出自己的名字是有礼貌的做法。"}], "dialogue": [{"speaker": "Jenny", "role": "girl", "en": "Hi Kate. This is Jenny.", "zh": "嗨，凯特。我是珍妮。"}, {"speaker": "Kate", "role": "clerk", "en": "Hello?", "zh": "喂？"}, {"speaker": "Jenny", "role": "girl", "en": "I'm calling to see whether you'd like to go swimming.", "zh": "我打电话来是想问你想不想去游泳。"}, {"speaker": "Kate", "role": "clerk", "en": "Sure! That sounds fun!", "zh": "好啊！听起来真有趣！"}], "china": [{"en": "In China, people rarely use traditional landline phones; most people call directly on mobile phones.", "zh": "在中国，人们很少使用传统座机，大多直接用手机打电话。"}, {"en": "Phone numbers are saved in contacts, so people no longer need a phone book.", "zh": "号码都存在手机通讯录里，人们不再需要电话簿。"}], "en": "Making a Phone Call", "zh": "用手机打电话", "grammarZh": "一般过去时"}, {"id": 52, "section": 5, "level": 1, "img": "assets/img/unit52.jpg", "grammar": "Simple Past", "grammarNote": {"en": "This unit continues the simple past with irregular forms like hear→heard, hang→hung, speak→spoke, tell→told, know→knew, as the story describes a completed phone call.", "zh": "本单元继续使用一般过去时，通过 hear→heard、hang→hung、speak→spoke、tell→told、know→knew 等不规则过去式，叙述一次已完成的通话。"}, "steps": [{"en": "Kate heard the phone ringing...", "zh": "凯特听到手机响了……"}, {"en": "...and tapped the screen to answer the call.", "zh": "……她轻点屏幕接听了电话。"}, {"en": "She answered the phone by saying hello...", "zh": "她接起电话说了声你好……"}, {"en": "...and then let the caller speak.", "zh": "……然后让对方说话。"}, {"en": "They talked for a while,...", "zh": "她们聊了一会儿……"}, {"en": "...and then she hung up.", "zh": "……然后她挂断了电话。"}, {"en": "Kate didn't know the person the caller asked for.", "zh": "凯特不认识对方要找的人。"}, {"en": "She told him that he had the wrong number.", "zh": "她告诉对方打错电话了。"}, {"en": "He apologized and hung up.", "zh": "对方道了歉，挂断了电话。"}], "vocab": {"verbs": [{"w": "answer", "ipa": "/ˈænsər/", "zh": "接（电话）；回答"}, {"w": "apologize", "ipa": "/əˈpɑːlədʒaɪz/", "zh": "道歉"}, {"w": "ask for", "ipa": "/æsk fɔːr/", "zh": "请求找（某人）"}, {"w": "hang / hung up", "ipa": "/hæŋ / hʌŋ ʌp/", "zh": "挂断电话"}, {"w": "hear / heard", "ipa": "/hɪr / hɜːrd/", "zh": "听见"}, {"w": "know / knew", "ipa": "/noʊ / nuː/", "zh": "认识；知道"}, {"w": "let / let", "ipa": "/let/", "zh": "让；允许"}, {"w": "pick up", "ipa": "/pɪk ʌp/", "zh": "拿起；接听"}, {"w": "ring / rang", "ipa": "/rɪŋ / ræŋ/", "zh": "（电话）响铃"}, {"w": "say hello", "ipa": "/seɪ həˈloʊ/", "zh": "打招呼；问好"}, {"w": "speak / spoke", "ipa": "/spiːk / spoʊk/", "zh": "说话"}, {"w": "talk", "ipa": "/tɔːk/", "zh": "交谈"}, {"w": "tell / told", "ipa": "/tel / toʊld/", "zh": "告诉"}], "nouns": [{"w": "caller", "ipa": "/ˈkɔːlər/", "zh": "来电者"}, {"w": "person", "ipa": "/ˈpɜːrsn/", "zh": "人"}, {"w": "phone", "ipa": "/foʊn/", "zh": "电话"}, {"w": "receiver", "ipa": "/rɪˈsiːvər/", "zh": "听筒"}, {"w": "telephone", "ipa": "/ˈtelɪfoʊn/", "zh": "电话"}, {"w": "wrong number", "ipa": "/rɔːŋ ˈnʌmbər/", "zh": "打错的号码"}], "others": [{"w": "for a while", "ipa": "/fɔːr ə waɪl/", "zh": "一会儿；暂时"}]}, "notes": [{"en": "To let someone speak you stay silent.", "zh": "让对方说话时，你保持沉默。"}, {"en": "The person who answers a phone usually speaks first.", "zh": "接电话的人通常先开口说话。"}, {"en": "The caller usually says goodbye first.", "zh": "打电话的人通常先说再见。"}], "dialogue": [{"speaker": "Kate", "role": "girl", "en": "Hello?", "zh": "喂？"}, {"speaker": "Jenny", "role": "girl", "en": "Hi, Kate. This is Jenny.", "zh": "嗨，凯特。我是珍妮。"}, {"speaker": "Jenny", "role": "girl", "en": "...whether you'd like to go swimming.", "zh": "……想问问你要不要去游泳。"}, {"speaker": "Kate", "role": "girl", "en": "I'd love to, Jenny. When?", "zh": "我很想去，珍妮。什么时候？"}, {"speaker": "Man", "role": "teacher", "en": "Could I speak with Mike?", "zh": "请问迈克在吗？"}, {"speaker": "Kate", "role": "girl", "en": "I'm sorry. There's no one here by that name. You've got the wrong number.", "zh": "对不起，这里没有叫这个名字的人。你打错电话了。"}, {"speaker": "Man", "role": "teacher", "en": "Ooops! Sorry!", "zh": "哎呀！对不起！"}], "china": [{"en": "In China, people tap the screen to answer a call on their phone.", "zh": "在中国，大家用手机都是点一下屏幕接听电话。可以说 tap to answer（点按接听）。"}, {"en": "It's polite to say 'Wei?' (Hello?) when answering.", "zh": "接电话时礼貌地说“喂？”。可以说 answer the phone（接电话）。"}], "en": "Answering a Telephone", "zh": "接电话", "grammarZh": "一般过去时"}, {"id": 53, "section": 5, "level": 1, "img": "assets/img/unit53.jpg", "grammar": "Simple Past", "grammarNote": {"en": "The simple past describes a completed phone interaction: asked, wasn't, identified, agreed, repeated, left, asked. Note the irregular verbs leave→left, speak→spoke, take→took.", "zh": "一般过去时描述一次已完成的通话：asked、wasn't、identified、agreed、repeated、left、asked。注意不规则动词 leave→left、speak→spoke、take→took。"}, "steps": [{"en": "I asked to speak to Leo...", "zh": "我打电话想找利奥……"}, {"en": "...but he wasn't available.", "zh": "……但他不在。"}, {"en": "I identified myself and asked her to take a message.", "zh": "我报上自己的名字，请她帮忙带个口信。"}, {"en": "She agreed and asked me to repeat my name.", "zh": "她答应了，请我把名字再说一遍。"}, {"en": "I repeated it...", "zh": "我又说了一遍……"}, {"en": "...and spelled my last name.", "zh": "……还拼写了自己的姓。"}, {"en": "I also left my phone number...", "zh": "我还留下了电话号码……"}, {"en": "...and asked that he call me back.", "zh": "……请他给我回电话。"}], "vocab": {"verbs": [{"w": "agree", "ipa": "/əˈɡriː/", "zh": "同意；答应"}, {"w": "ask", "ipa": "/æsk/", "zh": "请求；问"}, {"w": "call", "ipa": "/kɔːl/", "zh": "打电话"}, {"w": "call back", "ipa": "/kɔːl bæk/", "zh": "回电话"}, {"w": "identify", "ipa": "/aɪˈdentɪfaɪ/", "zh": "报出身份；识别"}, {"w": "leave / left", "ipa": "/liːv / left/", "zh": "留下；离开"}, {"w": "repeat", "ipa": "/rɪˈpiːt/", "zh": "重复"}, {"w": "speak / spoke", "ipa": "/spiːk / spoʊk/", "zh": "说话；交谈"}, {"w": "spell", "ipa": "/spel/", "zh": "拼写"}, {"w": "take / took", "ipa": "/teɪk / tʊk/", "zh": "记下；带走"}], "nouns": [{"w": "last name", "ipa": "/læst neɪm/", "zh": "姓氏"}, {"w": "message", "ipa": "/ˈmesɪdʒ/", "zh": "口信；留言"}, {"w": "name", "ipa": "/neɪm/", "zh": "名字"}, {"w": "number", "ipa": "/ˈnʌmbər/", "zh": "电话号码"}], "others": [{"w": "available (adj.)", "ipa": "/əˈveɪləbl/", "zh": "有空的；可联系到的"}]}, "notes": [{"en": "Someone who is available is able to see you or speak with you. If he is not available, he may be somewhere else or too busy to speak to you.", "zh": "available 指某人能见你或能和你说话。如果他 not available，可能是不在或太忙没空接你。"}, {"en": "When you leave your message, you tell it to whoever is taking the message.", "zh": "当你留言时，你把话告诉那个帮你捎口信的人。"}, {"en": "To repeat something is to say it again.", "zh": "repeat 就是把话再说一遍。"}, {"en": "Alex Rivera's first name is \"Alex.\" His last name is \"Rivera.\" For most people of European descent, the last name is a family name. It is also called a \"surname.\"", "zh": "亚历克斯·里维拉的名是 Alex，姓是 Rivera。对大多数欧洲血统的人来说，姓就是家族姓氏，也叫 surname。"}], "dialogue": [{"speaker": "Tom", "role": "clerk", "en": "Can I speak to Leo, please?", "zh": "请问利奥在吗？"}, {"speaker": "Mom", "role": "mom", "en": "I'm sorry, but he's not here right now.", "zh": "对不起，他现在不在。"}, {"speaker": "Tom", "role": "clerk", "en": "This is Tom, Leo's classmate. Could you please take a message for him?", "zh": "我是汤姆，利奥的同学。你能帮我带个口信吗？"}, {"speaker": "Mom", "role": "mom", "en": "Sure. I'm sorry. I didn't catch your name.", "zh": "当然可以。对不起，我没听清你的名字。"}, {"speaker": "Tom", "role": "clerk", "en": "It's Tom. Tom Wang.", "zh": "我叫汤姆。汤姆·王。"}, {"speaker": "Mom", "role": "mom", "en": "Could you spell that out, please?", "zh": "能拼一下吗？"}, {"speaker": "Tom", "role": "clerk", "en": "Sure. That's T-O-M W-A-N-G.", "zh": "好的。T-O-M W-A-N-G。"}, {"speaker": "Mom", "role": "mom", "en": "And your number?", "zh": "你的电话是多少？"}, {"speaker": "Tom", "role": "clerk", "en": "It's 138-1234-5678. Could you ask him to give me a call, please? Thanks.", "zh": "138-1234-5678。请让他给我回个电话，谢谢。"}], "china": [{"en": "In China, phone numbers have 11 digits and start with 1 (like 138-...).", "zh": "在中国，手机号是 11 位，以 1 开头（比如 138-……）。可以说 phone number（电话号码）。"}, {"en": "Children can leave a message for classmates politely.", "zh": "孩子可以礼貌地给同学留口信。可以说 leave a message（留言）。"}], "en": "Leaving a Message", "zh": "留言", "grammarZh": "一般过去时"}, {"id": 54, "section": 5, "level": 1, "img": "assets/img/unit54.jpg", "grammar": "Simple Past", "grammarNote": {"en": "The past tense narrates the sequence: answered, asked, said, offered, left, wrote, put, got, returned. Irregular forms include leave→left, take→took, write→wrote, put→put.", "zh": "过去时按顺序叙述：answered、asked、said、offered、left、wrote、put、got、returned。不规则形式有 leave→left、take→took、write→wrote、put→put。"}, "steps": [{"en": "Jenny answered the phone...", "zh": "珍妮接了电话……"}, {"en": "...and the caller asked for Mom.", "zh": "……对方要找妈妈。"}, {"en": "She said Mom wasn't available and offered to take a message.", "zh": "她说妈妈现在不方便接电话，并提出帮忙带口信。"}, {"en": "The caller left a message for Mom.", "zh": "对方给妈妈留了口信。"}, {"en": "Jenny wrote the message on some notepaper...", "zh": "珍妮把口信写在便条纸上……"}, {"en": "...and put it next to the phone.", "zh": "……放在电话旁边。"}, {"en": "Later, Mom got the message...", "zh": "后来，妈妈看到了留言……"}, {"en": "...and returned Ms. Wang's call.", "zh": "……给王女士回了电话。"}], "vocab": {"verbs": [{"w": "answer", "ipa": "/ˈænsər/", "zh": "接（电话）"}, {"w": "ask for", "ipa": "/æsk fɔːr/", "zh": "请求找（某人）"}, {"w": "leave / left", "ipa": "/liːv / left/", "zh": "留下"}, {"w": "offer", "ipa": "/ˈɔːfər/", "zh": "主动提出"}, {"w": "return a call", "ipa": "/rɪˈtɜːrn ə kɔːl/", "zh": "回电话"}, {"w": "take / took", "ipa": "/teɪk / tʊk/", "zh": "记下；捎（口信）"}, {"w": "write / wrote", "ipa": "/raɪt / roʊt/", "zh": "写"}], "nouns": [{"w": "caller", "ipa": "/ˈkɔːlər/", "zh": "来电者"}, {"w": "message", "ipa": "/ˈmesɪdʒ/", "zh": "口信；留言"}, {"w": "notepaper", "ipa": "/ˈnoʊtpeɪpər/", "zh": "便签纸"}, {"w": "phone", "ipa": "/foʊn/", "zh": "电话"}], "others": [{"w": "available (adj.)", "ipa": "/əˈveɪləbl/", "zh": "有空的；可联系到的"}, {"w": "later (adv.)", "ipa": "/ˈleɪtər/", "zh": "后来；稍后"}]}, "notes": [{"en": "Pam says \"He can't come to the phone.\" This is a way of not giving too much information about Dan.", "zh": "帕姆说“He can't come to the phone”（他没法来接电话），这是一种不透露丹太多信息的委婉说法。"}, {"en": "The caller left a message for Dan with Pam.", "zh": "来电者通过帕姆给丹留了言。"}, {"en": "Notepaper is usually small, especially for taking short messages. Many sheets of notepaper joined together make a notepad.", "zh": "便签纸通常很小，尤其用来记短留言。许多张便签纸订在一起就是一个便签本。"}, {"en": "If you return a call, you call back someone who left a message for you.", "zh": "回电话就是给给你留言的人回拨过去。"}, {"en": "Pam offered to take a message by saying, \"Can I take a message?\" Other ways to say this are: \"Would you like to leave a message?\" and \"Is there any message?\"", "zh": "帕姆通过说“Can I take a message?”主动提出捎口信。其他说法有：“Would you like to leave a message?”和“Is there any message?”"}], "dialogue": [{"speaker": "Jenny", "role": "girl", "en": "Hello!", "zh": "喂！"}, {"speaker": "Ms. Wang", "role": "teacher", "en": "Is your mom there, please?", "zh": "请问你妈妈在吗？"}, {"speaker": "Jenny", "role": "girl", "en": "Sorry. She can't come to the phone right now. Can I take a message?", "zh": "对不起，她现在接不了电话。要我带个口信吗？"}, {"speaker": "Ms. Wang", "role": "teacher", "en": "Yes, please tell her that Ms. Wang called.", "zh": "好的，请告诉她王女士来过电话。"}, {"speaker": "Mom", "role": "mom", "en": "Hi, Ms. Wang. This is Jenny's mom. You called?", "zh": "嗨，王女士。我是珍妮的妈妈。您打过电话？"}], "china": [{"en": "In China, children often write a note (便条) when taking a message for parents.", "zh": "在中国，孩子帮大人记口信时常常写便条。可以说 take a message（记留言）、notepaper（便条纸）。"}, {"en": "Politely say 'Wei?' when answering the phone.", "zh": "接电话时礼貌地说“喂？”。"}], "en": "Taking a Message", "zh": "记留言", "grammarZh": "一般过去时"}, {"id": 55, "section": 5, "level": 1, "img": "assets/img/unit55.jpg", "grammar": "Simple Past", "grammarNote": {"en": "The past tense tells a complete story of voice messages: recorded, heard, left, got home, saw, tapped, played, listened, took, deleted. Irregular verbs: get→got, hear→heard, leave→left, see→saw, take→took.", "zh": "过去时完整讲述语音留言的过程：recorded、heard、left、got home、saw、tapped、played、listened、took、deleted。不规则动词：get→got、hear→heard、leave→left、see→saw、take→took。"}, "steps": [{"en": "Tom recorded a voice message on his phone.", "zh": "汤姆在手机上录了一段语音留言。"}, {"en": "When Jenny called him, she heard the message...", "zh": "珍妮打电话给他时，听到了这段留言……"}, {"en": "...and left her own voice message for him.", "zh": "……并给他留了自己的语音留言。"}, {"en": "When Tom got home, he saw a red dot on his phone.", "zh": "汤姆回家时，看到手机上有红点。"}, {"en": "He tapped the message to play it.", "zh": "他点开留言播放。"}, {"en": "As he listened to it, he took some notes.", "zh": "他听留言时，记了一些笔记。"}, {"en": "Then he deleted the message.", "zh": "然后他删除了留言。"}], "vocab": {"verbs": [{"w": "call", "ipa": "/kɔːl/", "zh": "打电话"}, {"w": "delete", "ipa": "/dɪˈliːt/", "zh": "删除"}, {"w": "get / got home", "ipa": "/ɡet / ɡɑːt/", "zh": "回到家"}, {"w": "hear / heard", "ipa": "/hɪr / hɜːrd/", "zh": "听到"}, {"w": "leave / left", "ipa": "/liːv / left/", "zh": "留下"}, {"w": "listen to", "ipa": "/ˈlɪsn tuː/", "zh": "听"}, {"w": "play", "ipa": "/pleɪ/", "zh": "播放"}, {"w": "record", "ipa": "/rɪˈkɔːrd/", "zh": "录制"}, {"w": "see / saw", "ipa": "/siː / sɔː/", "zh": "看见"}, {"w": "take / took notes", "ipa": "/teɪk / tʊk noʊts/", "zh": "记笔记"}, {"w": "tap", "ipa": "/tæp/", "zh": "轻点"}], "nouns": [{"w": "message", "ipa": "/ˈmesɪdʒ/", "zh": "留言；消息"}, {"w": "notes", "ipa": "/noʊts/", "zh": "笔记；记录"}, {"w": "phone", "ipa": "/foʊn/", "zh": "手机"}, {"w": "red dot", "ipa": "/red dɑːt/", "zh": "红点（新消息提示）"}, {"w": "voice message", "ipa": "/vɔɪs ˈmesɪdʒ/", "zh": "语音留言"}], "others": [{"w": "right now (adverbial)", "ipa": "/raɪt naʊ/", "zh": "现在"}, {"w": "together (adv.)", "ipa": "/təˈɡeðər/", "zh": "一起"}]}, "notes": [{"en": "When you record a voice message, you put it on the phone. When you delete it, you take it off.", "zh": "录制语音留言就是把它存进手机，删除就是把它清掉。"}, {"en": "In WeChat, a red dot shows that a new voice message is waiting for you.", "zh": "在微信里，红点提示你有新的语音留言等着听。"}, {"en": "A voice message can be played again and again, and it is saved automatically.", "zh": "语音留言可以反复播放，而且会自动保存。"}], "dialogue": [{"speaker": "Tom", "role": "clerk", "en": "I can't answer the phone right now. Please leave a message.", "zh": "我现在不能接电话，请留言。"}, {"speaker": "Jenny", "role": "girl", "en": "Tom, this is Jenny. Please call me back. Let's play basketball together!", "zh": "汤姆，我是珍妮。请给我回电话，我们一起打篮球吧！"}, {"speaker": "Tom", "role": "clerk", "en": "I don't need that anymore.", "zh": "不再需要这条留言了。"}], "china": [{"en": "In China, answering machines are almost gone; people leave WeChat voice messages instead.", "zh": "在中国，答录机几乎绝迹，大家改用微信语音留言。"}, {"en": "WeChat voice messages are saved and can be replayed anytime, so no one needs to erase them by hand.", "zh": "微信语音会自动保存、随时重听，不需要手动删除。"}], "en": "Leaving a Voice Message", "zh": "微信语音留言", "grammarZh": "一般过去时"}, {"id": 56, "section": 5, "level": 1, "img": "assets/img/unit56.jpg", "grammar": "Simple Past", "grammarNote": {"en": "The narrative uses the simple past (took out, wrote, told, asked, signed) to describe writing a letter step by step.", "zh": "叙述使用一般过去时（took out 拿出、wrote 写、told 告诉、asked 问、signed 签名）描述写信的整个过程。"}, "steps": [{"en": "Jenny took out some paper and a pencil to write a letter to her cousin.", "zh": "珍妮拿出纸和铅笔，给表姐写信。"}, {"en": "She wrote the date and a greeting at the top.", "zh": "她在上方写了日期和称呼。"}, {"en": "She wrote about what she had been doing.", "zh": "她写了自己最近在做什么。"}, {"en": "She told her cousin about the funny things at school.", "zh": "她告诉表姐学校里的趣事。"}, {"en": "She asked her cousin about her new school.", "zh": "她问了表姐新学校的情况。"}, {"en": "Then she wrote a closing...", "zh": "然后她写了结尾敬语……"}, {"en": "...and signed the letter.", "zh": "……并在信上签了名。"}, {"en": "She put the letter in an envelope.", "zh": "她把信装进信封。"}], "vocab": {"verbs": [{"w": "ask", "ipa": "/æsk/", "zh": "问；询问"}, {"w": "put (put) in", "ipa": "/pʊt ɪn/", "zh": "放进"}, {"w": "sign", "ipa": "/saɪn/", "zh": "签名"}, {"w": "take (took) out", "ipa": "/teɪk aʊt/", "zh": "拿出；取出"}, {"w": "tell (told)", "ipa": "/tel/", "zh": "告诉"}, {"w": "write (wrote)", "ipa": "/raɪt/", "zh": "写"}], "nouns": [{"w": "closing", "ipa": "/ˈkloʊzɪŋ/", "zh": "结尾敬语（如“爱你的”）"}, {"w": "cousin", "ipa": "/ˈkʌzn/", "zh": "表姐；表妹；表哥"}, {"w": "date", "ipa": "/deɪt/", "zh": "日期"}, {"w": "envelope", "ipa": "/ˈenvəloʊp/", "zh": "信封"}, {"w": "greeting", "ipa": "/ˈɡriːtɪŋ/", "zh": "称呼（如“亲爱的……”）"}, {"w": "letter", "ipa": "/ˈletər/", "zh": "信"}, {"w": "paper", "ipa": "/ˈpeɪpər/", "zh": "纸；信纸"}, {"w": "pencil", "ipa": "/ˈpensl/", "zh": "铅笔"}, {"w": "top", "ipa": "/tɑːp/", "zh": "顶部；上方"}], "others": [{"w": "personal (adj.)", "ipa": "/ˈpɜːrsənl/", "zh": "私人的；个人的"}]}, "notes": [{"en": "A personal letter is a letter to a friend or relative. It is written differently from a business letter.", "zh": "私人信件是写给朋友或亲戚的信，写法与商务信件不同。"}, {"en": "The greeting in a letter usually starts with \"Dear,\" e.g., \"Dear Mom,\" \"Dear Jim,\" etc.", "zh": "信里的称呼通常以“Dear”开头，例如“Dear Mom”“Dear Jim”等。"}, {"en": "The closing of a letter comes just before your signature.", "zh": "信的结尾敬语就在签名之前。"}], "dialogue": [{"speaker": "Mom", "role": "mom", "en": "Who are you writing to, Jenny?", "zh": "珍妮，你在给谁写信？"}, {"speaker": "Jenny", "role": "girl", "en": "I'm writing to my cousin in Shanghai.", "zh": "我给在上海的表姐写信。"}, {"speaker": "Mom", "role": "mom", "en": "What a nice surprise for her!", "zh": "对她来说真是个惊喜！"}], "china": [{"en": "In China, handwritten personal letters are rare; people use WeChat messages or email to stay in touch.", "zh": "在中国，手写信件很少见，人们用微信消息或电子邮件联系。"}, {"en": "Writing a letter to a faraway relative is a special, thoughtful surprise.", "zh": "给远方的亲人写一封信，是一份特别而用心的小惊喜。"}], "en": "Writing a Personal Letter", "zh": "写信给表姐", "grammarZh": "一般过去时"}, {"id": 57, "section": 5, "level": 1, "img": "assets/img/unit57.jpg", "grammar": "Simple Present", "grammarNote": {"en": "Sending a package is described as a routine procedure using the simple present tense (I put, I write, I seal, I stand, I weigh, I pay).", "zh": "寄包裹作为一种常规流程使用一般现在时叙述（I put、I write、I seal、I stand、I weigh、I pay）。"}, "steps": [{"en": "I put a picture in a small box.", "zh": "我把一幅画放进小盒子里。"}, {"en": "I write Grandma's address on the box.", "zh": "我在盒子上写奶奶的地址。"}, {"en": "I seal the box with tape.", "zh": "我用胶带封好盒子。"}, {"en": "I take the box to the express station.", "zh": "我把盒子带到快递驿站。"}, {"en": "I stand in line.", "zh": "我排队。"}, {"en": "When it's my turn, I give the box to the clerk.", "zh": "轮到我时，我把盒子递给工作人员。"}, {"en": "He asks me where I want to send it...", "zh": "他问我寄到哪里……"}, {"en": "...and weighs the box.", "zh": "……然后称了盒子的重量。"}, {"en": "I pay the fee with my mom's phone.", "zh": "我用妈妈的手机扫码付款。"}, {"en": "He gives me a receipt and a tracking number.", "zh": "他给我回执和快递单号。"}], "vocab": {"verbs": [{"w": "ask", "ipa": "/æsk/", "zh": "问"}, {"w": "give", "ipa": "/ɡɪv/", "zh": "给"}, {"w": "hope", "ipa": "/hoʊp/", "zh": "希望"}, {"w": "pay", "ipa": "/peɪ/", "zh": "付款"}, {"w": "put in", "ipa": "/pʊt ɪn/", "zh": "放入"}, {"w": "seal", "ipa": "/siːl/", "zh": "封（盒子）"}, {"w": "send", "ipa": "/send/", "zh": "寄送"}, {"w": "stand in line", "ipa": "/stænd ɪn laɪn/", "zh": "排队"}, {"w": "take", "ipa": "/teɪk/", "zh": "带去；拿"}, {"w": "weigh", "ipa": "/weɪ/", "zh": "称……的重量"}, {"w": "write", "ipa": "/raɪt/", "zh": "写"}], "nouns": [{"w": "address", "ipa": "/əˈdres/", "zh": "地址"}, {"w": "box", "ipa": "/bɑːks/", "zh": "盒子"}, {"w": "clerk", "ipa": "/klɜːrk/", "zh": "工作人员"}, {"w": "express station", "ipa": "/ɪkˈspres ˈsteɪʃn/", "zh": "快递驿站"}, {"w": "fee", "ipa": "/fiː/", "zh": "费用"}, {"w": "picture", "ipa": "/ˈpɪktʃər/", "zh": "画；图片"}, {"w": "receipt", "ipa": "/rɪˈsiːt/", "zh": "回执"}, {"w": "tape", "ipa": "/teɪp/", "zh": "胶带"}, {"w": "tracking number", "ipa": "/ˈtrækɪŋ ˈnʌmbər/", "zh": "快递单号"}, {"w": "turn", "ipa": "/tɜːrn/", "zh": "轮到的机会"}], "others": [{"w": "enough (adj.)", "ipa": "/ɪˈnʌf/", "zh": "足够的"}]}, "notes": [{"en": "Stand in line — usually without \"a\" or \"the.\" When you stand in line, you wait for your turn.", "zh": "stand in line（排队）通常不加 a 或 the，排队就是等待轮到你。"}, {"en": "An express station (快递驿站) is a small shop where you can send and pick up packages.", "zh": "express station（快递驿站）是收发包裹的小店。"}, {"en": "A tracking number lets you follow the package on your phone until it arrives.", "zh": "快递单号可以让你在手机上跟踪包裹，直到它送达。"}], "dialogue": [{"speaker": "Alex", "role": "clerk", "en": "I hope Grandma likes the picture!", "zh": "希望奶奶喜欢这幅画！"}, {"speaker": "Clerk", "role": "mom", "en": "Where do you want to send it?", "zh": "您要寄到哪里？"}, {"speaker": "Mom", "role": "mom", "en": "To Zhengzhou.", "zh": "寄到郑州。"}, {"speaker": "Clerk", "role": "mom", "en": "It's 10 yuan, please.", "zh": "10 元。"}, {"speaker": "Mom", "role": "mom", "en": "Okay. Here's the payment code.", "zh": "好的，付款码在这。"}], "china": [{"en": "In China, sending things is mostly done at express stations or by door pickup; stamps and post offices are rare.", "zh": "在中国，寄东西主要去快递驿站或上门取件，邮票和邮局很少见了。"}, {"en": "People pay the delivery fee by scanning a code, and track the package with the tracking number on the phone.", "zh": "大家扫码付快递费，再用快递单号在手机上跟踪物流。"}], "en": "Sending a Package", "zh": "寄包裹", "grammarZh": "一般现在时"}, {"id": 58, "section": 6, "level": 1, "img": "assets/img/unit58.jpg", "grammar": "Simple Present", "grammarNote": {"en": "The simple present describes the usual, repeated steps of going to a birthday party: I wrap, I give, someone lights, we sing, he opens, everyone eats.", "zh": "一般现在时描述参加生日聚会通常的、重复的步骤：I wrap、I give、someone lights、we sing、he opens、everyone eats。"}, "steps": [{"en": "Before the party, I wrap a present for my friend...", "zh": "派对开始前，我给朋友包了一份礼物……"}, {"en": "...and sign a card for him.", "zh": "……还给他写了一张贺卡。"}, {"en": "At the party, I give him the present and the card.", "zh": "派对上，我把礼物和贺卡送给他。"}, {"en": "Someone lights the candles on the birthday cake.", "zh": "有人点燃了生日蛋糕上的蜡烛。"}, {"en": "We all sing \"Happy Birthday\"...", "zh": "我们一起唱“祝你生日快乐”……"}, {"en": "...and Leo blows out the candles.", "zh": "……利奥吹灭了蜡烛。"}, {"en": "He opens his birthday presents...", "zh": "他拆开生日礼物……"}, {"en": "...and then everyone eats cake and ice cream.", "zh": "……然后大家一起吃蛋糕和冰淇淋。"}], "vocab": {"verbs": [{"w": "blow out", "ipa": "/bloʊ aʊt/", "zh": "吹灭"}, {"w": "eat", "ipa": "/iːt/", "zh": "吃"}, {"w": "give", "ipa": "/ɡɪv/", "zh": "给；赠送"}, {"w": "go to", "ipa": "/ɡoʊ tuː/", "zh": "去（参加）"}, {"w": "light", "ipa": "/laɪt/", "zh": "点燃"}, {"w": "open", "ipa": "/ˈoʊpən/", "zh": "打开（礼物）"}, {"w": "sign", "ipa": "/saɪn/", "zh": "签名；写贺卡"}, {"w": "sing", "ipa": "/sɪŋ/", "zh": "唱歌"}, {"w": "wrap", "ipa": "/ræp/", "zh": "包（礼物）"}], "nouns": [{"w": "birthday party", "ipa": "/ˈbɜːrθdeɪ ˈpɑːrti/", "zh": "生日聚会"}, {"w": "cake", "ipa": "/keɪk/", "zh": "蛋糕"}, {"w": "candle", "ipa": "/ˈkændl/", "zh": "蜡烛"}, {"w": "card", "ipa": "/kɑːrd/", "zh": "贺卡"}, {"w": "friend", "ipa": "/frend/", "zh": "朋友"}, {"w": "ice cream", "ipa": "/aɪs kriːm/", "zh": "冰淇淋"}, {"w": "match", "ipa": "/mætʃ/", "zh": "火柴"}, {"w": "present", "ipa": "/ˈpreznt/", "zh": "礼物"}, {"w": "wrapping paper", "ipa": "/ˈræpɪŋ ˈpeɪpər/", "zh": "包装纸"}], "others": [{"w": "happy (adj.)", "ipa": "/ˈhæpi/", "zh": "快乐的；幸福的"}]}, "notes": [{"en": "A present is a gift for a special occasion (a birthday, Christmas, etc.).", "zh": "present（礼物）是为特殊场合（生日、圣诞节等）准备的礼品。"}, {"en": "You wrap a present in wrapping paper.", "zh": "你用包装纸把礼物包起来。"}, {"en": "You open a present by taking off the wrapping paper.", "zh": "你撕开包装纸打开礼物。"}, {"en": "You light a candle by making the wick burn.", "zh": "你点燃烛芯使蜡烛燃烧。"}, {"en": "When you blow out a candle, the fire stops burning.", "zh": "当你吹灭蜡烛时，火焰就停止燃烧。"}], "dialogue": [{"speaker": "Tom", "role": "clerk", "en": "Here you go, Leo. Happy birthday.", "zh": "给你，利奥。生日快乐！"}, {"speaker": "Leo", "role": "clerk", "en": "Thanks, Tom. Come on in.", "zh": "谢谢你，汤姆。快进来。"}, {"speaker": "Leo", "role": "clerk", "en": "Hey, I've been wanting this toy car. Thanks!", "zh": "嘿，我正想要这辆玩具车呢。谢谢！"}], "china": [{"en": "In China, children celebrate birthdays with a cake, candles, and presents.", "zh": "在中国，孩子过生日会吃蛋糕、吹蜡烛、收礼物。可以说 birthday cake（生日蛋糕）、birthday present（生日礼物）。"}, {"en": "The birthday child makes a wish before blowing out the candles.", "zh": "吹蜡烛前，小寿星会先许个愿。可以说 make a wish（许愿）。"}], "en": "Going to a Birthday Party", "zh": "参加生日派对", "grammarZh": "一般现在时"}, {"id": 59, "section": 6, "level": 1, "img": "assets/img/unit59.jpg", "grammar": "Simple Present", "grammarNote": {"en": "The simple present describes the typical sequence of a family dinner: greets, give, say hello, introduces, shake hands, make small talk, have dinner, say goodnight.", "zh": "一般现在时描述家庭聚餐的典型流程：greets、give、say hello、introduces、shake hands、make small talk、have dinner、say goodnight。"}, "steps": [{"en": "Grandpa (the host) greets Tom and Jenny (the guests) at the door.", "zh": "爷爷（主人）在门口迎接汤姆和珍妮（客人）。"}, {"en": "They give him some fruit and tea they brought.", "zh": "他们把带来的水果和茶叶送给他。"}, {"en": "Inside, they say hello to some people they know.", "zh": "进屋后，他们跟认识的人打招呼。"}, {"en": "Grandpa introduces them to some people.", "zh": "爷爷把他们介绍给其他人。"}, {"en": "They shake hands...", "zh": "他们握手……"}, {"en": "...and make some small talk.", "zh": "……然后寒暄了几句。"}, {"en": "They have their dinner together.", "zh": "他们一起吃晚餐。"}, {"en": "At the end of the evening, the guests say goodnight and thank Grandpa.", "zh": "聚会结束时，客人们道晚安并感谢爷爷。"}], "vocab": {"verbs": [{"w": "bring", "ipa": "/brɪŋ/", "zh": "带来"}, {"w": "give", "ipa": "/ɡɪv/", "zh": "给；赠送"}, {"w": "greet", "ipa": "/ɡriːt/", "zh": "迎接；问候"}, {"w": "go to", "ipa": "/ɡoʊ tuː/", "zh": "去（参加）"}, {"w": "have", "ipa": "/hæv/", "zh": "吃；进行"}, {"w": "introduce", "ipa": "/ˌɪntrəˈduːs/", "zh": "介绍"}, {"w": "know", "ipa": "/noʊ/", "zh": "认识；知道"}, {"w": "make", "ipa": "/meɪk/", "zh": "进行（交谈）"}, {"w": "say goodnight", "ipa": "/seɪ ˌɡʊdˈnaɪt/", "zh": "道晚安"}, {"w": "say hello", "ipa": "/seɪ həˈloʊ/", "zh": "打招呼"}, {"w": "shake hands", "ipa": "/ʃeɪk hændz/", "zh": "握手"}, {"w": "thank", "ipa": "/θæŋk/", "zh": "感谢"}], "nouns": [{"w": "aunt", "ipa": "/ænt/", "zh": "阿姨；姑姑"}, {"w": "door", "ipa": "/dɔːr/", "zh": "门"}, {"w": "dinner", "ipa": "/ˈdɪnər/", "zh": "晚餐"}, {"w": "evening", "ipa": "/ˈiːvnɪŋ/", "zh": "傍晚；晚上"}, {"w": "fruit", "ipa": "/fruːt/", "zh": "水果"}, {"w": "grandpa", "ipa": "/ˈɡrænpɑː/", "zh": "爷爷；外公"}, {"w": "guest", "ipa": "/ɡest/", "zh": "客人"}, {"w": "host", "ipa": "/hoʊst/", "zh": "主人"}, {"w": "people", "ipa": "/ˈpiːpl/", "zh": "人们"}, {"w": "small talk", "ipa": "/smɔːl tɔːk/", "zh": "寒暄；闲聊"}, {"w": "tea", "ipa": "/tiː/", "zh": "茶叶；茶"}], "others": [{"w": "inside (adv.)", "ipa": "/ˌɪnˈsaɪd/", "zh": "在屋里"}]}, "notes": [{"en": "It's polite in China for guests to bring a small gift like fruit or tea.", "zh": "在中国，客人带水果、茶叶等小礼物去作客是很礼貌的。"}, {"en": "Small talk is talk about some unimportant topic like the weather or sports. You \"make small talk.\"", "zh": "small talk 是谈论天气、体育等不重要的话题。说“make small talk”。"}, {"en": "The evening is the time from about sundown until about midnight.", "zh": "evening（傍晚到晚上）指从日落到午夜前后的这段时间。"}], "dialogue": [{"speaker": "Tom", "role": "clerk", "en": "Hi, Grandpa.", "zh": "嗨，爷爷。"}, {"speaker": "Jenny", "role": "girl", "en": "Hi, Grandpa.", "zh": "嗨，爷爷。"}, {"speaker": "Grandpa", "role": "teacher", "en": "Hi Tom, Jenny. Glad you could come.", "zh": "嗨，汤姆，珍妮。很高兴你们能来。"}, {"speaker": "Tom", "role": "clerk", "en": "We brought you some tea and fruit.", "zh": "我们给你带了茶叶和水果。"}, {"speaker": "Grandpa", "role": "teacher", "en": "Thanks! You didn't have to bring anything.", "zh": "谢谢！你们不用带东西的。"}, {"speaker": "Aunt", "role": "mom", "en": "Hi, Tom! Long time no see!", "zh": "嗨，汤姆！好久不见！"}, {"speaker": "Tom", "role": "clerk", "en": "Thanks, Grandpa. Great dinner!", "zh": "谢谢，爷爷。晚餐真棒！"}, {"speaker": "Grandpa", "role": "teacher", "en": "Glad you could come. See you soon!", "zh": "很高兴你们来。回头见！"}], "china": [{"en": "In China, family dinners are often held at a grandparent's home or at a restaurant, and the host usually pays.", "zh": "在中国，家庭聚餐常在爷爷奶奶家或餐厅举行，通常由主人买单。"}, {"en": "Guests may bring fruit, tea, or a small gift instead of wine.", "zh": "客人常带水果、茶叶或小礼物，而不是酒。"}], "en": "Going to a Dinner Party", "zh": "去爷爷家聚餐", "grammarZh": "一般现在时"}, {"id": 60, "section": 6, "level": 1, "img": "assets/img/unit60.jpg", "grammar": "Simple Past", "grammarNote": {"en": "The simple past narrates a completed trip to the movies: found out, bought, got, went, watched, saw.", "zh": "一般过去时叙述一次已完成的观影经历：found out、bought、got、went、watched、saw。"}, "steps": [{"en": "Tom and Jenny found out when the cartoon movie was showing.", "zh": "汤姆和珍妮查到了动画电影的放映时间。"}, {"en": "Mom bought tickets on her phone.", "zh": "妈妈在手机上买了票。"}, {"en": "They got some popcorn at the snack counter.", "zh": "他们在小吃柜台买了爆米花。"}, {"en": "At the entrance, the worker scanned the tickets from Mom's phone.", "zh": "入口处，工作人员扫了妈妈手机上的票。"}, {"en": "They went to their seats.", "zh": "他们走到自己的座位上。"}, {"en": "They watched the previews of coming attractions.", "zh": "他们看了即将上映电影的预告片。"}, {"en": "Then they saw the main feature.", "zh": "然后他们看了正片。"}, {"en": "At the end, they watched the credits.", "zh": "结束时，他们看了片尾字幕。"}], "vocab": {"verbs": [{"w": "buy (bought)", "ipa": "/baɪ/", "zh": "买"}, {"w": "find (found) out", "ipa": "/faɪnd aʊt/", "zh": "弄清楚；查明"}, {"w": "get (got)", "ipa": "/ɡet/", "zh": "买到；得到"}, {"w": "go (went) to", "ipa": "/ɡoʊ tuː/", "zh": "去；前往"}, {"w": "scan", "ipa": "/skæn/", "zh": "扫码"}, {"w": "see (saw)", "ipa": "/siː/", "zh": "观看；看见"}, {"w": "show", "ipa": "/ʃoʊ/", "zh": "放映；上映"}, {"w": "watch", "ipa": "/wɑːtʃ/", "zh": "观看"}], "nouns": [{"w": "cartoon movie", "ipa": "/kɑːrˈtuːn ˈmuːvi/", "zh": "动画电影"}, {"w": "coming attractions", "ipa": "/ˈkʌmɪŋ əˈtrækʃənz/", "zh": "即将上映的影片预告片"}, {"w": "credits", "ipa": "/ˈkredɪts/", "zh": "片尾字幕；演职员表"}, {"w": "end", "ipa": "/end/", "zh": "结尾；结束"}, {"w": "entrance", "ipa": "/ˈentrəns/", "zh": "入口"}, {"w": "feature", "ipa": "/ˈfiːtʃər/", "zh": "正片；故事片"}, {"w": "movie", "ipa": "/ˈmuːvi/", "zh": "电影"}, {"w": "popcorn", "ipa": "/ˈpɑːpkɔːrn/", "zh": "爆米花"}, {"w": "preview", "ipa": "/ˈpriːvjuː/", "zh": "预告片"}, {"w": "seat", "ipa": "/siːt/", "zh": "座位"}, {"w": "snack counter", "ipa": "/snæk ˈkaʊntər/", "zh": "小吃柜台"}, {"w": "ticket", "ipa": "/ˈtɪkɪt/", "zh": "票"}], "others": [{"w": "main (adj.)", "ipa": "/meɪn/", "zh": "主要的；正片的"}]}, "notes": [{"en": "Coming attractions are movies that will soon be shown.", "zh": "coming attractions 是即将上映的电影。"}, {"en": "The movie is showing means \"the movie is being shown.\"", "zh": "“The movie is showing”意思是“电影正在放映”。"}, {"en": "The main feature is the movie you have come to see.", "zh": "main feature 就是你专门来看的那部正片。"}], "dialogue": [{"speaker": "Tom", "role": "clerk", "en": "Mom, can we watch the cartoon movie?", "zh": "妈妈，我们能看那部动画片吗？"}, {"speaker": "Mom", "role": "mom", "en": "Sure! I'll buy the tickets on my phone.", "zh": "当然！我在手机上买票。"}, {"speaker": "Jenny", "role": "girl", "en": "Can we get some popcorn?", "zh": "我们能买点爆米花吗？"}, {"speaker": "Mom", "role": "mom", "en": "Sure! Let's go.", "zh": "当然！走吧。"}], "china": [{"en": "In China, movie tickets are usually bought on phone apps like Maoyan, with reserved seats chosen from a seating chart.", "zh": "在中国，电影票通常在猫眼等手机 App 上购买，并通过座位图选座。"}, {"en": "Tickets are scanned at the entrance from the phone screen; paper tickets are rarely used.", "zh": "入场时手机扫码检票，纸质票很少使用。"}, {"en": "Chinese kids love cartoon movies, and families often watch them together on weekends.", "zh": "中国孩子很喜欢动画电影，周末全家常一起去看。"}], "en": "Going to a Movie", "zh": "看电影", "grammarZh": "一般过去时"}, {"id": 61, "section": 6, "level": 1, "en": "Eating at a Fast Food Restaurant", "zh": "在快餐店就餐", "grammar": "SIMPLE PAST", "grammarZh": "一般过去时", "img": "assets/img/unit61.jpg", "grammarNote": {"en": "This story uses the simple past: Jenny stood, read, ordered, paid, ate, threw... Irregular verbs in this unit: stand→stood, read→read, pay→paid, eat→ate, take→took, throw→threw, get→got.", "zh": "这个故事用一般过去时叙述：stood、read、ordered、paid、ate、threw……本单元的不规则动词：stand→stood、read→read、pay→paid、eat→ate、take→took、throw→threw、get→got。"}, "steps": [{"en": "Jenny stood in line and read the menu.", "zh": "珍妮排着队，看着菜单。"}, {"en": "She ordered her food and a drink at the counter.", "zh": "她在柜台点了吃的和一杯饮料。"}, {"en": "The clerk put the food on her tray, and Jenny paid her.", "zh": "店员把食物放到她的托盘上，珍妮付了钱。"}, {"en": "Jenny took some paper napkins and a straw from the dispensers.", "zh": "珍妮从纸巾盒和吸管盒里拿了纸巾和吸管。"}, {"en": "She ate her lunch at her table.", "zh": "她坐在自己的位子上吃午餐。"}, {"en": "Other people got their food to go.", "zh": "其他人把食物打包带走。"}, {"en": "When she finished eating, she threw the empty wrappers in the trash.", "zh": "吃完后，她把空包装扔进垃圾桶。"}], "dialogue": [{"speaker": "Jenny", "role": "girl", "en": "I'd like one Big Burger, a small order of fries, and a medium cola, please.", "zh": "我要一个巨无霸汉堡、一份小薯条和一杯中杯可乐。"}, {"speaker": "Clerk", "role": "teacher", "en": "For here or to go?", "zh": "在这儿吃还是带走？"}, {"speaker": "Jenny", "role": "girl", "en": "For here, please.", "zh": "在这儿吃。"}, {"speaker": "Clerk", "role": "teacher", "en": "That'll be twenty-eight yuan.", "zh": "一共二十八元。"}, {"speaker": "Jenny", "role": "girl", "en": "Right.", "zh": "好的。"}], "vocab": {"verbs": [{"w": "eat (ate)", "ipa": "/iːt/ (/eɪt/)", "zh": "吃"}, {"w": "finish", "ipa": "/ˈfɪnɪʃ/", "zh": "完成；吃完"}, {"w": "get (got)", "ipa": "/ɡet/ (/ɡɑːt/)", "zh": "得到；拿到"}, {"w": "order", "ipa": "/ˈɔːrdər/", "zh": "点餐；订购"}, {"w": "pay (paid)", "ipa": "/peɪ/ (/peɪd/)", "zh": "付款"}, {"w": "put on", "ipa": "/pʊt ɑːn/", "zh": "放上"}, {"w": "read (read)", "ipa": "/riːd/ (/red/)", "zh": "阅读"}, {"w": "stand in line (stood)", "ipa": "/stænd ɪn laɪn/", "zh": "排队"}, {"w": "take (took)", "ipa": "/teɪk/ (/tʊk/)", "zh": "拿；取"}, {"w": "throw (threw)", "ipa": "/θroʊ/ (/θruː/)", "zh": "扔"}], "nouns": [{"w": "clerk", "ipa": "/klɜːrk/", "zh": "店员"}, {"w": "counter", "ipa": "/ˈkaʊntər/", "zh": "柜台"}, {"w": "dispenser", "ipa": "/dɪˈspensər/", "zh": "（纸巾/吸管）取用架"}, {"w": "drink", "ipa": "/drɪŋk/", "zh": "饮料"}, {"w": "fast food", "ipa": "/fæst fuːd/", "zh": "快餐"}, {"w": "food", "ipa": "/fuːd/", "zh": "食物"}, {"w": "lunch", "ipa": "/lʌntʃ/", "zh": "午餐"}, {"w": "menu", "ipa": "/ˈmenjuː/", "zh": "菜单"}, {"w": "napkin", "ipa": "/ˈnæpkɪn/", "zh": "餐巾纸"}, {"w": "paper", "ipa": "/ˈpeɪpər/", "zh": "纸"}, {"w": "restaurant", "ipa": "/ˈrestərɑːnt/", "zh": "餐馆"}, {"w": "straw", "ipa": "/strɔː/", "zh": "吸管"}, {"w": "table", "ipa": "/ˈteɪbəl/", "zh": "餐桌"}, {"w": "trash", "ipa": "/træʃ/", "zh": "垃圾桶；垃圾"}, {"w": "tray", "ipa": "/treɪ/", "zh": "托盘"}, {"w": "wrapper", "ipa": "/ˈræpər/", "zh": "包装纸；包装盒"}], "others": [{"w": "empty", "ipa": "/ˈempti/", "zh": "空的"}, {"w": "other", "ipa": "/ˈʌðər/", "zh": "其他的"}]}, "notes": [{"en": "In a fast-food restaurant, the menu is usually on a big board on the wall.", "zh": "快餐店的菜单通常写在一块很大的墙面上。"}, {"en": "“For here” means you eat in the restaurant. “To go” means you eat outside. You can also say “to take away” or “to take out”.", "zh": "For here 表示在店里吃（堂食）；to go 表示带走吃，也可以说 to take away 或 to take out（打包）。"}, {"en": "Wrappers are the paper or boxes around the food to keep it fresh.", "zh": "wrapper（包装）是包在食物外面的纸或盒子，用来保鲜。"}], "china": [{"en": "In China, fast food restaurants like KFC and McDonald's are popular with children.", "zh": "在中国，肯德基、麦当劳这类快餐店很受孩子欢迎。可以说 fast food restaurant（快餐店）。"}, {"en": "The clerk may ask: 'For here or to go?' 在这里吃还是打包带走？", "zh": "店员会问：“在这里吃还是打包带走？”可以说 for here or to go（堂食还是外带）。"}]}, {"id": 62, "section": 7, "level": 1, "en": "Going to School", "zh": "上学路上", "grammar": "SIMPLE PRESENT", "grammarZh": "一般现在时", "img": "assets/img/unit62.jpg", "grammarNote": {"en": "We use the simple present to talk about what we do every day. Examples: Jenny puts on her schoolbag. She walks to the school gate. Her friend waves to her. Time words: every morning, every day, always, usually.", "zh": "一般现在时用来描述每天都会做的事。例句：Jenny puts on her schoolbag.（珍妮背上书包。）She walks to the school gate.（她走到学校门口。）常搭配时间词：every morning 每天早上、every day 每天、always 总是、usually 通常。"}, "steps": [{"en": "Jenny puts on her schoolbag.", "zh": "珍妮背上书包。"}, {"en": "She goes downstairs with her mom.", "zh": "她和妈妈一起下楼。"}, {"en": "They walk to the school gate.", "zh": "她们走到学校门口。"}, {"en": "Jenny says goodbye to her mom.", "zh": "珍妮和妈妈道别。"}, {"en": "She walks into the school.", "zh": "她走进学校。"}, {"en": "Her friend waves to her.", "zh": "她的朋友向她挥手。"}], "dialogue": [{"speaker": "Jenny", "role": "girl", "en": "Bye, Mom! Have a good day!", "zh": "再见，妈妈！祝你今天愉快！"}, {"speaker": "Mom", "role": "clerk", "en": "Bye, sweetie! Be good at school.", "zh": "再见，宝贝！在学校要乖哦。"}, {"speaker": "Friend", "role": "clerk", "en": "Hi, Jenny! Good morning!", "zh": "嗨，珍妮！早上好！"}, {"speaker": "Jenny", "role": "girl", "en": "Good morning! Let's go to class.", "zh": "早上好！我们一起去上课吧。"}], "vocab": {"verbs": [{"w": "go downstairs", "ipa": "/ɡoʊ ˌdaʊnˈsterz/", "zh": "下楼"}, {"w": "put on", "ipa": "/pʊt ɑːn/", "zh": "背上；穿上"}, {"w": "say goodbye", "ipa": "/seɪ ˌɡʊdˈbaɪ/", "zh": "道别；说再见"}, {"w": "walk", "ipa": "/wɔːk/", "zh": "走路；步行"}, {"w": "walk into", "ipa": "/wɔːk ˈɪntuː/", "zh": "走进"}, {"w": "wave", "ipa": "/weɪv/", "zh": "挥手"}], "nouns": [{"w": "class", "ipa": "/klæs/", "zh": "课；上课"}, {"w": "friend", "ipa": "/frend/", "zh": "朋友"}, {"w": "mom", "ipa": "/mɑːm/", "zh": "妈妈"}, {"w": "school", "ipa": "/skuːl/", "zh": "学校"}, {"w": "schoolbag", "ipa": "/ˈskuːlbæɡ/", "zh": "书包"}, {"w": "school gate", "ipa": "/skuːl ɡeɪt/", "zh": "校门口"}], "others": [{"w": "every day", "ipa": "/ˈevri deɪ/", "zh": "每天"}, {"w": "good morning", "ipa": "/ˌɡʊd ˈmɔːrnɪŋ/", "zh": "早上好"}]}, "notes": [{"en": "“Have a good day!” is a friendly way to say goodbye in the morning.", "zh": "Have a good day!（祝你今天愉快！）是早上告别时的友好说法。"}, {"en": "A parent calls a child “sweetie” to show love.", "zh": "爸爸妈妈会叫孩子 sweetie（宝贝）表示疼爱。"}, {"en": "“Let's” is short for “let us”. It means “we should do this together”.", "zh": "Let's 是 let us 的缩写，表示“我们一起做某事吧”。"}], "china": [{"en": "In Chinese cities, many parents walk or ride an e-bike with their child to the school gate, and parents usually stop outside the gate.", "zh": "在中国城市，很多家长走路或骑电动车送孩子到校门口，家长一般不进校。"}, {"en": "Chinese students say goodbye at the gate and walk into school by themselves, just like Jenny.", "zh": "中国学生在校门口和家长道别后自己走进学校，就像珍妮一样。"}, {"en": "“Have a good day!” is like saying “好好学习，再见！” at the school gate.", "zh": "Have a good day! 就像在校门口说“好好学习，再见！”"}]}, {"id": 63, "section": 7, "level": 1, "en": "At School — Class and Recess", "zh": "在学校——上课与课间", "grammar": "IMPERATIVE", "grammarZh": "祈使句", "img": "assets/img/unit63.jpg", "grammarNote": {"en": "We use the imperative to give instructions. The verb comes first, without “you”. Examples: Open your books. Raise your hand. Line up, please. We can add “please” to be polite: Open your books, please.", "zh": "祈使句用来发出指令，动词开头、不加主语 you。例句：Open your books.（打开课本。）Raise your hand.（举手。）Line up, please.（请排队。）加 please 更有礼貌。"}, "steps": [{"en": "The bell rings.", "zh": "上课铃响了。"}, {"en": "Jenny sits at her desk.", "zh": "珍妮坐到座位上。"}, {"en": "The teacher says, “Open your books.”", "zh": "老师说：“打开课本。”"}, {"en": "Jenny raises her hand.", "zh": "珍妮举起手。"}, {"en": "She writes in her notebook.", "zh": "她在笔记本上写字。"}, {"en": "The bell rings again.", "zh": "下课铃又响了。"}, {"en": "The children line up.", "zh": "孩子们排队。"}, {"en": "They play on the playground.", "zh": "他们在操场上玩。"}], "dialogue": [{"speaker": "Teacher", "role": "clerk", "en": "Good morning, class. Open your books, please.", "zh": "同学们早上好。请打开课本。"}, {"speaker": "Jenny", "role": "girl", "en": "May I ask a question?", "zh": "我可以问个问题吗？"}, {"speaker": "Teacher", "role": "clerk", "en": "Yes, of course.", "zh": "当然可以。"}, {"speaker": "Friend", "role": "clerk", "en": "The bell is ringing! Let's go out to play.", "zh": "铃响了！我们出去玩吧。"}, {"speaker": "Jenny", "role": "girl", "en": "OK! Let's go!", "zh": "好呀！走吧！"}], "vocab": {"verbs": [{"w": "line up", "ipa": "/laɪn ʌp/", "zh": "排队"}, {"w": "open", "ipa": "/ˈoʊpən/", "zh": "打开"}, {"w": "play", "ipa": "/pleɪ/", "zh": "玩"}, {"w": "raise", "ipa": "/reɪz/", "zh": "举起"}, {"w": "ring", "ipa": "/rɪŋ/", "zh": "（铃）响"}, {"w": "sit", "ipa": "/sɪt/", "zh": "坐"}, {"w": "write", "ipa": "/raɪt/", "zh": "写"}], "nouns": [{"w": "bell", "ipa": "/bel/", "zh": "铃；铃声"}, {"w": "class", "ipa": "/klæs/", "zh": "班级；上课"}, {"w": "desk", "ipa": "/desk/", "zh": "课桌"}, {"w": "notebook", "ipa": "/ˈnoʊtbʊk/", "zh": "笔记本"}, {"w": "playground", "ipa": "/ˈpleɪɡraʊnd/", "zh": "操场"}, {"w": "question", "ipa": "/ˈkwestʃən/", "zh": "问题"}, {"w": "teacher", "ipa": "/ˈtiːtʃər/", "zh": "老师"}], "others": [{"w": "again", "ipa": "/əˈɡen/", "zh": "又；再"}, {"w": "out", "ipa": "/aʊt/", "zh": "出去；在外面"}]}, "notes": [{"en": "“May I…?” is a polite way to ask for permission. It is more polite than “Can I…?”.", "zh": "May I…?（我可以……吗？）是比 Can I…? 更礼貌的请求许可的说法。"}, {"en": "“Line up” means to stand one behind another to make a line.", "zh": "line up（排队）指一个接一个站成一条队。"}, {"en": "Recess is the short break between classes, when children can play.", "zh": "recess（课间）是两节课之间的短休息时间，孩子们可以玩。"}], "china": [{"en": "In Chinese primary schools, students stand up and say hello to the teacher when the bell rings.", "zh": "中国小学上课铃响后，学生起立向老师问好。"}, {"en": "Chinese students raise their hand and say “May I ask a question?” before speaking in class.", "zh": "中国学生在课堂上先举手，说“May I ask a question?”（我可以问个问题吗？）再发言。"}, {"en": "During the ten-minute recess, children play in the hallway or on the playground.", "zh": "课间十分钟，孩子们在走廊或操场上玩。"}]}, {"id": 64, "section": 4, "level": 1, "en": "Helping Mom at the Supermarket", "zh": "帮妈妈逛超市", "grammar": "SIMPLE PRESENT", "grammarZh": "一般现在时", "img": "assets/img/unit64.jpg", "grammarNote": {"en": "We use the simple present to talk about things we do and happen every time. Examples: Jenny makes a shopping list. She gets a shopping cart. Mom picks out some apples. The verbs stay in the base form for “I, you, we, they”, and add -s for “he, she, it”: Mom picks out some apples.", "zh": "一般现在时描述经常做的事。例句：Jenny makes a shopping list.（珍妮列购物清单。）第三人称单数（he/she/it）动词要加 -s：Mom picks out some apples.（妈妈挑了一些苹果。）"}, "steps": [{"en": "Jenny makes a shopping list with her mom.", "zh": "珍妮和妈妈一起列购物清单。"}, {"en": "She gets a shopping cart.", "zh": "她推来一辆购物车。"}, {"en": "Mom picks out some apples.", "zh": "妈妈挑了一些苹果。"}, {"en": "Jenny puts the apples in the cart.", "zh": "珍妮把苹果放进购物车。"}, {"en": "They weigh the fruit.", "zh": "她们给水果称重。"}, {"en": "They pay at the counter.", "zh": "她们在收银台付款。"}, {"en": "Jenny helps carry the bags home.", "zh": "珍妮帮忙把袋子拎回家。"}], "dialogue": [{"speaker": "Jenny", "role": "girl", "en": "Mom, can I push the cart?", "zh": "妈妈，我可以推购物车吗？"}, {"speaker": "Mom", "role": "clerk", "en": "Yes, you can. Be careful!", "zh": "可以，小心一点！"}, {"speaker": "Jenny", "role": "girl", "en": "We need some apples.", "zh": "我们需要一些苹果。"}, {"speaker": "Mom", "role": "clerk", "en": "Let's get some fruit, too.", "zh": "我们再买点水果吧。"}, {"speaker": "Clerk", "role": "clerk", "en": "That'll be sixty-eight yuan.", "zh": "一共六十八元。"}], "vocab": {"verbs": [{"w": "carry", "ipa": "/ˈkæri/", "zh": "提；搬"}, {"w": "get", "ipa": "/ɡet/", "zh": "拿；取"}, {"w": "help", "ipa": "/help/", "zh": "帮助"}, {"w": "make a list", "ipa": "/meɪk ə lɪst/", "zh": "列清单"}, {"w": "pay", "ipa": "/peɪ/", "zh": "付款"}, {"w": "pick out", "ipa": "/pɪk aʊt/", "zh": "挑出；挑选"}, {"w": "push", "ipa": "/pʊʃ/", "zh": "推"}, {"w": "put in", "ipa": "/pʊt ɪn/", "zh": "放进"}, {"w": "weigh", "ipa": "/weɪ/", "zh": "称重"}], "nouns": [{"w": "apple", "ipa": "/ˈæpəl/", "zh": "苹果"}, {"w": "bag", "ipa": "/bæɡ/", "zh": "袋子"}, {"w": "counter", "ipa": "/ˈkaʊntər/", "zh": "收银台"}, {"w": "fruit", "ipa": "/fruːt/", "zh": "水果"}, {"w": "shopping cart", "ipa": "/ˈʃɑːpɪŋ kɑːrt/", "zh": "购物车"}, {"w": "shopping list", "ipa": "/ˈʃɑːpɪŋ lɪst/", "zh": "购物清单"}, {"w": "supermarket", "ipa": "/ˈsuːpərmɑːrkɪt/", "zh": "超市"}, {"w": "yuan", "ipa": "/juˈɑːn/", "zh": "元（人民币）"}], "others": [{"w": "some", "ipa": "/sʌm/", "zh": "一些"}, {"w": "careful", "ipa": "/ˈkerfəl/", "zh": "小心的"}]}, "notes": [{"en": "“Can I…?” is used to ask for permission: Can I push the cart? — Yes, you can.", "zh": "Can I…?（我可以……吗？）用来请求许可：Can I push the cart?——Yes, you can.（可以。）"}, {"en": "“Let's get some fruit” means “we should buy some fruit together”.", "zh": "Let's get some fruit（我们买点水果吧）表示“我们一起去买”。"}, {"en": "In many supermarkets, fruit and vegetables are weighed before paying.", "zh": "很多超市的水果蔬菜要先称重再付款。"}], "china": [{"en": "In Chinese supermarkets, fresh fruit is weighed at a scale station and a price tag is printed before you go to the counter.", "zh": "中国超市的生鲜水果要在称重台称重并贴价格标签，再去收银台付款。"}, {"en": "People in China usually pay by scanning a QR code with WeChat Pay or Alipay.", "zh": "中国人在超市通常用微信或支付宝扫码付款（scan the QR code）。"}, {"en": "Many supermarkets charge a little for plastic bags, so people bring their own shopping bags.", "zh": "很多中国超市塑料袋收费，所以大家会自己带购物袋（环保袋）。"}]}, {"id": 65, "section": 6, "level": 1, "en": "At the Playground", "zh": "在游乐场玩", "grammar": "SIMPLE PRESENT", "grammarZh": "一般现在时", "img": "assets/img/unit65.jpg", "grammarNote": {"en": "We use the simple present for things we do again and again. Examples: Jenny climbs up the ladder. She goes down the slide. They play on the seesaw. Remember: he / she / it verbs add -s: She goes down the slide.", "zh": "一般现在时描述反复做的事。例句：Jenny climbs up the ladder.（珍妮爬上梯子。）She goes down the slide.（她滑下滑梯。）第三人称单数动词加 -s：She goes down the slide. 注意 go 变成 goes。"}, "steps": [{"en": "Jenny goes to the playground with her friend.", "zh": "珍妮和朋友一起去游乐场。"}, {"en": "She climbs up the ladder.", "zh": "她爬上梯子。"}, {"en": "She goes down the slide.", "zh": "她滑下滑梯。"}, {"en": "They play on the seesaw.", "zh": "她们玩跷跷板。"}, {"en": "Jenny swings on the swing.", "zh": "珍妮荡秋千。"}, {"en": "Her friend pushes her.", "zh": "朋友推着她荡秋千。"}, {"en": "They go home before dark.", "zh": "天黑前她们回家。"}], "dialogue": [{"speaker": "Friend", "role": "clerk", "en": "Let's play on the slide!", "zh": "我们去玩滑梯吧！"}, {"speaker": "Jenny", "role": "girl", "en": "OK! My turn!", "zh": "好呀！该我了！"}, {"speaker": "Friend", "role": "clerk", "en": "OK, your turn now!", "zh": "好，现在轮到你啦！"}, {"speaker": "Jenny", "role": "girl", "en": "Can I play on the swing, too?", "zh": "我也可以荡秋千吗？"}, {"speaker": "Friend", "role": "clerk", "en": "Sure! Let's go!", "zh": "当然！走吧！"}], "vocab": {"verbs": [{"w": "climb", "ipa": "/klaɪm/", "zh": "爬"}, {"w": "go down", "ipa": "/ɡoʊ daʊn/", "zh": "滑下；下来"}, {"w": "play", "ipa": "/pleɪ/", "zh": "玩"}, {"w": "push", "ipa": "/pʊʃ/", "zh": "推"}, {"w": "swing", "ipa": "/swɪŋ/", "zh": "荡（秋千）"}], "nouns": [{"w": "friend", "ipa": "/frend/", "zh": "朋友"}, {"w": "ladder", "ipa": "/ˈlædər/", "zh": "梯子"}, {"w": "playground", "ipa": "/ˈpleɪɡraʊnd/", "zh": "游乐场"}, {"w": "seesaw", "ipa": "/ˈsiːsɔː/", "zh": "跷跷板"}, {"w": "slide", "ipa": "/slaɪd/", "zh": "滑梯"}, {"w": "swing", "ipa": "/swɪŋ/", "zh": "秋千"}, {"w": "turn", "ipa": "/tɜːrn/", "zh": "轮到的机会"}], "others": [{"w": "before dark", "ipa": "/bɪˈfɔːr dɑːrk/", "zh": "天黑前"}, {"w": "too", "ipa": "/tuː/", "zh": "也"}]}, "notes": [{"en": "“My turn!” means it is my chance to play. “Your turn!” means it is your chance.", "zh": "My turn!（该我了！）表示轮到我玩；Your turn!（该你了！）表示轮到你。"}, {"en": "A seesaw goes up and down when two children sit on the two ends.", "zh": "seesaw（跷跷板）是两人分坐两端、一起一落的玩具。"}, {"en": "“Before dark” means before the sky gets dark at night.", "zh": "before dark（天黑前）指夜晚天空变暗之前。"}], "china": [{"en": "In China, children often play at the playground in a park or near their apartment building after school.", "zh": "在中国，孩子放学后常在公园或小区里的儿童游乐区玩。"}, {"en": "Children wait in line and take turns on the slide and the swing.", "zh": "中国孩子玩滑梯、秋千要排队轮流（take turns），先来后到。"}, {"en": "Parents usually call their children home before dark.", "zh": "天黑前家长一般会叫孩子回家。"}]}, {"id": 66, "section": 4, "level": 1, "en": "Tidying Up Toys", "zh": "玩完玩具收起来", "grammar": "IMPERATIVE", "grammarZh": "祈使句", "img": "assets/img/unit66.jpg", "grammarNote": {"en": "We use the imperative to tell someone what to do. The verb comes first: Put your toys away. Pick up the blocks. Put the blocks in the box. To be polite, we can say “please”: Put your toys away, please.", "zh": "祈使句用来告诉别人做什么，动词开头：Put your toys away.（把玩具收好。）Pick up the blocks.（捡起积木。）加 please 更礼貌：Put your toys away, please."}, "steps": [{"en": "Mom says, “Put your toys away.”", "zh": "妈妈说：“把玩具收好。”"}, {"en": "Jenny picks up the blocks.", "zh": "珍妮捡起积木。"}, {"en": "She puts the blocks in the box.", "zh": "她把积木放进盒子里。"}, {"en": "She puts the teddy bear on the shelf.", "zh": "她把泰迪熊放到架子上。"}, {"en": "She puts the picture books on the desk.", "zh": "她把绘本放到桌上。"}, {"en": "The room is clean now.", "zh": "房间现在干净了。"}, {"en": "Mom says, “Good job!”", "zh": "妈妈说：“真棒！”"}], "dialogue": [{"speaker": "Mom", "role": "clerk", "en": "Put your toys away, please.", "zh": "请把玩具收好。"}, {"speaker": "Jenny", "role": "girl", "en": "OK, Mom.", "zh": "好的，妈妈。"}, {"speaker": "Jenny", "role": "girl", "en": "Where do the blocks go?", "zh": "积木放在哪里呀？"}, {"speaker": "Mom", "role": "clerk", "en": "They go in the box.", "zh": "放进那个盒子里。"}, {"speaker": "Jenny", "role": "girl", "en": "All done!", "zh": "全部收好啦！"}, {"speaker": "Mom", "role": "clerk", "en": "Good job!", "zh": "真棒！"}], "vocab": {"verbs": [{"w": "pick up", "ipa": "/pɪk ʌp/", "zh": "捡起"}, {"w": "put away", "ipa": "/pʊt əˈweɪ/", "zh": "收好；放回原处"}, {"w": "put in", "ipa": "/pʊt ɪn/", "zh": "放进"}, {"w": "tidy up", "ipa": "/ˈtaɪdi ʌp/", "zh": "整理；收拾"}], "nouns": [{"w": "blocks", "ipa": "/blɑːks/", "zh": "积木"}, {"w": "box", "ipa": "/bɑːks/", "zh": "盒子"}, {"w": "desk", "ipa": "/desk/", "zh": "书桌"}, {"w": "picture book", "ipa": "/ˈpɪktʃər bʊk/", "zh": "绘本；图画书"}, {"w": "room", "ipa": "/ruːm/", "zh": "房间"}, {"w": "shelf", "ipa": "/ʃelf/", "zh": "架子"}, {"w": "teddy bear", "ipa": "/ˈtedi ber/", "zh": "泰迪熊"}, {"w": "toy", "ipa": "/tɔɪ/", "zh": "玩具"}], "others": [{"w": "clean", "ipa": "/kliːn/", "zh": "干净的"}, {"w": "good job", "ipa": "/ˌɡʊd ˈdʒɑːb/", "zh": "做得好；真棒"}]}, "notes": [{"en": "“Put away” means to put things back in their proper place.", "zh": "put away（收好）指把东西放回该放的地方。"}, {"en": "“Good job!” is what we say to praise a child for doing something well.", "zh": "Good job!（真棒！）是孩子做得好时用来表扬的话。"}, {"en": "“All done!” means everything is finished.", "zh": "All done!（都做好了！）表示全部完成。"}], "china": [{"en": "Chinese parents often ask children to tidy up their toys before dinner or before bed.", "zh": "中国家长常让孩子在吃饭前或睡觉前把玩具收好。"}, {"en": "Many Chinese families keep toys in storage boxes or on a toy shelf in the children's room.", "zh": "很多中国家庭把玩具收在收纳箱或儿童房的玩具架上。"}, {"en": "Tidying up toys is usually the first chore a Chinese child learns at home.", "zh": "收玩具通常是中国孩子在家学会的第一件家务。"}]}, {"id": 67, "section": 3, "level": 1, "en": "A Bedtime Story and Goodnight", "zh": "睡前故事·道晚安", "grammar": "SIMPLE PRESENT", "grammarZh": "一般现在时", "img": "assets/img/unit67.jpg", "grammarNote": {"en": "We use the simple present to describe a bedtime routine. Examples: Jenny puts on her pajamas. She sits on the bed. Mom reads her a story. Notice the double object: reads her a story (her = Jenny, a story = the thing read).", "zh": "一般现在时描述睡前的固定流程。例句：Jenny puts on her pajamas.（珍妮穿上睡衣。）Mom reads her a story.（妈妈给她读故事。）注意双宾语结构 reads her a story：her 指珍妮，a story 是读的内容。"}, "steps": [{"en": "Jenny puts on her pajamas.", "zh": "珍妮穿上睡衣。"}, {"en": "She sits on the bed.", "zh": "她坐在床上。"}, {"en": "Mom reads her a story.", "zh": "妈妈给她读故事。"}, {"en": "Jenny hugs her teddy bear.", "zh": "珍妮抱着泰迪熊。"}, {"en": "Mom turns off the light.", "zh": "妈妈关灯。"}, {"en": "Jenny says, “Goodnight, Mom.”", "zh": "珍妮说：“晚安，妈妈。”"}, {"en": "Mom says, “Sweet dreams.”", "zh": "妈妈说：“做个好梦。”"}], "dialogue": [{"speaker": "Jenny", "role": "girl", "en": "Mom, read me a story, please.", "zh": "妈妈，请给我读个故事吧。"}, {"speaker": "Mom", "role": "clerk", "en": "OK. Which story do you want?", "zh": "好啊，你想听哪个故事？"}, {"speaker": "Jenny", "role": "girl", "en": "The bear story!", "zh": "小熊的故事！"}, {"speaker": "Mom", "role": "clerk", "en": "Goodnight, sweetie.", "zh": "晚安，宝贝。"}, {"speaker": "Jenny", "role": "girl", "en": "Goodnight, Mom. Sweet dreams!", "zh": "晚安，妈妈。做个好梦！"}], "vocab": {"verbs": [{"w": "hug", "ipa": "/hʌɡ/", "zh": "拥抱；抱"}, {"w": "put on", "ipa": "/pʊt ɑːn/", "zh": "穿上"}, {"w": "read", "ipa": "/riːd/", "zh": "读；朗读"}, {"w": "sit", "ipa": "/sɪt/", "zh": "坐"}, {"w": "say", "ipa": "/seɪ/", "zh": "说"}, {"w": "turn off", "ipa": "/tɜːrn ɔːf/", "zh": "关掉（灯）"}], "nouns": [{"w": "bed", "ipa": "/bed/", "zh": "床"}, {"w": "light", "ipa": "/laɪt/", "zh": "灯"}, {"w": "mom", "ipa": "/mɑːm/", "zh": "妈妈"}, {"w": "pajamas", "ipa": "/pəˈdʒɑːməz/", "zh": "睡衣"}, {"w": "story", "ipa": "/ˈstɔːri/", "zh": "故事"}, {"w": "teddy bear", "ipa": "/ˈtedi ber/", "zh": "泰迪熊"}], "others": [{"w": "goodnight", "ipa": "/ˌɡʊdˈnaɪt/", "zh": "晚安"}, {"w": "sweet dreams", "ipa": "/ˌswiːt ˈdriːmz/", "zh": "做个好梦"}]}, "notes": [{"en": "“Read me a story” = “read a story to me”. The person comes first: read me a story.", "zh": "Read me a story 等于 read a story to me（给我读个故事），人放在前面。"}, {"en": "“Sweet dreams” is what parents say to children at night. It means “sleep well and dream nice dreams”.", "zh": "Sweet dreams（做个好梦）是家长晚上对孩子说的祝福语。"}, {"en": "“Goodnight” is said when someone is going to bed at night.", "zh": "Goodnight（晚安）是晚上睡觉前说的话。"}], "china": [{"en": "Reading picture books before bed is a common parenting activity in Chinese families.", "zh": "睡前读绘本是中国家庭常见的亲子活动。"}, {"en": "Chinese children often hug a soft toy or a favorite blanket when they sleep.", "zh": "中国孩子睡觉时常抱着玩偶或喜欢的毯子。"}, {"en": "Saying “晚安，妈妈” and “做个好梦” is j
