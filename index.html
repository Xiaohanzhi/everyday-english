<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>情景英语 Everyday English · 日常场景学习站</title>
<meta name="description" content="改编自《English for Everyday Activities》的日常英语学习站：61 个生活场景，中英对照、点读发音、词汇音标、自测与打印。" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%233D7FFF'/%3E%3Ctext x='32' y='42' font-size='34' text-anchor='middle' fill='%23fff' font-family='Arial'%3EE%3C/text%3E%3C/svg%3E" />
<link rel="preconnect" href="https://miaoda.feishu.cn" />
<link href="https://miaoda.feishu.cn/fonts/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet" />
<style>
:root{
  --bg:#F4F8FB; --card:#FFFFFF; --ink:#243B53; --ink2:#627D98; --line:#E4EDF5;
  --primary:#3D7FFF; --accent:#FFB800; --coral:#FF7A59; --green:#22B573;
  --s1:#3D7FFF; --s2:#12B5CB; --s3:#22B573; --s4:#F59E0B; --s5:#7C6FF0; --s6:#F063A8;
  --r:18px; --shadow:0 2px 10px rgba(36,59,75,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;line-height:1.6;font-size:16px}
h1,h2,h3,.en-title{font-family:"Baloo 2","PingFang SC","Microsoft YaHei",sans-serif}
img{max-width:100%;display:block}
a{color:var(--primary);text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.wrap{max-width:1020px;margin:0 auto;padding:0 18px}

/* ===== 顶栏 ===== */
.topbar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;gap:14px;height:60px}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;color:var(--ink);font-size:19px}
.brand .logo{width:34px;height:34px;border-radius:10px;background:var(--primary);color:#fff;display:grid;place-items:center;font-family:"Baloo 2",sans-serif;font-weight:800;font-size:19px;flex:none}
.brand small{font-size:11px;color:var(--ink2);font-weight:600;letter-spacing:.5px}
.topbar .spacer{flex:1}
.langbtn{border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:13px;font-weight:700;color:var(--ink2);background:#fff;transition:.15s}
.langbtn:hover{border-color:var(--primary);color:var(--primary)}
.navbtn{color:var(--ink2);font-size:14px;font-weight:700;padding:6px 10px;border-radius:10px}
.navbtn:hover{background:#EFF4FB;color:var(--primary)}

/* ===== 首页 hero ===== */
.hero{background:linear-gradient(160deg,#EAF2FF 0%,#F6FBFF 55%,#FFF6E6 100%);border-bottom:1px solid var(--line);padding:44px 0 34px}
.hero h1{font-size:34px;line-height:1.25;color:#1E3E8C}
.hero h1 em{font-style:normal;color:var(--primary)}
.hero .sub{margin-top:8px;color:var(--ink2);font-size:15px;max-width:640px}
.stats{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 16px;display:flex;flex-direction:column;min-width:96px}
.stat b{font-size:20px;color:#1E3E8C;font-family:"Baloo 2",sans-serif}
.stat span{font-size:12px;color:var(--ink2)}
.progress-wrap{margin-top:16px;max-width:640px}
.progress-track{height:12px;border-radius:999px;background:#DCE7F5;overflow:hidden}
.progress-fill{height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,var(--primary),var(--accent));transition:.4s}
.progress-text{font-size:12px;color:var(--ink2);margin-top:6px;display:block}

/* ===== 筛选 ===== */
.controls{padding:20px 0 6px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.searchbox{flex:1;min-width:220px;display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:9px 16px}
.searchbox input{border:none;outline:none;flex:1;font-size:14px;background:transparent;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-size:13px;font-weight:700;color:var(--ink2);transition:.15s}
.chip.on{color:#fff;border-color:transparent}
.chip.s1.on{background:var(--s1)}.chip.s2.on{background:var(--s2)}.chip.s3.on{background:var(--s3)}.chip.s4.on{background:var(--s4)}.chip.s5.on{background:var(--s5)}.chip.s6.on{background:var(--s6)}

/* ===== 单元网格 ===== */
.section-block{margin:26px 0 10px}
.section-head{display:flex;align-items:baseline;gap:12px;margin-bottom:14px}
.section-dot{width:12px;height:12px;border-radius:4px;flex:none}
.section-head h2{font-size:21px;color:var(--ink)}
.section-head .zh{color:var(--ink2);font-size:13px}
.section-head .count{color:var(--ink2);font-size:13px;margin-left:auto}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);cursor:pointer;position:relative;transition:.18s;display:flex;flex-direction:column;gap:6px}
.card:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(36,59,75,.1)}
.card .badge{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800;color:#fff;border-radius:999px;padding:3px 10px;width:fit-content}
.card .t-en{font-size:16px;font-weight:700;color:var(--ink);line-height:1.3}
.card .t-zh{font-size:13px;color:var(--ink2)}
.card .meta{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--ink2);margin-top:2px}
.card .meta .g{background:#EFF4FB;border-radius:6px;padding:2px 7px;font-weight:700;color:#3D6CB5}
.card .fav{position:absolute;top:12px;right:12px;font-size:15px;color:#CBD8E6;transition:.15s}
.card .fav.on{color:var(--accent)}
.card.done .t-en:after{content:" ✓";color:var(--green);font-size:13px}
.empty{grid-column:1/-1;text-align:center;color:var(--ink2);padding:40px 0}

/* ===== 单元页 ===== */
.crumb{padding:16px 0 0;font-size:13px;color:var(--ink2)}
.crumb a{color:var(--ink2)}
.crumb a:hover{color:var(--primary)}
.unit-hero{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:var(--shadow)}
.unit-hero .imgwrap{position:relative}
.unit-hero .imgwrap img{width:100%;height:auto;aspect-ratio:16/8;object-fit:cover}
.unit-hero .imgwrap .tag{position:absolute;left:14px;bottom:12px;background:rgba(255,255,255,.95);border-radius:999px;padding:5px 13px;font-size:12px;font-weight:800;color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.unit-hero .body{padding:20px 22px 22px}
.unit-hero .row1{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap}
.unit-hero h1{font-size:26px;color:var(--ink);line-height:1.25}
.unit-hero .zhline{color:var(--ink2);font-size:15px;margin-top:2px}
.unit-hero .gchip{margin-left:auto;border-radius:999px;padding:6px 14px;font-size:13px;font-weight:800;color:#fff}
.unit-hero .actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
/* ===== 分镜漫画 ===== */
.comic-card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:14px;box-shadow:var(--shadow);text-align:center}
.comic-card .comic-img{width:100%;max-width:480px;margin:0 auto;display:block;border-radius:14px;cursor:zoom-in;box-shadow:0 4px 14px rgba(0,0,0,.12)}
.comic-card .hint{color:var(--ink2);font-size:12.5px;margin-top:10px}
.lightbox{position:fixed;inset:0;background:rgba(20,20,30,.88);z-index:99;display:flex;align-items:center;justify-content:center;padding:24px;cursor:zoom-out}
.lightbox img{max-width:94vw;max-height:92vh;border-radius:10px;box-shadow:0 8px 40px rgba(0,0,0,.5)}
.lightbox .lb-close{position:absolute;top:14px;right:18px;color:#fff;font-size:30px;line-height:1;cursor:pointer;background:rgba(255,255,255,.15);width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.abtn{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:9px 16px;font-size:13px;font-weight:800;border:1px solid var(--line);background:#fff;color:var(--ink2);transition:.15s}
.abtn:hover{border-color:var(--primary);color:var(--primary)}
.abtn.primary{background:var(--primary);color:#fff;border-color:var(--primary)}
.abtn.primary:hover{background:#2E6FE8}
.abtn.green{background:var(--green);color:#fff;border-color:var(--green)}
.abtn.green:hover{background:#1BA366}
.abtn.yellow{background:var(--accent);color:#7A5200;border-color:var(--accent)}
.abtn.on{background:#FFF4D6;border-color:var(--accent);color:#8A5A00}

/* ===== 内容区块 ===== */
.block{margin-top:22px}
.block > h3{display:flex;align-items:center;gap:9px;font-size:18px;color:var(--ink);margin-bottom:12px}
.block > h3 .dot{width:10px;height:10px;border-radius:3px;flex:none}
.grammar-card{background:#EFF6FF;border:1px solid #CFE3FF;border-radius:var(--r);padding:16px 18px;font-size:14px}
.grammar-card .g-en{font-weight:600;color:#1E3E8C}
.grammar-card .g-zh{color:var(--ink2);margin-top:6px}
.steps{display:flex;flex-direction:column;gap:10px}
.step{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;align-items:center;gap:14px;box-shadow:var(--shadow)}
.step .idx{width:38px;height:38px;border-radius:12px;color:#fff;display:grid;place-items:center;font-family:"Baloo 2",sans-serif;font-weight:800;font-size:17px;flex:none}
.step .txt{flex:1;min-width:0}
.step .en{font-size:16.5px;font-weight:700;color:var(--ink);line-height:1.45}
.step .en .kw{color:var(--primary);border-bottom:2px solid #FFE3A8;background:linear-gradient(transparent 72%,#FFEDC2 72%)}
.step .zh{font-size:14px;color:var(--ink2);margin-top:3px}
.pbtn{width:42px;height:42px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;transition:.15s;box-shadow:0 3px 10px rgba(0,0,0,.12)}
.pbtn:hover{transform:scale(1.08)}
.pbtn.playing{animation:pulse 1s infinite}
@keyframes pulse{0%,100%{box-shadow:0 3px 10px rgba(0,0,0,.15)}50%{box-shadow:0 3px 18px rgba(61,127,255,.55)}}
.dialogue{display:flex;flex-direction:column;gap:10px}
.bubble{max-width:82%;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 16px;box-shadow:var(--shadow);position:relative}
.bubble .who{font-size:11px;font-weight:800;color:var(--ink2);margin-bottom:3px}
.bubble .en{font-size:15.5px;font-weight:700}
.bubble .zh{font-size:13px;color:var(--ink2);margin-top:2px}
.bubble.girl{align-self:flex-start;border-color:#FFD6E8;background:#FFF7FB}
.bubble.girl .who{color:#D63384}
.bubble.clerk{align-self:flex-end;border-color:#C9E4FF;background:#F4FAFF}
.bubble.clerk .who{color:#2F6FD0}
.bubble .pbtn{position:absolute;top:50%;right:-52px;transform:translateY(-50%);width:38px;height:38px}
.vocab-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow)}
.vocab-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.vocab-head .gname{font-size:14px;font-weight:800;color:var(--ink2)}
.vocab-head .ipa-toggle{margin-left:auto;font-size:12px;font-weight:800;color:var(--primary);border:1px solid #CFE3FF;border-radius:999px;padding:4px 12px;background:#F4FAFF}
.vlist{display:flex;flex-direction:column}
.vrow{display:flex;align-items:center;gap:10px;padding:7px 2px;border-bottom:1px dashed var(--line)}
.vrow:last-child{border-bottom:none}
.vrow .w{font-size:15px;font-weight:700;color:var(--ink);min-width:120px}
.vrow .ipa{font-size:12px;color:var(--ink2);font-family:"Baloo 2","Segoe UI",sans-serif;display:none}
.vrow .ipa.show{display:inline}
.vrow .zh{font-size:14px;color:var(--ink2);flex:1}
.vrow .pbtn{width:32px;height:32px;flex:none;font-size:12px;margin-left:auto}
.notes{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 20px;box-shadow:var(--shadow)}
.notes li{list-style:none;padding:9px 0;border-bottom:1px dashed var(--line)}
.notes li:last-child{border-bottom:none}
.notes .n-en{font-weight:600;color:#31445E}
.notes .n-zh{color:var(--ink2);font-size:14px;margin-top:2px}
.china-card{background:#FFFBF0;border:1.5px dashed #F2C14E;border-radius:var(--r);padding:16px 20px}
.china-card .c-head{display:flex;align-items:center;gap:8px;font-weight:800;color:#A05E00;margin-bottom:8px}
.china-card li{list-style:none;padding:7px 0;border-bottom:1px dashed #F5E3BC}
.china-card li:last-child{border-bottom:none}
.china-card .c-en{font-weight:600;color:#6B4A00}
.china-card .c-zh{color:#8A6A2B;font-size:13.5px;margin-top:2px}

/* ===== 练习 ===== */
.practice{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.practice .ptools{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.drill{border-top:1px dashed var(--line);padding-top:14px}
.drill .q{font-size:16px;font-weight:700;color:var(--ink);margin-bottom:8px}
.drill input{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:11px 14px;font-size:15px;outline:none;background:#FBFDFF}
.drill input:focus{border-color:var(--primary)}
.drill .res{margin-top:10px;font-size:14px;font-weight:700}
.drill .res.ok{color:var(--green)}
.drill .res.no{color:var(--coral)}
.drill .controls{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.micnote{font-size:12px;color:var(--ink2);margin-top:8px}

/* ===== 复习视图 ===== */
.review-card{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);max-width:680px;margin:30px auto;padding:26px;text-align:center}
.review-card .en{font-size:22px;font-weight:700;color:var(--ink);margin:14px 0 6px}
.review-card .zh{font-size:15px;color:var(--ink2);min-height:24px;transition:.2s}
.review-card .zh.hide{visibility:hidden}
.review-card .big-play{width:64px;height:64px;border-radius:50%;color:#fff;margin:6px auto 0;display:grid;place-items:center;box-shadow:0 6px 16px rgba(61,127,255,.35)}
.review-actions{display:flex;justify-content:center;gap:10px;margin-top:20px;flex-wrap:wrap}

/* ===== 打印全册（A4 横版 · 左文右图 · 每单元一页） ===== */
#printall{display:none}
.print-preview #printall{display:block}
.printall-unit{display:grid;grid-template-columns:62% 38%;gap:16px;background:#fff;border:1px solid #d9dce3;border-radius:12px;padding:14px 18px;margin:0 0 16px;break-inside:avoid;page-break-after:always;box-shadow:0 1px 6px rgba(0,0,0,.06)}
.printall-unit:last-child{page-break-after:auto}
.ps-left{min-width:0;color:#222}
.ps-head{border-bottom:1.5px solid #e4e7ee;padding-bottom:6px;margin-bottom:6px}
.printall-unit h1{font-size:16px;margin:0;line-height:1.2}
.printall-unit h1 small{font-size:12px;color:var(--ink2);font-weight:600;margin-left:6px}
.ps-meta{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:9.5px;color:#5b6b80;margin-top:3px;flex-wrap:wrap}
.ps-meta .g{font-weight:800;color:#31445E;background:#eef2f8;border-radius:999px;padding:1px 8px;white-space:nowrap}
.ps-left{font-size:10.5px;line-height:1.32}
.ps-left .ps-block{margin-top:7px}
.ps-block h4{font-size:10px;color:#31445E;margin:0 0 2px;letter-spacing:.5px}
.ps-left .en{font-weight:700;color:#1c2733}
.ps-left .zh{color:#66717f;margin-left:4px}
.ps-steps{margin:0;padding:0;list-style:none}
.ps-steps li{display:flex;gap:6px;align-items:baseline;margin:1px 0;line-height:1.28}
.ps-steps i{font-style:normal;font-weight:800;color:#b45309;min-width:13px;font-size:9.5px;text-align:right}
.ps-vocab{display:grid;grid-template-columns:repeat(2,1fr);gap:2px 20px;margin-top:2px}
.ps-vocab .group{min-width:0}
.ps-vocab .group b{display:block;color:#31445E;font-size:9px;margin:1px 0 0.5px;letter-spacing:.5px}
.ps-vocab .row{display:flex;justify-content:space-between;align-items:baseline;gap:6px;font-size:9px;margin:0.5px 0;line-height:1.2}
.ps-vocab .row .w{font-weight:700;color:#1c2733;white-space:nowrap}
.ps-vocab .row .zh{color:#66717f;font-size:8.5px;text-align:right}
.ps-notes .nrow{font-size:9.5px;color:#333;margin:1.5px 0;line-height:1.35}
.ps-right{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0}
.ps-right img{max-width:100%;max-height:66vh;width:auto;height:auto;object-fit:contain;border-radius:8px}
.ps-cap{font-size:9px;color:#7c8797;margin-top:4px;text-align:center}
@media screen and (max-width:900px){
  .printall-unit{grid-template-columns:1fr}
  .ps-right img{max-height:420px;margin:10px auto 0}
  .ps-vocab{grid-template-columns:1fr}
}

/* ===== 页脚 ===== */
footer{border-top:1px solid var(--line);margin-top:46px;padding:22px 0 34px;color:var(--ink2);font-size:12.5px;text-align:center}

/* ===== 响应式 ===== */
@media (max-width:860px){.grid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:560px){
  .grid{grid-template-columns:1fr}
  .hero h1{font-size:27px}
  .unit-hero h1{font-size:22px}
  .unit-hero .gchip{margin-left:0}
  .bubble{max-width:88%}
  .bubble .pbtn{right:-50px}
  .topbar .navbtn{display:none}
  .step .en{font-size:15.5px}
  .searchbox input,.drill input{font-size:16px}
  .abtn{min-height:44px}
  .ipa-toggle{min-height:40px;min-width:40px}
  .vrow .pbtn{width:38px;height:38px}
  .unit-hero .imgwrap .tag{font-size:13px}
}

/* ===== 语言模式 ===== */
body[data-lang="en"] .zh{display:none}
body[data-lang="zh"] .en,body[data-lang="zh"] .t-en,body[data-lang="zh"] .g-en,body[data-lang="zh"] .n-en,body[data-lang="zh"] .c-en,body[data-lang="zh"] .w{display:none}

/* ===== 打印 ===== */
@media print{
  @page{size:A4 landscape;margin:12mm}
  body{background:#fff;font-size:12px}
  .topbar,.controls,.abtn,.ptools,.pbtn,.practice,.micnote,.crumbs,.crumb,.fav,.hero,.no-print,.hero{display:none !important}
  body.print-all #view{display:none !important}
  body.print-all #printall{display:block !important}
  .wrap{max-width:none;padding:0}
  .block{margin-top:14px;break-inside:avoid}
  .unit-hero{border:none;box-shadow:none;border-radius:0}
  .unit-hero .imgwrap img{max-height:220px;object-fit:cover}
  .card,.step,.bubble,.vocab-card,.notes,.china-card,.grammar-card{border:1px solid #ccc;box-shadow:none;break-inside:avoid}
  .vrow .ipa{display:inline}
  .step{display:block;position:relative;padding-left:64px}
  .step .idx{position:absolute;left:14px;top:14px}
  h1,h2,h3{break-after:avoid}
  /* 打印学习册：A4 横版、左文右图、每单元一页、始终中英双语 */
  .printall-unit{grid-template-columns:62% 38%;box-shadow:none;border-radius:0;margin:0;break-inside:avoid;gap:14px;padding:10px 14px}
  .printall-unit .ps-right img{max-height:168mm}
  .printall-unit h1{font-size:13.5pt}
  .printall-unit .ps-meta{font-size:9pt;margin-top:2px}
  .printall-unit .ps-left{font-size:9.5pt;line-height:1.25}
  .printall-unit .ps-left .en{font-weight:700}
  .printall-unit .ps-left .ps-block{margin-top:6px}
  .printall-unit .ps-block h4{font-size:9.5pt;margin-bottom:1pt}
  .printall-unit .ps-steps li{margin:0.4pt 0;line-height:1.15}

妈妈也常常喊孩子起床：“该起床啦！”可以说 Time to get up!"}]}, {"id": 2, "section": 1, "level": 1, "img": "assets/img/unit2.jpg", "grammar": "SIMPLE PRESENT", "grammarZh": "一般现在时", "grammarNote": {"en": "The simple present tense describes habits, routines, and facts that are generally true. In this unit, Jenny follows her daily teeth-brushing routine. We often use time words like every day, usually, sometimes, and in the morning. Example: 'Jenny brushes her teeth every morning.'", "zh": "一般现在时用来描述习惯性动作、日常规律和客观事实。本单元中珍妮每天重复同样的刷牙流程。常用时间词有 every day（每天）、usually（通常）、sometimes（有时）、in the morning（早上）。例句：Jenny brushes her teeth every morning.（珍妮每天早上刷牙。）"}, "steps": [{"en": "Jenny runs some water over her toothbrush.", "zh": "珍妮用水冲了冲牙刷。"}, {"en": "She squeezes toothpaste onto her toothbrush.", "zh": "她把牙膏挤到牙刷上。"}, {"en": "She moves her toothbrush up and down and back and forth.", "zh": "她上下、来回地移动牙刷。"}, {"en": "To rinse her mouth, she takes some water and swishes it back and forth in her mouth.", "zh": "为了漱口，她喝了一点水，在嘴里来回漱了漱。"}, {"en": "Then she spits it into the sink.", "zh": "然后她把水吐进水槽。"}, {"en": "She rinses off her toothbrush.", "zh": "她把牙刷冲洗干净。"}, {"en": "Then she puts it back in the toothbrush rack.", "zh": "然后她把牙刷放回牙刷架。"}, {"en": "She flosses her teeth by pulling out a long piece of floss.", "zh": "她拉出一长段牙线来清洁牙齿。"}, {"en": "She slips it between her teeth.", "zh": "她把牙线滑进牙缝。"}, {"en": "She moves it back and forth and up and down.", "zh": "她来回、上下地移动牙线。"}, {"en": "Then she smiles at herself in the mirror. Her teeth are clean!", "zh": "然后她对着镜子里的自己笑了笑。她的牙齿真干净！"}], "vocab": {"verbs": [{"w": "brush", "ipa": "/brʌʃ/", "zh": "刷"}, {"w": "floss", "ipa": "/flɔːs/", "zh": "用牙线清洁"}, {"w": "move", "ipa": "/muːv/", "zh": "移动"}, {"w": "pull out", "ipa": "/pʊl aʊt/", "zh": "抽出"}, {"w": "put back", "ipa": "/pʊt bæk/", "zh": "放回"}, {"w": "rinse", "ipa": "/rɪns/", "zh": "冲洗，漱"}, {"w": "rinse off", "ipa": "/rɪns ɔːf/", "zh": "冲干净"}, {"w": "run water over", "ipa": "/rʌn ˈwɔːtər ˈoʊvər/", "zh": "用水冲"}, {"w": "slip", "ipa": "/slɪp/", "zh": "悄悄放进，滑入"}, {"w": "spit", "ipa": "/spɪt/ (/spɛt/)", "zh": "吐（唾沫等）"}, {"w": "squeeze", "ipa": "/skwiːz/", "zh": "挤"}, {"w": "swish", "ipa": "/swɪʃ/", "zh": "（在嘴里）来回漱"}], "nouns": [{"w": "faucet", "ipa": "/ˈfɔːsɪt/", "zh": "水龙头"}, {"w": "floss", "ipa": "/flɔːs/", "zh": "牙线"}, {"w": "mouth", "ipa": "/maʊθ/", "zh": "嘴，口腔"}, {"w": "a piece of", "ipa": "/ə piːs ʌv/", "zh": "一片/段/根"}, {"w": "rack", "ipa": "/ræk/", "zh": "架子"}, {"w": "sink", "ipa": "/sɪŋk/", "zh": "水槽，水池"}, {"w": "tooth [teeth]", "ipa": "/tuːθ/ [tiːθ]", "zh": "牙齿（复数 teeth）"}, {"w": "toothbrush", "ipa": "/ˈtuːθbrʌʃ/", "zh": "牙刷"}, {"w": "toothpaste", "ipa": "/ˈtuːθpeɪst/", "zh": "牙膏"}, {"w": "tube", "ipa": "/tuːb/", "zh": "管子，软管"}, {"w": "water", "ipa": "/ˈwɔːtər/", "zh": "水"}], "others": [{"w": "back and forth", "ipa": "/bæk ænd fɔːrθ/", "zh": "来回地（副词）"}, {"w": "long", "ipa": "/lɔːŋ/", "zh": "长的（形容词）"}, {"w": "up and down", "ipa": "/ʌp ænd daʊn/", "zh": "上下地（副词）"}]}, "notes": [{"en": "You run water over something by using water from a faucet or pipe and letting the water flow away after hitting the thing.", "zh": "run water over something 指打开水龙头或水管，让水冲过物体表面后流走。"}, {"en": "Something goes back and forth by going from one side to another (left and right) many times.", "zh": "back and forth 指从一边到另一边来回多次（左右方向）。"}, {"en": "Something goes up and down by going in these directions (up and down) many times.", "zh": "up and down 指在上下方向来回多次。"}, {"en": "You slip something somewhere by moving it gently into a small space.", "zh": "slip something somewhere 指轻轻地把某物塞进狭小的空间。"}], "dialogue": [], "china": [{"en": "In China, children brush their teeth twice a day, in the morning and before bed.", "zh": "在中国，孩子每天早晚各刷一次牙。可以说 brush teeth twice a day（每天刷两次牙）。"}, {"en": "Parents often check: 'Did you brush your teeth?'", "zh": "爸爸妈妈常会检查：“你刷牙了吗？”可以说 Did you brush your teeth?"}], "en": "Brushing Your Teeth / Flossing", "zh": "刷牙/用牙线"}, {"id": 3, "section": 1, "level": 1, "img": "assets/img/unit3.jpg", "grammar": "SIMPLE PRESENT", "grammarZh": "一般现在时", "grammarNote": {"en": "The simple present tense describes habits and routines. In this unit, Dan goes through his daily shower routine. Time markers like every morning, usually, and after that often appear. Example: 'Dan takes a shower every morning.'", "zh": "一般现在时用于描述习惯和日常流程。本单元中丹每天重复同样的淋浴步骤。常见时间标志词有 every morning（每天早上）、usually（通常）、after that（之后）。例句：Dan takes a shower every morning.（丹每天早上淋浴。）"}, "steps": [{"en": "Tom pulls the shower curtain shut.", "zh": "汤姆把淋浴帘拉上了。"}, {"en": "By turning the knob, he turns the water on.", "zh": "他转动旋钮，打开了水。"}, {"en": "He washes his hair with shampoo and the rest of his body with soap.", "zh": "他用洗发水洗头发，用香皂洗身上。"}, {"en": "Then he rinses off with water.", "zh": "然后他用清水冲干净。"}, {"en": "After turning the water off, he steps out of the shower.", "zh": "关掉水之后，他走出淋浴间。"}, {"en": "He takes a towel from the towel rack.", "zh": "他从毛巾架上拿了一条毛巾。"}, {"en": "Then he dries himself off.", "zh": "然后他把自己擦干。"}, {"en": "He wraps a towel around himself and dries his hair.", "zh": "他用毛巾裹住身体，把头发擦干。"}, {"en": "Then he puts on his pajamas.", "zh": "然后他穿上睡衣。"}], "vocab": {"verbs": [{"w": "dry", "ipa": "/draɪ/", "zh": "弄干"}, {"w": "dry off", "ipa": "/draɪ ɔːf/", "zh": "擦干（表面的水）"}, {"w": "pull", "ipa": "/pʊl/", "zh": "拉"}, {"w": "put", "ipa": "/pʊt/ (/pʊt/)", "zh": "放"}, {"w": "rinse off", "ipa": "/rɪns ɔːf/", "zh": "冲干净"}, {"w": "step", "ipa": "/step/", "zh": "迈步"}, {"w": "take (a shower)", "ipa": "/teɪk/ (/teɪkən/)", "zh": "洗（淋浴）"}, {"w": "turn", "ipa": "/tɜːrn/", "zh": "转动"}, {"w": "turn off", "ipa": "/tɜːrn ɔːf/", "zh": "关掉"}, {"w": "turn on", "ipa": "/tɜːrn ɑːn/", "zh": "打开"}, {"w": "wash", "ipa": "/wɑːʃ/", "zh": "洗"}, {"w": "wrap", "ipa": "/ræp/", "zh": "裹，围"}], "nouns": [{"w": "arm", "ipa": "/ɑːrm/", "zh": "手臂"}, {"w": "bar", "ipa": "/bɑːr/", "zh": "条，块"}, {"w": "bathmat", "ipa": "/ˈbæθmæt/", "zh": "浴室防滑垫"}, {"w": "blow-dryer", "ipa": "/ˈbloʊdraɪər/", "zh": "吹风机"}, {"w": "body", "ipa": "/ˈbɑːdi/", "zh": "身体"}, {"w": "curtain", "ipa": "/ˈkɜːrtn/", "zh": "帘子"}, {"w": "deodorant", "ipa": "/diˈoʊdərənt/", "zh": "除臭剂，止汗剂"}, {"w": "hair", "ipa": "/her/", "zh": "头发"}, {"w": "knob", "ipa": "/nɑːb/", "zh": "旋钮"}, {"w": "rack", "ipa": "/ræk/", "zh": "架子"}, {"w": "(the) rest (of)", "ipa": "/ðə rest ʌv/", "zh": "其余的（部分）"}, {"w": "shampoo", "ipa": "/ʃæmˈpuː/", "zh": "洗发水"}, {"w": "shower", "ipa": "/ˈʃaʊər/", "zh": "淋浴"}, {"w": "shower head", "ipa": "/ˈʃaʊər hed/", "zh": "淋浴喷头"}, {"w": "soap", "ipa": "/soʊp/", "zh": "香皂"}, {"w": "towel", "ipa": "/ˈtaʊəl/", "zh": "毛巾"}, {"w": "water", "ipa": "/ˈwɔːtər/", "zh": "水"}], "others": [{"w": "shut", "ipa": "/ʃʌt/", "zh": "关闭的（形容词）"}]}, "notes": [{"en": "Use 'dry off' only if the water stays on top of the thing that is wet. You don't 'dry off' your hair or a towel. You 'dry' them or 'dry them out.'", "zh": "dry off 只用于物体表面有水的情况。不要说 dry off your hair 或 dry off a towel，而要说 dry them 或 dry them out。"}, {"en": "Pull something shut = pull it until it is shut.", "zh": "pull something shut 指把某物拉到关上为止。"}, {"en": "Take some students out of your classroom. The others (those still in the room) are the rest of the class.", "zh": "把一部分学生带出教室，剩下的（仍在教室里的）就是 the rest of the class（班上其余的人）。"}, {"en": "After you turn something on, it runs or works. After you turn it off, it stops.", "zh": "turn on 之后某物开始运转；turn off 之后它就停止。"}, {"en": "A deodorant is something that takes away bad smells.", "zh": "deodorant（除臭剂）是用来去除异味的东西。"}], "dialogue": [], "china": [{"en": "In China, children usually take a shower in the evening before bed.", "zh": "在中国，孩子一般晚上睡觉前洗澡。可以说 take a shower before bed（睡前洗个淋浴）。"}, {"en": "Tom puts on his pajamas after the shower, just like you!", "zh": "汤姆洗完澡后穿上睡衣，和你一样！可以说 put on pajamas（穿睡衣）。"}], "en": "Taking a Shower", "zh": "洗淋浴"}, {"id": 4, "section": 1, "level": 1, "img": "assets/img/unit4.jpg", "grammar": "SIMPLE PRESENT", "grammarZh": "一般现在时", "grammarNote": {"en": "The simple present is used for repeated daily actions. In this unit, Tom puts on his clothes step by step every morning. Notice word order: 'Tom puts on his underwear' = 'Tom puts his underwear on.' With it/them, 'on' moves away from 'put.' Example: 'Tom picks up his shirt and puts it on.'", "zh": "一般现在时用于每天重复的动作。本单元中汤姆每天早上一步步穿衣服。注意语序：put on 可分开说 put on his underwear = put his underwear on；当代词 it/them 作宾语时，on 要放到代词后面，如 puts it on（穿上它）。例句：Tom picks up his shirt and puts it on.（汤姆拿起衬衫穿上。）"}, "steps": [{"en": "Tom puts on some underwear, a T-shirt, some socks, some pants, and a shirt.", "zh": "汤姆穿上内裤、T恤、袜子、裤子和衬衫。"}, {"en": "Tom steps into his pants and then pulls them up.", "zh": "汤姆把腿伸进裤子里，然后把裤子提上来。"}, {"en": "He fastens the waistband and zips up the fly.", "zh": "他扣上腰带，拉上拉链。"}, {"en": "He slips a belt through the belt loops and buckles it.", "zh": "他把皮带穿过皮带袢，然后扣好。"}, {"en": "Tom slips an arm into each sleeve.", "zh": "汤姆把两只胳膊分别伸进袖子里。"}, {"en": "He buttons the shirt and the cuffs.", "zh": "他扣上衬衫的扣子和袖口的扣子。"}, {"en": "He straightens his collar.", "zh": "他把领子整平。"}, {"en": "He tucks his shirt into his pants.", "zh": "他把衬衫下摆塞进裤子里。"}], "vocab": {"verbs": [{"w": "buckle", "ipa": "/ˈbʌkl/", "zh": "扣上（皮带）"}, {"w": "button", "ipa": "/ˈbʌtn/", "zh": "扣纽扣"}, {"w": "choose", "ipa": "/tʃuːz/ (/tʃoʊz/)", "zh": "选择"}, {"w": "clasp", "ipa": "/klæsp/", "zh": "扣住，钩住"}, {"w": "fasten", "ipa": "/ˈfæsn/", "zh": "扣紧，系牢"}, {"w": "get dressed", "ipa": "/ɡet drest/", "zh": "穿衣服"}, {"w": "lace up", "ipa": "/leɪs ʌp/", "zh": "系（鞋带）"}, {"w": "pick up", "ipa": "/pɪk ʌp/", "zh": "拿起"}, {"w": "pull", "ipa": "/pʊl/", "zh": "拉"}, {"w": "pull up", "ipa": "/pʊl ʌp/", "zh": "提上"}, {"w": "put on", "ipa": "/pʊt ɑːn/", "zh": "穿上"}, {"w": "slip", "ipa": "/slɪp/", "zh": "悄悄穿/塞"}, {"w": "snap", "ipa": "/snæp/", "zh": "按扣"}, {"w": "step", "ipa": "/step/", "zh": "踏（进）"}, {"w": "straighten", "ipa": "/ˈstreɪtn/", "zh": "弄平整"}, {"w": "tie", "ipa": "/taɪ/", "zh": "系（带）"}, {"w": "tuck", "ipa": "/tʌk/", "zh": "把……塞进"}, {"w": "zip up", "ipa": "/zɪp ʌp/", "zh": "拉上拉链"}], "nouns": [{"w": "arm", "ipa": "/ɑːrm/", "zh": "手臂"}, {"w": "belt", "ipa": "/belt/", "zh": "皮带"}, {"w": "belt loop", "ipa": "/belt luːp/", "zh": "皮带袢"}, {"w": "buckle", "ipa": "/ˈbʌkl/", "zh": "皮带扣"}, {"w": "button", "ipa": "/ˈbʌtn/", "zh": "纽扣"}, {"w": "button hole", "ipa": "/ˈbʌtn hoʊl/", "zh": "扣眼"}, {"w": "clasp", "ipa": "/klæsp/", "zh": "扣钩"}, {"w": "clothes", "ipa": "/kloʊðz/", "zh": "衣服"}, {"w": "collar", "ipa": "/ˈkɑːlər/", "zh": "领子"}, {"w": "cuff", "ipa": "/kʌf/", "zh": "袖口"}, {"w": "fastener", "ipa": "/ˈfæsnər/", "zh": "扣件"}, {"w": "fly", "ipa": "/flaɪ/", "zh": "（裤子）前门襟拉链"}, {"w": "glasses", "ipa": "/ˈɡlæsɪz/", "zh": "眼镜"}, {"w": "jacket", "ipa": "/ˈdʒækɪt/", "zh": "外套，夹克"}, {"w": "lace", "ipa": "/leɪs/", "zh": "鞋带"}, {"w": "(a) pair (of)", "ipa": "/ə per ʌv/", "zh": "一双/条/副"}, {"w": "pajamas", "ipa": "/pəˈdʒæməz/", "zh": "睡衣"}, {"w": "pant leg", "ipa": "/pænt leɡ/", "zh": "裤腿"}, {"w": "pants", "ipa": "/pænts/", "zh": "裤子"}, {"w": "shirt", "ipa": "/ʃɜːrt/", "zh": "衬衫"}, {"w": "shoe", "ipa": "/ʃuː/", "zh": "鞋"}, {"w": "shorts", "ipa": "/ʃɔːrts/", "zh": "短裤"}, {"w": "sleeve", "ipa": "/sliːv/", "zh": "袖子"}, {"w": "snaps", "ipa": "/snæps/", "zh": "按扣"}, {"w": "sock", "ipa": "/sɑːk/", "zh": "袜子"}, {"w": "T-shirt", "ipa": "/ˈtiːʃɜːrt/", "zh": "T恤"}, {"w": "underpants", "ipa": "/ˈʌndərpænts/", "zh": "内裤"}, {"w": "underwear", "ipa": "/ˈʌndərwer/", "zh": "内衣（总称）"}, {"w": "waistband", "ipa": "/ˈweɪstbænd/", "zh": "腰带，裤腰"}, {"w": "zipper", "ipa": "/ˈzɪpər/", "zh": "拉链"}], "others": [{"w": "together", "ipa": "/təˈɡeðər/", "zh": "一起（副词）"}]}, "notes": [{"en": "Usually 'a pair of something' means 2. 'A pair of cats' means '2 cats.'", "zh": "通常 a pair of 表示“两个”。a pair of cats 就是“两只猫”。"}, {"en": "But some items of clothing are called a pair even though they seem like 1 thing: 'a pair of pants.'", "zh": "但有些衣物虽然看起来是一件，却用 a pair 来表示，例如 a pair of pants（一条裤子）。"}, {"en": "You can say 'a sock' or 'a shoe,' but when talking about clothes, do NOT say 'a pant,' 'a pajama,' 'an underpant,' 'a short,' or 'a glass.'", "zh": "你可以说 a sock、a shoe，但谈论衣物时不能说 a pant、a pajama、an underpant、a short 或 a glass。"}, {"en": "'Tom puts on his underwear' = 'Tom puts his underwear on.' These mean the same. With it or them, 'on' moves away from 'put.'", "zh": "Tom puts on his underwear 与 Tom puts his underwear on 意思相同。当代词 it/them 作宾语时，on 要放到代词后面，如 puts it on。"}], "dialogue": [], "china": [{"en": "Chinese men usually wear casual or business-casual clothes for work; formal Western suits are less common than in the US.", "zh": "中国男性上班多穿休闲或商务休闲装，正式西装比美国少见。"}, {"en": "Traditional Chinese clothing like the Tang jacket uses frog buttons (pankou) instead of zippers and buckles.", "zh": "中式服装如唐装使用盘扣，而不是拉链和皮带扣。"}, {"en": "Most Chinese men wear socks with leather shoes; sandals without socks are less common in formal settings.", "zh": "中国男性穿皮鞋时通常会穿袜子，凉鞋不穿袜子在正式场合较少见。"}], "en": "Getting Dressed – A Man", "zh": "穿衣—男士"}, {"id": 5, "section": 1, "level": 1, "img": "assets/img/unit5.jpg", "grammar": "SIMPLE PRESENT", "grammarZh": "一般现在时", "grammarNote": {"en": "The simple present is used here to describe what Pam wears depending on the weather. Note weather expressions: 'It's hot/cold.' 'It's raining/snowing.' Example: 'If it's hot, Pam wears light clothes.'", "zh": "本单元用一般现在时描述帕姆根据天气穿衣的习惯。注意天气表达：It's hot/cold.（天热/冷。）It's raining/snowing.（下雨/下雪。）例句：If it's hot, Pam wears light clothes.（天热时，帕姆穿轻薄衣服。）"}, "steps": [{"en": "Jenny puts on a dress, or a blouse and a skirt.", "zh": "珍妮穿上一条连衣裙，或者一件衬衫加一条裙子。"}, {"en": "She puts on some socks, or some nylons (stockings), or some pantyhose.", "zh": "她穿上袜子，或者尼龙长筒袜、连裤袜。"}, {"en": "If it's hot, Jenny wears light clothes: a short-sleeved cotton shirt and a skirt or shorts.", "zh": "如果天气热，珍妮穿清凉的衣服：短袖棉T恤配裙子或短裤。"}, {"en": "She goes barefoot indoors and wears sandals outdoors.", "zh": "她在室内光着脚，出门就穿凉鞋。"}, {"en": "Dressing this way keeps her cool.", "zh": "这样穿让她很凉快。"}, {"en": "If it's cold, Jenny wears heavy clothes: a long-sleeved shirt, a wool sweater, and pants.", "zh": "如果天气冷，珍妮穿厚实的衣服：长袖衬衫、羊毛衫和长裤。"}, {"en": "She wears thick wool socks and pantyhose to keep her legs warm.", "zh": "她穿上厚羊毛袜和连裤袜，让腿暖暖的。"}, {"en": "Before going outdoors, she puts on a heavy coat and some gloves or mittens.", "zh": "出门前，她穿上厚外套，戴上手套或连指手套。"}, {"en": "She wraps a scarf around her neck, puts on a hat, and wears some boots.", "zh": "她围上围巾、戴上帽子，穿上靴子。"}, {"en": "Dressing this way keeps her warm.", "zh": "这样穿让她很暖和。"}], "vocab": {"verbs": [{"w": "come from", "ipa": "/kʌm frʌm/", "zh": "来自"}, {"w": "dress", "ipa": "/dres/", "zh": "穿衣服；连衣裙"}, {"w": "get dressed", "ipa": "/ɡet drest/", "zh": "穿好衣服"}, {"w": "go barefoot", "ipa": "/ɡoʊ ˈberfʊt/", "zh": "光脚走"}, {"w": "keep", "ipa": "/kiːp/ (/kept/)", "zh": "保持"}, {"w": "put on", "ipa": "/pʊt ɑːn/", "zh": "穿上"}, {"w": "wear", "ipa": "/wer/ (/wɔːr/)", "zh": "穿着，戴着"}, {"w": "wrap", "ipa": "/ræp/", "zh": "围，裹"}], "nouns": [{"w": "blouse", "ipa": "/blaʊs/", "zh": "女式衬衫"}, {"w": "boot", "ipa": "/buːt/", "zh": "靴子"}, {"w": "bra", "ipa": "/brɑː/", "zh": "文胸"}, {"w": "building", "ipa": "/ˈbɪldɪŋ/", "zh": "建筑物"}, {"w": "cap", "ipa": "/kæp/", "zh": "鸭舌帽"}, {"w": "clothes", "ipa": "/kloʊðz/", "zh": "衣服"}, {"w": "coat", "ipa": "/koʊt/", "zh": "外套"}, {"w": "cotton", "ipa": "/ˈkɑːtn/", "zh": "棉"}, {"w": "dress", "ipa": "/dres/", "zh": "连衣裙"}, {"w": "dress shoe", "ipa": "/dres ʃuː/", "zh": "正装皮鞋"}, {"w": "fabric", "ipa": "/ˈfæbrɪk/", "zh": "织物，面料"}, {"w": "glove", "ipa": "/ɡlʌv/", "zh": "（分指）手套"}, {"w": "hat", "ipa": "/hæt/", "zh": "帽子"}, {"w": "jacket", "ipa": "/ˈdʒækɪt/", "zh": "夹克"}, {"w": "jeans", "ipa": "/dʒiːnz/", "zh": "牛仔裤"}, {"w": "mitten", "ipa": "/ˈmɪtn/", "zh": "连指手套"}, {"w": "neck", "ipa": "/nek/", "zh": "脖子"}, {"w": "nylons", "ipa": "/ˈnaɪlɑːnz/", "zh": "尼龙长袜"}, {"w": "(a) pair (of)", "ipa": "/ə per ʌv/", "zh": "一双/条"}, {"w": "pants", "ipa": "/pænts/", "zh": "裤子"}, {"w": "panties", "ipa": "/ˈpæntiz/", "zh": "女式内裤"}, {"w": "pantyhose", "ipa": "/ˈpæntihoʊz/", "zh": "连裤袜"}, {"w": "people", "ipa": "/ˈpiːpl/", "zh": "人们"}, {"w": "plant", "ipa": "/plænt/", "zh": "植物"}, {"w": "running shoe", "ipa": "/ˈrʌnɪŋ ʃuː/", "zh": "跑鞋"}, {"w": "sandal", "ipa": "/ˈsændl/", "zh": "凉鞋"}, {"w": "scarf", "ipa": "/skɑːrf/", "zh": "围巾"}, {"w": "sheep", "ipa": "/ʃiːp/", "zh": "绵羊"}, {"w": "shirt", "ipa": "/ʃɜːrt/", "zh": "衬衫"}, {"w": "shorts", "ipa": "/ʃɔːrts/", "zh": "短裤"}, {"w": "skirt", "ipa": "/skɜːrt/", "zh": "短裙"}, {"w": "sleeve", "ipa": "/sliːv/", "zh": "袖子"}, {"w": "sock", "ipa": "/sɑːk/", "zh": "袜子"}, {"w": "stockings", "ipa": "/ˈstɑːkɪŋz/", "zh": "长筒袜"}, {"w": "suit", "ipa": "/suːt/", "zh": "套装，西装"}, {"w": "sweater", "ipa": "/ˈswetər/", "zh": "毛衣"}, {"w": "sweatshirt", "ipa": "/ˈswetʃɜːrt/", "zh": "运动衫"}, {"w": "T-shirt", "ipa": "/ˈtiːʃɜːrt/", "zh": "T恤"}, {"w": "tie", "ipa": "/taɪ/", "zh": "领带"}, {"w": "weather", "ipa": "/ˈweðər/", "zh": "天气"}, {"w": "wool", "ipa": "/wʊl/", "zh": "羊毛"}], "others": [{"w": "casual", "ipa": "/ˈkæʒuəl/", "zh": "休闲的（形容词）"}, {"w": "cold", "ipa": "/koʊld/", "zh": "冷的（形容词）"}, {"w": "cool", "ipa": "/kuːl/", "zh": "凉爽的（形容词）"}, {"w": "heavy", "ipa": "/ˈhevi/", "zh": "厚的，重的（形容词）"}, {"w": "hot", "ipa": "/hɑːt/", "zh": "热的（形容词）"}, {"w": "indoors", "ipa": "/ˌɪnˈdɔːrz/", "zh": "在室内（副词）"}, {"w": "light", "ipa": "/laɪt/", "zh": "轻的，薄的（形容词）"}, {"w": "long", "ipa": "/lɔːŋ/", "zh": "长的（形容词）"}, {"w": "long-sleeved", "ipa": "/ˌlɔːŋˈsliːvd/", "zh": "长袖的（形容词）"}, {"w": "outdoors", "ipa": "/ˌaʊtˈdɔːrz/", "zh": "在户外（副词）"}, {"w": "short-sleeved", "ipa": "/ˌʃɔːrtˈsliːvd/", "zh": "短袖的（形容词）"}, {"w": "thick", "ipa": "/θɪk/", "zh": "厚的（形容词）"}, {"w": "thin", "ipa": "/θɪn/", "zh": "薄的（形容词）"}, {"w": "warm", "ipa": "/wɔːrm/", "zh": "温暖的（形容词）"}]}, "notes": [{"en": "Someone who goes barefoot walks around with no shoes or socks on his/her feet. His/Her feet are bare.", "zh": "go barefoot 指脚上不穿鞋也不穿袜子，光脚走路。"}, {"en": "If something keeps her cool, it helps her stay cool.", "zh": "keep her cool 指帮助她保持凉爽。"}, {"en": "Some ways to talk about the weather: 1. Use it + BE + an adjective: It's hot. It's hot outside. 2. Use it + BE + the -ing form of a weather verb: It's raining. It's snowing.", "zh": "谈论天气的几种方式：1. 用 it + BE + 形容词：It's hot. / It's hot outside. 2. 用 it + BE + 天气动词的 -ing 形式：It's raining. / It's snowing."}, {"en": "After you put on your clothes, you wear them.", "zh": "put on 是“穿上”的动作，wear 是“穿着”的状态。"}, {"en": "COTTON: a fabric that comes from the cotton plant.", "zh": "COTTON（棉）：一种来自棉花植物的面料。"}, {"en": "WOOL: a fabric that comes from a sheep.", "zh": "WOOL（羊毛）：一种来自绵羊的面料。"}, {"en": "If something is outside a building, it is outdoors. If something is inside a building, it is indoors.", "zh": "outdoors 指在建筑物外面；indoors 指在建筑物里面。"}], "dialogue": [], "china": [{"en": "In China, girls often wear dresses or skirts, and in winter pantyhose are very common.", "zh": "在中国，女孩常穿连衣裙或裙子，冬天穿连裤袜很常见。可以说 pantyhose（连裤袜）。"}, {"en": "School uniforms are also common for Chinese children.", "zh": "中国孩子上学也常穿校服。可以说 school uniform（校服）。"}], "en": "Getting Dressed – A Woman", "zh": "穿衣—女士"}, {"id": 6, "section": 1, "level": 1, "img": "assets/img/unit6.jpg", "grammar": "SIMPLE PRESENT", "grammarZh": "一般现在时", "grammarNote": {"en": "The simple present describes a routine task done every morning. Notice the sequence words: first, then, next. Example: 'I put a bottom sheet on the mattress. Then I tuck the top sheet under the mattress.'", "zh": "一般现在时描述每天早上重复的铺床流程。注意顺序词 first（首先）、then（然后）、next（接着）。例句：I put a bottom sheet on the mattress. Then I tuck the top sheet under the mattress.（我把床单铺在床垫上，然后把上端的床单塞到床垫下面。）"}, "steps": [{"en": "In the morning, I make my bed.", "zh": "早上，我自己叠被子。"}, {"en": "First, I smooth out the blanket.", "zh": "首先，我把毯子抹平。"}, {"en": "Then I fold it in half.", "zh": "然后把它对折。"}, {"en": "I fold it in half again.", "zh": "我再对折一次。"}, {"en": "I put the folded blanket at the foot of the bed.", "zh": "我把叠好的被子放到床尾。"}, {"en": "I fluff up my pillow and lay it at the head of the bed.", "zh": "我拍松枕头，放在床头。"}, {"en": "I spread the bedcover over the bed and smooth it out.", "zh": "我把床罩铺到床上，抹平。"}], "vocab": {"verbs": [{"w": "fluff up", "ipa": "/flʌf ʌp/", "zh": "拍松"}, {"w": "fold", "ipa": "/foʊld/", "zh": "折叠"}, {"w": "lay", "ipa": "/leɪ/", "zh": "放置"}, {"w": "make a bed", "ipa": "/meɪk ə bed/", "zh": "叠被子；铺床"}, {"w": "put", "ipa": "/pʊt/", "zh": "放"}, {"w": "smooth out", "ipa": "/smuːð aʊt/", "zh": "抹平"}, {"w": "spread", "ipa": "/spred/", "zh": "铺开"}], "nouns": [{"w": "bed", "ipa": "/bed/", "zh": "床"}, {"w": "bedcover", "ipa": "/ˈbedkʌvər/", "zh": "床罩"}, {"w": "blanket", "ipa": "/ˈblæŋkɪt/", "zh": "毯子；被子"}, {"w": "foot", "ipa": "/fʊt/", "zh": "（床的）尾端"}, {"w": "head", "ipa": "/hed/", "zh": "（床的）头端"}, {"w": "pillow", "ipa": "/ˈpɪloʊ/", "zh": "枕头"}], "others": [{"w": "first (adv.)", "ipa": "/fɜːrst/", "zh": "首先"}, {"w": "then (adv.)", "ipa": "/ðen/", "zh": "然后"}]}, "notes": [{"en": "Making your bed is a good morning habit.", "zh": "自己叠被子是个好的晨间习惯。"}, {"en": "Fold the blanket in half, then in half again, to make a neat square.", "zh": "把被子对折、再对折，叠成整齐的方块。"}], "dialogue": [], "china": [{"en": "Chinese children often fold the blanket into a neat square in the morning instead of using many sheets.", "zh": "中国孩子早晨常把被子叠成整齐的方块，而不是铺多层床单。"}, {"en": "Most Chinese beds use a duvet with a cover, so folding is quick and easy.", "zh": "中国床品多用被套包被芯，折叠起来又快又方便。"}], "en": "Making a Bed", "zh": "叠被子"}, {"id": 7, "section": 1, "level": 1, "img": "assets/img/unit7.jpg", "grammar": "SIMPLE PRESENT", "grammarZh": "一般现在时", "grammarNote": {"en": "The simple present is used to describe a repeated routine (making coffee or tea every morning). Watch the cause-and-effect chain: water heats up → drips through coffee → becomes coffee. Example: 'Pam scoops ground coffee into the filter.'", "zh": "一般现在时描述每天早上冲咖啡/泡茶的重复流程。注意因果链：水加热→滴过咖啡粉→变成咖啡。例句：Pam scoops ground coffee into the filter.（帕姆把磨好的咖啡舀进滤篮。）"}, "steps": [{"en": "Dad drinks coffee in the morning.", "zh": "爸爸早上喝咖啡。"}, {"en": "Jenny wants to make some tea for Grandpa.", "zh": "珍妮想给爷爷泡杯茶。"}, {"en": "She puts some tea leaves in a glass.", "zh": "她在玻璃杯里放了一些茶叶。"}, {"en": "She pours hot water into the glass.", "zh": "她把热水倒进玻璃杯。"}, {"en": "The tea leaves soak in the water, and the water becomes tea.", "zh": "茶叶在水里泡开，水就变成了茶。"}, {"en": "Jenny brings the glass of tea to Grandpa.", "zh": "珍妮把泡好的茶端给爷爷。"}, {"en": "Grandpa takes the glass and sips the tea.", "zh": "爷爷接过杯子，小口地喝着茶。"}, {"en": "He says, \"Thank you, Jenny. It's delicious!\"", "zh": "他说：“谢谢你，珍妮。真好喝！”"}, {"en": "Jenny smiles and says, \"You're welcome, Grandpa.\"", "zh": "珍妮笑着说：“不客气，爷爷。”"}], "vocab": {"verbs": [{"w": "add", "ipa": "/æd/", "zh": "添加"}, {"w": "become", "ipa": "/bɪˈkʌm/ (/bɪˈkeɪm/)", "zh": "变成"}, {"w": "boil", "ipa": "/bɔɪl/", "zh": "煮沸"}, {"w": "drip", "ipa": "/drɪp/", "zh": "滴下"}, {"w": "heat up", "ipa": "/hiːt ʌp/", "zh": "加热"}, {"w": "make", "ipa": "/meɪk/ (/meɪd/)", "zh": "制作"}, {"w": "pour", "ipa": "/pɔːr/", "zh": "倒，注"}, {"w": "press", "ipa": "/pres/", "zh": "按"}, {"w": "scoop", "ipa": "/skuːp/", "zh": "舀"}, {"w": "soak", "ipa": "/soʊk/", "zh": "浸泡"}, {"w": "stir", "ipa": "/stɜːr/", "zh": "搅拌"}, {"w": "strain", "ipa": "/streɪn/", "zh": "过滤"}, {"w": "turn on", "ipa": "/tɜːrn ɑːn/", "zh": "打开"}], "nouns": [{"w": "coffee", "ipa": "/ˈkɔːfi/", "zh": "咖啡"}, {"w": "coffee maker", "ipa": "/ˈkɔːfi ˈmeɪkər/", "zh": "咖啡机"}, {"w": "coffeepot", "ipa": "/ˈkɔːfipɑːt/", "zh": "咖啡壶"}, {"w": "filter", "ipa": "/ˈfɪltər/", "zh": "滤篮，滤纸"}, {"w": "leaves", "ipa": "/liːvz/", "zh": "叶子（复数）"}, {"w": "milk", "ipa": "/mɪlk/", "zh": "牛奶"}, {"w": "saucer", "ipa": "/ˈsɔːsər/", "zh": "茶托，碟子"}, {"w": "scoop", "ipa": "/skuːp/", "zh": "勺子， scoop 量勺"}, {"w": "strainer", "ipa": "/ˈstreɪnər/", "zh": "滤器，漏勺"}, {"w": "sugar", "ipa": "/ˈʃʊɡər/", "zh": "糖"}, {"w": "switch", "ipa": "/swɪtʃ/", "zh": "开关"}, {"w": "tea", "ipa": "/tiː/", "zh": "茶"}, {"w": "teacup", "ipa": "/ˈtiːkʌp/", "zh": "茶杯"}, {"w": "teakettle", "ipa": "/ˈtiːketl/", "zh": "烧水壶"}, {"w": "teapot", "ipa": "/ˈtiːpɑːt/", "zh": "茶壶"}, {"w": "water", "ipa": "/ˈwɔːtər/", "zh": "水"}], "others": [{"w": "electric", "ipa": "/ɪˈlektrɪk/", "zh": "电动的（形容词）"}, {"w": "ground", "ipa": "/ɡraʊnd/", "zh": "磨碎的（形容词）"}, {"w": "hot", "ipa": "/hɑːt/", "zh": "热的（形容词）"}]}, "notes": [{"en": "A filter has very small holes in it. A liquid or gas can pass through the holes, but large pieces of a solid cannot. A strainer does the same thing, but its holes are larger and it probably has a handle.", "zh": "filter（滤纸/滤篮）上有非常小的孔，液体或气体能通过，但大颗粒固体不行。strainer（滤器）作用相同，但孔更大，通常有手柄。"}, {"en": "If you grind coffee beans, you get ground coffee.", "zh": "把咖啡豆磨碎，就得到 ground coffee（咖啡粉）。"}, {"en": "Scoop...coffee = move it by using a scoop.", "zh": "scoop...coffee 指用勺子把咖啡舀起来。"}, {"en": "Heats up = becomes hot.", "zh": "heat up 意思是“变热”。"}, {"en": "When something soaks, it stays in water and becomes very wet.", "zh": "soak 指某物泡在水里，变得很湿。"}], "dialogue": [], "china": [{"en": "In China, children often make tea for grandparents, usually in a glass.", "zh": "在中国，孩子常给爷爷奶奶泡茶，一般直接用玻璃杯泡。可以说 make tea（泡茶）。"}, {"en": "Tea is a common gift for elders in China.", "zh": "在中国，茶叶是送给长辈常见的礼物。可以说 a gift of tea（茶叶礼物）。"}], "en": "Making Coffee / Making Tea", "zh": "煮咖啡/泡茶"}, {"id": 8, "section": 1, "level": 1, "img": "assets/img/unit8.jpg", "grammar": "SIMPLE PRESENT", "grammarZh": "一般现在时", "grammarNote": {"en": "The simple present describes the morning routine of preparing breakfast. Note the opposite pairs: lower/raise, pop up. Example: 'Dan puts two slices of bread into the toaster. The toast pops up when it's done.'", "zh": "一般现在时描述准备早餐的晨间流程。注意反义词组：lower（放下）/ raise（举起）、pop up（弹起）。例句：Dan puts two slices of bread into the toaster. The toast pops up when it's done.（丹把两片面包放进烤面包机，吐司烤好时会弹起来。）"}, "steps": [{"en": "Tom pours some cereal from the box into his bowl.", "zh": "汤姆从盒子里把麦片倒进碗里。"}, {"en": "He pours in some milk and sprinkles some sugar on his cereal.", "zh": "他倒了些牛奶，又在麦片上撒了点糖。"}, {"en": "Then he peels a banana, slices it, and puts the slices on his cereal.", "zh": "然后他剥了一根香蕉，切成片，放到麦片上。"}, {"en": "His mom puts two slices of bread into the toaster.", "zh": "妈妈把两片面包放进烤面包机。"}, {"en": "By pressing the starter, she lowers the bread into the toaster.", "zh": "她按下开关，把面包降进烤面包机。"}, {"en": "Hot wires inside the toaster toast the bread.", "zh": "烤面包机里的电热丝把面包烤好。"}, {"en": "The toast pops up when it's done.", "zh": "面包烤好后会弹出来。"}, {"en": "Tom spreads some peanut butter and jam on his toast.", "zh": "汤姆在吐司上抹了花生酱和果酱。"}], "vocab": {"verbs": [{"w": "lower", "ipa": "/ˈloʊər/", "zh": "放下，降下"}, {"w": "make", "ipa": "/meɪk/ (/meɪd/)", "zh": "制作"}, {"w": "peel", "ipa": "/piːl/", "zh": "削皮，剥皮"}, {"w": "pop up", "ipa": "/pɑːp ʌp/", "zh": "弹出"}, {"w": "pour", "ipa": "/pɔːr/", "zh": "倒"}, {"w": "prepare", "ipa": "/prɪˈper/", "zh": "准备"}, {"w": "press", "ipa": "/pres/", "zh": "按"}, {"w": "put on", "ipa": "/pʊt ɑːn/", "zh": "涂上，放上"}, {"w": "slice", "ipa": "/slaɪs/", "zh": "切片"}, {"w": "spread", "ipa": "/spred/ (/spred/)", "zh": "涂，抹"}, {"w": "sprinkle", "ipa": "/ˈsprɪŋkl/", "zh": "撒"}, {"w": "toast", "ipa": "/toʊst/", "zh": "烤（面包）"}], "nouns": [{"w": "banana", "ipa": "/bəˈnænə/", "zh": "香蕉"}, {"w": "bowl", "ipa": "/boʊl/", "zh": "碗"}, {"w": "box", "ipa": "/bɑːks/", "zh": "盒"}, {"w": "bread", "ipa": "/bred/", "zh": "面包"}, {"w": "butter", "ipa": "/ˈbʌtər/", "zh": "黄油"}, {"w": "cereal", "ipa": "/ˈsɪriəl/", "zh": "麦片"}, {"w": "jam", "ipa": "/dʒæm/", "zh": "果酱"}, {"w": "knife", "ipa": "/naɪf/ (/naɪvz/)", "zh": "刀（复数 knives）"}, {"w": "milk", "ipa": "/mɪlk/", "zh": "牛奶"}, {"w": "piece", "ipa": "/piːs/", "zh": "片，块"}, {"w": "slice", "ipa": "/slaɪs/", "zh": "薄片"}, {"w": "starter", "ipa": "/ˈstɑːrtər/", "zh": "启动杆"}, {"w": "sugar", "ipa": "/ˈʃʊɡər/", "zh": "糖"}, {"w": "toast", "ipa": "/toʊst/", "zh": "吐司"}, {"w": "toaster", "ipa": "/ˈtoʊstər/", "zh": "烤面包机"}, {"w": "wire", "ipa": "/ˈwaɪər/", "zh": "金属丝，电热丝"}], "others": [{"w": "cold", "ipa": "/koʊld/", "zh": "冷的（形容词）"}, {"w": "done", "ipa": "/dʌn/", "zh": "做好了的（形容词）"}, {"w": "hot", "ipa": "/hɑːt/", "zh": "热的（形容词）"}]}, "notes": [{"en": "You sprinkle something by making small pieces of it fall over a wide area.", "zh": "sprinkle 指把细小的东西均匀地撒在一大片区域上。"}, {"en": "Something that pops up comes up very quickly.", "zh": "pop up 指非常快速地弹起来。"}, {"en": "When you make something go down, you lower it; when you make something go up, you raise it.", "zh": "让某物下去叫 lower，让某物上去叫 raise。"}, {"en": "When you peel a fruit or vegetable, you take off its skin. Afterwards, the skin that has been taken off is called 'a peel' or 'peelings.'", "zh": "peel 指削掉水果或蔬菜的皮；削下来的皮叫 peel 或 peelings。"}, {"en": "Slices of bread are also called 'pieces' of bread.", "zh": "面包的片也可以叫 pieces of bread。"}, {"en": "To slice something is to cut it into thin, flat pieces.", "zh": "slice 指把某物切成薄而平的片。"}], "dialogue": [], "china": [{"en": "In China, breakfast is often porridge or baozi, but some children enjoy cereal and toast too.", "zh": "在中国，早餐常是粥或包子，不过也有孩子喜欢麦片和烤吐司。可以说 cereal（麦片）、toast（烤吐司）。"}, {"en": "Peanut butter is a common spread for toast at home.", "zh": "花生酱是家里常见的吐司抹酱。可以说 peanut butter（花生酱）。"}], "en": "Preparing Cold Cereal / Making Toast", "zh": "冲冷麦片/烤吐司"}, {"id": 9, "section": 1, "level": 1, "img": "assets/img/unit9.jpg", "grammar": "SIMPLE PRESENT", "grammarZh": "一般现在时", "grammarNote": {"en": "The simple present describes a repeated cooking routine. Notice that both active and middle forms work: 'Dan fries the egg' = 'The egg fries.' Example: 'He cracks an egg into the pan. The egg fries.'", "zh": "一般现在时描述每天重复的烹饪流程。注意主动与中性形式都可用：Dan fries the egg.（丹煎鸡蛋。）= The egg fries.（鸡蛋在煎。）例句：He cracks an egg into the pan. The egg fries.（他把鸡蛋磕进锅里，鸡蛋煎着。）"}, "steps": [{"en": "There are four burners on our stove.", "zh": "我们家的炉灶上有四个炉眼。"}, {"en": "Dad turns on the gas, and one of the burners lights.", "zh": "爸爸打开燃气，一个炉眼点着了。"}, {"en": "He puts a frying pan on the burner and pours some cooking oil into the pan.", "zh": "他把煎锅放到炉眼上，往锅里倒了些食用油。"}, {"en": "He cracks an egg into the pan and throws the shell into the garbage.", "zh": "他把鸡蛋打进锅里，把蛋壳扔进垃圾桶。"}, {"en": "The egg fries.", "zh": "鸡蛋煎熟了。"}, {"en": "Dad flips it over once with a spatula and then takes it out of the pan.", "zh": "爸爸用锅铲把鸡蛋翻了一次面，然后把它盛出煎锅。"}, {"en": "He puts the egg on a plate.", "zh": "他把鸡蛋放进盘子。"}], "vocab": {"verbs": [{"w": "crack", "ipa": "/kræk/", "zh": "磕开，敲破"}, {"w": "flip over", "ipa": "/flɪp ˈoʊvər/", "zh": "翻面"}, {"w": "fry", "ipa": "/fraɪ/", "zh": "煎，炸"}, {"w": "light", "ipa": "/laɪt/ (/ˈlɪt/)", "zh": "点燃"}, {"w": "melt", "ipa": "/melt/", "zh": "融化"}, {"w": "put on", "ipa": "/pʊt ɑːn/", "zh": "放在……上"}, {"w": "take out", "ipa": "/teɪk aʊt/", "zh": "取出，盛出"}, {"w": "throw", "ipa": "/θroʊ/ (/θruː/)", "zh": "扔"}, {"w": "turn on", "ipa": "/tɜːrn ɑːn/", "zh": "打开"}], "nouns": [{"w": "burner", "ipa": "/ˈbɜːrnər/", "zh": "炉头"}, {"w": "butter", "ipa": "/ˈbʌtər/", "zh": "黄油"}, {"w": "egg", "ipa": "/eɡ/", "zh": "鸡蛋"}, {"w": "flame", "ipa": "/fleɪm/", "zh": "火焰"}, {"w": "frying pan", "ipa": "/ˈfraɪɪŋ pæn/", "zh": "煎锅"}, {"w": "garbage", "ipa": "/ˈɡɑːrbɪdʒ/", "zh": "垃圾"}, {"w": "gas", "ipa": "/ɡæs/", "zh": "煤气"}, {"w": "pan", "ipa": "/pæn/", "zh": "锅"}, {"w": "plate", "ipa": "/pleɪt/", "zh": "盘子"}, {"w": "shell", "ipa": "/ʃel/", "zh": "蛋壳"}, {"w": "spatula", "ipa": "/ˈspætʃələ/", "zh": "锅铲"}, {"w": "stove", "ipa": "/stoʊv/", "zh": "炉子"}, {"w": "white", "ipa": "/waɪt/", "zh": "蛋白"}, {"w": "yolk", "ipa": "/joʊk/", "zh": "蛋黄"}], "others": [{"w": "once", "ipa": "/wʌns/", "zh": "一次（副词）"}]}, "notes": [{"en": "'The egg fries' and 'Dan fries the egg' are both possible.", "zh": "The egg fries. 和 Dan fries the egg. 两种说法都可以。"}, {"en": "Dan has a gas stove. Some people have electric stoves.", "zh": "丹用燃气灶，有些人用电炉。"}, {"en": "When you flip something, you turn it upside down.", "zh": "flip 指把某物上下翻转。"}, {"en": "When you throw something into the garbage, you throw it into a container for garbage.", "zh": "throw into the garbage 指扔进装垃圾的容器里。"}, {"en": "To melt something is to heat it until it changes from solid to liquid.", "zh": "melt 指加热某物，使其从固体变成液体。"}], "dialogue": [], "china": [{"en": "In China, we use cooking oil, not butter, to fry eggs.", "zh": "在中国，我们煎蛋用食用油，不用黄油。可以说 cooking oil（食用油）。"}, {"en": "Tom watches Dad fry the egg and waits for breakfast.", "zh": "汤姆看着爸爸煎蛋，等着吃早饭。可以说 watch（看）、wait for（等待）。"}], "en": "Frying an Egg", "zh": "煎鸡蛋"}, {"id": 10, "section": 1, "level": 1, "img": "assets/img/unit10.jpg", "grammar": "SIMPLE PRESENT", "grammarZh": "一般现在时", "grammarNote": {"en": "The simple present describes the ongoing breakfast routine. Note frequency adverbs like 'sometimes' and the phrase 'a little bit.' Example: 'Pam and Dan sit down at the table. Sometimes, he dips his toast into the yolk.'", "zh": "一般现在时描述吃早餐时的日常状态。注意频率副词 sometimes（有时）和短语 a little bit（一点点）。例句：Pam and Dan sit down at the table. Sometimes, he dips his toast into the yolk.（帕姆和丹在餐桌旁坐下。有时他把吐司蘸进蛋黄里。）"}, "steps": [{"en": "Jenny and Mom sit down at the table.", "zh": "珍妮和妈妈在餐桌旁坐下。"}, {"en": "Mom pours some milk into Jenny's bowl.", "zh": "妈妈往珍妮的碗里倒了些牛奶。"}, {"en": "Jenny eats some rice porridge with a spoon.", "zh": "珍妮用勺子喝粥。"}, {"en": "She dips her steamed bun into the soy milk.", "zh": "她把包子蘸着豆浆吃。"}, {"en": "Mom drinks a cup of tea.", "zh": "妈妈喝了一杯茶。"}, {"en": "After eating, Jenny wipes her mouth with a napkin.", "zh": "吃完后，珍妮用纸巾擦了擦嘴。"}, {"en": "She puts her bowl in the sink and gets ready for school.", "zh": "她把碗放进水池，准备去上学。"}], "vocab": {"verbs": [{"w": "dip", "ipa": "/dɪp/", "zh": "蘸"}, {"w": "drink", "ipa": "/drɪŋk/", "zh": "喝"}, {"w": "eat", "ipa": "/iːt/", "zh": "吃"}, {"w": "get ready", "ipa": "/ɡet ˈredi/", "zh": "准备好"}, {"w": "pour", "ipa": "/pɔːr/", "zh": "倒（液体）"}, {"w": "sit down", "ipa": "/sɪt daʊn/", "zh": "坐下"}, {"w": "wipe", "ipa": "/waɪp/", "zh": "擦"}], "nouns": [{"w": "bowl", "ipa": "/boʊl/", "zh": "碗"}, {"w": "egg", "ipa": "/eɡ/", "zh": "鸡蛋"}, {"w": "napkin", "ipa": "/ˈnæpkɪn/", "zh": "纸巾；餐巾"}, {"w": "rice porridge", "ipa": "/raɪs ˈpɔːrɪdʒ/", "zh": "粥"}, {"w": "soy milk", "ipa": "/sɔɪ mɪlk/", "zh": "豆浆"}, {"w": "spoon", "ipa": "/spuːn/", "zh": "勺子"}, {"w": "steamed bun", "ipa": "/stiːmd bʌn/", "zh": "包子"}, {"w": "table", "ipa": "/ˈteɪbl/", "zh": "餐桌"}], "others": [{"w": "a cup of (quantifier)", "ipa": "/ə kʌp əv/", "zh": "一杯"}, {"w": "yum (interj.)", "ipa": "/jʌm/", "zh": "好吃；好喝"}]}, "notes": [{"en": "Rice porridge with a steamed bun is a common Chinese breakfast.", "zh": "粥配包子是很常见的中国早餐。"}, {"en": "\"We'll be late for school\" means we need to hurry.", "zh": "We'll be late for school.（上学要迟到了）意思是得抓紧时间了。"}], "dialogue": [{"speaker": "Mom", "role": "mom", "en": "Eat your egg, Jenny. We'll be late for school.", "zh": "把鸡蛋吃了，珍妮。上学要迟到了。"}, {"speaker": "Jenny", "role": "girl", "en": "Okay, Mom. Yum!", "zh": "好的，妈妈。真好吃！"}], "china": [{"en": "Chinese breakfasts often include rice porridge, steamed buns, soy milk and eggs.", "zh": "中式早餐常有粥、包子、豆浆和鸡蛋。"}, {"en": "Children use a spoon for porridge and wipe their mouths with a napkin after eating.", "zh": "孩子用勺子喝粥，吃完用纸巾擦嘴。"}], "en": "Eating Breakfast", "zh": "吃早餐"}, {"id": 11, "section": 1, "level": 1, "img": "assets/img/unit11.jpg", "grammar": "SIMPLE PRESENT", "grammarZh": "一般现在时", "grammarNote": {"en": "The simple present describes the final steps of the morning routine. Example: 'Tom puts on a jacket and zips it up. He picks up his keys and wallet.' Notice the phrasal verbs: zip up, pick up, put in, say goodbye.", "zh": "一般现在时描述晨间流程的最后几步。例句：Tom puts on a jacket and zips it up. He picks up his keys and wallet.（汤姆穿上外套，拉上拉链。他拿起钥匙和钱包。）注意短语动词：zip up（拉上拉链）、pick up（拿起）、put in（放进）、say goodbye（道别）。"}, "steps": [{"en": "Tom puts on a jacket and zips it up.", "zh": "汤姆穿上夹克，拉上了拉链。"}, {"en": "He puts on his shoes and ties them.", "zh": "他穿上鞋子，系好鞋带。"}, {"en": "He picks up his key card and his school bag.", "zh": "他拿起门禁卡和书包。"}, {"en": "He puts the key card in his pocket.", "zh": "他把门禁卡放进口袋。"}, {"en": "Then he says goodbye to Jenny.", "zh": "然后他跟珍妮说了再见。"}, {"en": "He opens the door, steps outside, and shuts the door.", "zh": "他打开门，走出去，又关上了门。"}], "vocab": {"verbs": [{"w": "leave", "ipa": "/liːv/ (/left/)", "zh": "离开"}, {"w": "open", "ipa": "/ˈoʊpən/", "zh": "打开"}, {"w": "pick up", "ipa": "/pɪk ʌp/", "zh": "拿起"}, {"w": "put in", "ipa": "/pʊt ɪn/", "zh": "放进"}, {"w": "put on", "ipa": "/pʊt ɑːn/", "zh": "穿上"}, {"w": "say goodbye", "ipa": "/seɪ ɡʊdˈbaɪ/", "zh": "道别"}, {"w": "shut", "ipa": "/ʃʌt/ (/ʃʌt/)", "zh": "关上"}, {"w": "step", "ipa": "/step/", "zh": "迈步"}, {"w": "tie", "ipa": "/taɪ/", "zh": "系（鞋带）"}, {"w": "zip up", "ipa": "/zɪp ʌp/", "zh": "拉上拉链"}], "nouns": [{"w": "backpack", "ipa": "/ˈbækpæk/", "zh": "双肩包"}, {"w": "door", "ipa": "/dɔːr/", "zh": "门"}, {"w": "house", "ipa": "/haʊs/", "zh": "房子"}, {"w": "jacket", "ipa": "/ˈdʒækɪt/", "zh": "外套"}, {"w": "key", "ipa": "/kiː/", "zh": "钥匙"}, {"w": "pocket", "ipa": "/ˈpɑːkɪt/", "zh": "口袋"}, {"w": "shoe", "ipa": "/ʃuː/", "zh": "鞋"}, {"w": "wallet", "ipa": "/ˈwɑːlɪt/", "zh": "钱包"}], "others": [{"w": "outside", "ipa": "/ˌaʊtˈsaɪd/", "zh": "在外面（副词）"}]}, "notes": [{"en": "Some ways people say goodbye: 'See you later.' 'Bye.' 'See you.' 'Catch you later.' 'Goodbye.'", "zh": "道别的几种说法：See you later. / Bye. / See you. / Catch you later. / Goodbye."}, {"en": "'Leave home' can mean the same as 'leave the house.' (For example, 'He left home at seven o'clock this morning.')", "zh": "leave home 与 leave the house 意思相同。例如：He left home at seven o'clock this morning.（他今天早上七点出门。）"}, {"en": "The opposite of 'zip up' is 'unzip.'", "zh": "zip up 的反义词是 unzip（拉开拉链）。"}, {"en": "'Shut the door' means 'close the door.'", "zh": "shut the door 意思就是 close the door（关门）。"}], "dialogue": [{"speaker": "Jenny", "role": "girl", "en": "Bye, Tom.", "zh": "再见，汤姆。"}, {"speaker": "Tom", "role": "clerk", "en": "See you later, Jen.", "zh": "回头见，珍。"}], "china": [{"en": "In China, children often carry a key card or a bus card when going out.", "zh": "在中国，孩子出门常带门禁卡或公交卡。可以说 key card（门禁卡）、bus card（公交卡）。"}, {"en": "Tom says goodbye before leaving, just like a polite Chinese child.", "zh": "汤姆出门前会说再见，就像有礼貌的中国孩子。可以说 say goodbye（说再见）。"}], "en": "Leaving the House", "zh": "出门"}, {"id": 12, "section": 2, "level": 1, "img": "assets/img/unit12.jpg", "grammar": "SIMPLE PAST", "grammarNote": {"en": "\"Getting Around\" uses mostly simple past verbs. Regular verbs end in -ed (e.g., walked, checked, waited). Irregular verbs have special past forms, listed in brackets in Key Vocabulary (e.g., sit-sat, stand-stood, get-got, hold-held, pay-paid, put-put, read-read, ride-rode, ring-rang). Common past-tense time expressions include: Yesterday; phrases with \"last\" (last week, last year, last month, last Monday); phrases with \"ago\" (two weeks ago, a few minutes ago, five days ago, a year ago).", "zh": "本单元主要使用一般过去时。规则动词过去式加 -ed（如 walked、checked、waited）。不规则动词有特殊的过去式，列在\"核心词汇\"括号内（如 sit-sat、stand-stood、get-got、hold-held、pay-paid、put-put、read-read、ride-rode、ring-rang）。与过去时连用的常见时间词包括：Yesterday（昨天）；带 last 的短语（last week 上周、last year 去年、last month 上个月、last Monday 上周一）；带 ago 的短语（two weeks ago 两周前、a few minutes ago 几分钟前、five days ago 五天前、a year ago 一年前）。"}, "steps": [{"en": "Jenny checked the bus schedule on her phone.", "zh": "珍妮在手机上查了公交时刻表。"}, {"en": "Her bus—a Number 77—was due at eight-twenty.", "zh": "她要乘坐的 77 路公交车八点二十到。"}, {"en": "She walked to the bus stop and waited.", "zh": "她走到公交车站等候。"}, {"en": "The bus arrived on time, and the driver opened the door.", "zh": "公交车准点到达，司机打开了门。"}, {"en": "Jenny got on the bus and tapped her transit card on the reader.", "zh": "珍妮上了车，在刷卡机上刷了公交卡。"}, {"en": "Other passengers scanned their phone codes.", "zh": "其他乘客用手机扫码付车费。"}, {"en": "All the seats were full, so Jenny stood in the aisle and held on to a strap.", "zh": "座位都满了，珍妮站在过道里，抓住吊环。"}, {"en": "Soon, a seat was empty, and Jenny sat down.", "zh": "很快有个空座，珍妮坐了下来。"}, {"en": "Near her stop, she pressed the button to ring the stop signal.", "zh": "快到站时，她按下按钮，按响下车铃。"}, {"en": "She got off at her stop and walked to school.", "zh": "她在自己的那一站下车，走向学校。"}], "vocab": {"verbs": [{"w": "arrive", "ipa": "/əˈraɪv/", "zh": "到达"}, {"w": "check", "ipa": "/tʃek/", "zh": "查看"}, {"w": "get off", "ipa": "/ɡet ɔːf/", "zh": "下车"}, {"w": "get on", "ipa": "/ɡet ɑːn/", "zh": "上车"}, {"w": "hold on to", "ipa": "/hoʊld ɑːn tuː/", "zh": "抓住"}, {"w": "press", "ipa": "/pres/", "zh": "按"}, {"w": "ring", "ipa": "/rɪŋ/", "zh": "按响；响铃"}, {"w": "scan", "ipa": "/skæn/", "zh": "扫码"}, {"w": "tap", "ipa": "/tæp/", "zh": "轻触；刷（卡）"}, {"w": "wait", "ipa": "/weɪt/", "zh": "等待"}, {"w": "walk", "ipa": "/wɔːk/", "zh": "走"}], "nouns": [{"w": "aisle", "ipa": "/aɪl/", "zh": "过道"}, {"w": "bus", "ipa": "/bʌs/", "zh": "公交车"}, {"w": "bus stop", "ipa": "/bʌs stɑːp/", "zh": "公交站"}, {"w": "door", "ipa": "/dɔːr/", "zh": "门"}, {"w": "driver", "ipa": "/ˈdraɪvər/", "zh": "司机"}, {"w": "phone", "ipa": "/foʊn/", "zh": "手机"}, {"w": "reader", "ipa": "/ˈriːdər/", "zh": "刷卡机"}, {"w": "schedule", "ipa": "/ˈskedʒuːl/", "zh": "时刻表"}, {"w": "seat", "ipa": "/siːt/", "zh": "座位"}, {"w": "signal", "ipa": "/ˈsɪɡnəl/", "zh": "下车铃"}, {"w": "strap", "ipa": "/stræp/", "zh": "吊环"}, {"w": "transit card", "ipa": "/ˈtrænzɪt kɑːrd/", "zh": "公交卡"}], "others": [{"w": "due (adj.)", "ipa": "/duː/", "zh": "（车）应到"}, {"w": "on time (adverbial)", "ipa": "/ɑːn taɪm/", "zh": "准时"}]}, "notes": [{"en": "Tap your transit card or scan your phone code when you get on the bus.", "zh": "上车时刷公交卡或用手机扫码。"}, {"en": "Press the button near your stop so the driver knows you want to get off.", "zh": "快到站时按下按钮，司机就知道你要下车。"}], "dialogue": [{"speaker": "Jenny", "role": "girl", "en": "Excuse me, does this bus go to Sunny School?", "zh": "请问这路车去阳光小学吗？"}, {"speaker": "Driver", "role": "clerk", "en": "Yes, it does. Five stops.", "zh": "是的，五站就到。"}, {"speaker": "Jenny", "role": "girl", "en": "Thank you!", "zh": "谢谢！"}], "china": [{"en": "In Chinese cities, people pay the bus fare by tapping a transit card or scanning a phone code.", "zh": "中国城市乘公交用公交卡刷卡或手机扫码付费。"}, {"en": "Many city buses have air conditioning and announce stops in Chinese and English.", "zh": "很多公交车有空调，并用中英文自动报站。"}], "en": "Taking a Bus", "zh": "乘公交", "grammarZh": "一般过去时"}, {"id": 13, "section": 2, "level": 2, "en": "Starting Out", "zh": "开车起步", "grammar": "SIMPLE PAST", "grammarZh": "一般过去时", "img": "assets/img/unit13.jpg", "grammarNote": {"en": "We use the simple past to tell what happened at a specific time in the past. Regular verbs add -ed (start → started); irregular verbs change (sit → sat, put → put). Time words: yesterday, this morning, last week, at 7:00.", "zh": "一般过去时用来叙述过去某个时间发生的事。规则动词加 -ed（start → started）；不规则动词有特殊变化（sit → sat 坐，put → put 放）。常用时间词：yesterday 昨天、this morning 今天早上、last week 上周。"}, "steps": [{"en": "Dad sat in the driver's seat, and Tom sat in the back seat.", "zh": "爸爸坐在驾驶座，汤姆坐在后座。"}, {"en": "Dad adjusted his seat and the rear-view mirror.", "zh": "爸爸调整了座位和后视镜。"}, {"en": "He buckled his seat belt.", "zh": "他系上了安全带。"}, {"en": "He put the key into the ignition.", "zh": "他把钥匙插进点火开关。"}, {"en": "He turned the key.", "zh": "他转动了钥匙。"}, {"en": "He started the car.", "zh": "他发动了汽车。"}, {"en": "He looked over his shoulder.", "zh": "他回头看了看。"}, {"en": "He backed out of the driveway.", "zh": "他把车倒出了车道。"}], "dialogue": [], "vocab": {"verbs": [{"w": "adjust", "ipa": "/əˈdʒʌst/", "zh": "调整"}, {"w": "back out of", "ipa": "/bæk aʊt əv/", "zh": "倒车驶出"}, {"w": "buckle", "ipa": "/ˈbʌkəl/", "zh": "扣上（安全带）"}, {"w": "look", "ipa": "/lʊk/", "zh": "看"}, {"w": "put into", "ipa": "/pʊt ˈɪntuː/", "zh": "插入；放进"}, {"w": "sit (sat)", "ipa": "/sɪt/ (/sæt/)", "zh": "坐"}, {"w": "start", "ipa": "/stɑːrt/", "zh": "发动；开始"}, {"w": "start out", "ipa": "/stɑːrt aʊt/", "zh": "出发；起步"}, {"w": "turn", "ipa": "/tɜːrn/", "zh": "转动"}], "nouns": [{"w": "car", "ipa": "/kɑːr/", "zh": "汽车"}, {"w": "driver", "ipa": "/ˈdraɪvər/", "zh": "驾驶员"}, {"w": "driveway", "ipa": "/ˈdraɪvweɪ/", "zh": "（通往房屋的车道）"}, {"w": "friend", "ipa": "/frend/", "zh": "朋友"}, {"w": "ignition", "ipa": "/ɪɡˈnɪʃən/", "zh": "点火开关；点火"}, {"w": "key", "ipa": "/kiː/", "zh": "钥匙"}, {"w": "passenger", "ipa": "/ˈpæsɪndʒər/", "zh": "乘客"}, {"w": "rear-view mirror", "ipa": "/ˈrɪr vjuː ˈmɪrər/", "zh": "后视镜"}, {"w": "seat", "ipa": "/siːt/", "zh": "座位"}, {"w": "seat belt", "ipa": "/siːt belt/", "zh": "安全带"}, {"w": "shoulder", "ipa": "/ˈʃoʊldər/", "zh": "肩膀"}], "others": []}, "notes": [{"en": "adjust = move or change something until it is right for you.", "zh": "adjust 指“调整”，把某物移动或改变到合适的状态。"}, {"en": "A driveway is the short road that leads from the street to a house or a parking lot.", "zh": "driveway 是连接街道与房屋或停车场的短车道。"}, {"en": "The ignition is the slot where you put the car key. In other cases, “ignition” means starting to burn.", "zh": "ignition 是插入车钥匙的孔（点火开关）；在别的语境里也可以指“点燃、起火”。"}], "china": [{"en": "In China, children must sit in the back seat and wear a seat belt.", "zh": "在中国，孩子要坐在后排并系好安全带。可以说 wear a seat belt（系安全带）。"}, {"en": "Tom watches Dad drive and learns car words.", "zh": "汤姆看着爸爸开车，顺便学汽车词汇。可以说 watch Dad drive（看爸爸开车）。"}]}, {"id": 14, "section": 2, "level": 2, "img": "assets/img/unit14.jpg", "grammar": "SIMPLE PAST", "grammarNote": {"en": "The simple past describes completed actions in the past. Regular verbs add -ed (e.g., started, pressed, turned). Irregular verbs in this unit include: put-put, let-let, took-took. Time expressions like when it got dark, when it rained, and when he wanted to back up set the past scene.", "zh": "一般过去时描述过去完成的动作。规则动词加 -ed（如 started、pressed、turned）。本单元的不规则动词有：put-put、let-let、take-took。时间表达如 when it got dark（天黑时）、when it rained（下雨时）、when he wanted to back up（要倒车时）都用来设定过去的场景。"}, "steps": [{"en": "Dad got into the car and started the engine.", "zh": "爸爸上了车，发动引擎。"}, {"en": "He put the gearshift into D for Drive.", "zh": "他把挡杆挂到 D 挡（前进挡）。"}, {"en": "He let off the brake, and the car moved forward.", "zh": "他松开刹车，汽车向前行驶。"}, {"en": "To go faster, he pressed the accelerator.", "zh": "要加速，他踩下油门。"}, {"en": "To slow down, he let up on the accelerator...", "zh": "要减速，他松开油门……"}, {"en": "...and stepped on the brake.", "zh": "……并踩下刹车。"}, {"en": "When it got dark, he turned on the lights.", "zh": "天黑时，他打开了车灯。"}, {"en": "When it rained, he turned on the windshield wipers.", "zh": "下雨时，他打开了雨刮器。"}, {"en": "When he wanted to back up, he put the gearshift into R.", "zh": "要倒车时，他把挡杆挂到 R 挡。"}], "vocab": {"verbs": [{"w": "back up", "ipa": "/bæk ʌp/", "zh": "倒车"}, {"w": "let off", "ipa": "/let ɔːf/", "zh": "松开（刹车）"}, {"w": "let up on", "ipa": "/let ʌp ɑːn/", "zh": "松开（油门）"}, {"w": "move", "ipa": "/muːv/", "zh": "移动，行驶"}, {"w": "press", "ipa": "/pres/", "zh": "踩，按"}, {"w": "put (put) in", "ipa": "/pʊt ɪn/", "zh": "挂（挡）"}, {"w": "slow down", "ipa": "/sloʊ daʊn/", "zh": "减速"}, {"w": "speed up", "ipa": "/spiːd ʌp/", "zh": "加速"}, {"w": "start", "ipa": "/stɑːrt/", "zh": "发动（引擎）"}, {"w": "step on", "ipa": "/step ɑːn/", "zh": "踩（刹车）"}, {"w": "turn on", "ipa": "/tɜːrn ɑːn/", "zh": "打开（开关）"}], "nouns": [{"w": "accelerator", "ipa": "/əkˈseləreɪtər/", "zh": "油门"}, {"w": "automatic car", "ipa": "/ˌɔːtəˈmætɪk kɑːr/", "zh": "自动挡汽车"}, {"w": "brake", "ipa": "/breɪk/", "zh": "刹车"}, {"w": "car", "ipa": "/kɑːr/", "zh": "汽车"}, {"w": "D (Drive)", "ipa": "/draɪv/", "zh": "D 挡（前进挡）"}, {"w": "engine", "ipa": "/ˈendʒɪn/", "zh": "引擎，发动机"}, {"w": "gearshift", "ipa": "/ˈɡɪrʃɪft/", "zh": "挡杆"}, {"w": "light", "ipa": "/laɪt/", "zh": "车灯"}, {"w": "R (Reverse)", "ipa": "/rɪˈvɜːrs/", "zh": "R 挡（倒挡）"}, {"w": "seat belt", "ipa": "/siːt belt/", "zh": "安全带"}, {"w": "windshield wiper", "ipa": "/ˈwɪndʃiːld ˈwaɪpər/", "zh": "雨刮器"}], "others": [{"w": "dark (adj.)", "ipa": "/dɑːrk/", "zh": "黑的，暗的"}, {"w": "forward (adv.)", "ipa": "/ˈfɔːrwərd/", "zh": "向前"}]}, "notes": [{"en": "An automatic car has only D, R, and P. You don't need a clutch or to shift gears by hand.", "zh": "自动挡汽车只有 D、R、P 三个主要挡位，不需要踩离合器，也不用手动换挡（家长导读：手动挡的离合换挡细节请大人在一旁讲解）。"}, {"en": "P is for Parking. When you stop the car, you put the gearshift into P.", "zh": "P 是停车挡。停车时把挡杆挂到 P 挡。"}, {"en": "Another way of saying press the accelerator is \"step on the gas.\"", "zh": "press the accelerator 的另一种说法是 step on the gas（踩油门）。"}], "dialogue": [{"speaker": "Tom", "role": "clerk", "en": "Dad, why is the car moving by itself?", "zh": "爸爸，车怎么会自己走？"}, {"speaker": "Dad", "role": "mom", "en": "Because it's an automatic car. I just put it in D.", "zh": "因为这是自动挡汽车，我只要挂到 D 挡。"}, {"speaker": "Tom", "role": "clerk", "en": "Cool! Can I sit in the front seat?", "zh": "好酷！我能坐前排吗？"}, {"speaker": "Dad", "role": "mom", "en": "Sure, if you wear your seat belt.", "zh": "可以，但要系好安全带。"}], "china": [{"en": "In China, most families drive automatic cars, so kids learn D, R, and P gears first.", "zh": "在中国，大多数家庭开自动挡汽车，孩子最先认识 D、R、P 挡。"}, {"en": "Chinese cars have the steering wheel on the left side, and drivers drive on the right side of the road.", "zh": "中国汽车的方向盘在左侧，车辆靠右行驶。"}], "en": "Operating a Car", "zh": "开自动挡汽车", "grammarZh": "一般过去时"}, {"id": 15, "section": 2, "level": 2, "img": "assets/img/unit15.jpg", "grammar": "SIMPLE PAST", "grammarNote": {"en": "The simple past is used for a sequence of driving events that happened and ended. Regular verbs: parked, pumped, checked, locked, stopped. Irregular verbs: drive-drove, get-got, give-gave, go-went, tell-told. Time markers: once, at the end of her trip, when the light turned green.", "zh": "一般过去时用来描述一连串已经发生并结束的驾驶事件。规则动词：parked、pumped、checked、locked、stopped。不规则动词：drive-drove、get-got、give-gave、go-went、tell-told。时间标志词：once（有一次）、at the end of her trip（行程结束时）、when the light turned green（灯变绿时）。"}, "steps": [{"en": "At an intersection, Dad stopped for a red light.", "zh": "在路口，爸爸看到红灯停了下来。"}, {"en": "When the light turned green, he went ahead.", "zh": "绿灯亮了，他才继续往前走。"}, {"en": "Tom sat in the back and wore his seat belt.", "zh": "汤姆坐在后排，系着安全带。"}, {"en": "At the end of the trip, Dad parked...", "zh": "到达目的地后，爸爸停好了车……"}, {"en": "...and turned the car off.", "zh": "……然后熄了火。"}, {"en": "Dad and Tom got out of the car...", "zh": "爸爸和汤姆下了车……"}, {"en": "...and Dad locked it.", "zh": "……爸爸锁好了车。"}, {"en": "Tom held Dad's hand when they crossed the street.", "zh": "过马路时，汤姆紧紧拉着爸爸的手。"}], "vocab": {"verbs": [{"w": "change", "ipa": "/tʃeɪndʒ/", "zh": "变更，换（车道）"}, {"w": "check", "ipa": "/tʃek/", "zh": "检查"}, {"w": "drive (drove)", "ipa": "/draɪv/", "zh": "驾驶"}, {"w": "enter", "ipa": "/ˈentər/", "zh": "进入"}, {"w": "exit", "ipa": "/ˈeɡzɪt/", "zh": "驶出，离开"}, {"w": "get (got) on", "ipa": "/ɡet/", "zh": "上（高速）"}, {"w": "get (got) off", "ipa": "/ɡet/", "zh": "下（高速）"}, {"w": "get (got) out of", "ipa": "/ɡet/", "zh": "从……下来"}, {"w": "give (gave)", "ipa": "/ɡɪv/", "zh": "给，开（罚单）"}, {"w": "go (went)", "ipa": "/ɡoʊ/", "zh": "走，行驶"}, {"w": "go (went) over", "ipa": "/ɡoʊ ˈoʊvər/", "zh": "超过（限速）"}, {"w": "lock", "ipa": "/lɑːk/", "zh": "锁"}, {"w": "park", "ipa": "/pɑːrk/", "zh": "停车"}, {"w": "pass", "ipa": "/pæs/", "zh": "超过，经过"}, {"w": "pay (paid)", "ipa": "/peɪ/", "zh": "付款"}, {"w": "pull into", "ipa": "/pʊl ˈɪntuː/", "zh": "驶入"}, {"w": "pull over", "ipa": "/pʊl ˈoʊvər/", "zh": "靠边停车"}, {"w": "pull up", "ipa": "/pʊl ʌp/", "zh": "停到（油泵前）"}, {"w": "pump", "ipa": "/pʌmp/", "zh": "加（油）"}, {"w": "stop", "ipa": "/stɑːp/", "zh": "停下"}, {"w": "tell (told)", "ipa": "/tel/", "zh": "告诉"}, {"w": "turn", "ipa": "/tɜːrn/", "zh": "转弯"}, {"w": "turn off", "ipa": "/tɜːrn ɔːf/", "zh": "熄火，关闭"}, {"w": "want", "ipa": "/wɑːnt/", "zh": "想要"}, {"w": "yield", "ipa": "/jiːld/", "zh": "让行"}], "nouns": [{"w": "attendant", "ipa": "/əˈtendənt/", "zh": "服务员"}, {"w": "car", "ipa": "/kɑːr/", "zh": "汽车"}, {"w": "driver", "ipa": "/ˈdraɪvər/", "zh": "司机"}, {"w": "end", "ipa": "/end/", "zh": "尽头，终点"}, {"w": "freeway", "ipa": "/ˈfriːweɪ/", "zh": "高速公路"}, {"w": "friend", "ipa": "/frend/", "zh": "朋友"}, {"w": "gas", "ipa": "/ɡæs/", "zh": "汽油"}, {"w": "gas station", "ipa": "/ɡæs ˈsteɪʃn/", "zh": "加油站"}, {"w": "intersection", "ipa": "/ˌɪntərˈsekʃn/", "zh": "十字路口"}, {"w": "kind", "ipa": "/kaɪnd/", "zh": "种类"}, {"w": "lane", "ipa": "/leɪn/", "zh": "车道"}, {"w": "light", "ipa": "/laɪt/", "zh": "灯（红绿灯）"}, {"w": "officer", "ipa": "/ˈɔːfɪsər/", "zh": "官员，警察"}, {"w": "oil", "ipa": "/ɔɪl/", "zh": "机油"}, {"w": "police", "ipa": "/pəˈliːs/", "zh": "警察"}, {"w": "pump", "ipa": "/pʌmp/", "zh": "油泵"}, {"w": "right of way", "ipa": "/raɪt ʌv weɪ/", "zh": "路权"}, {"w": "road", "ipa": "/roʊd/", "zh": "道路"}, {"w": "side", "ipa": "/saɪd/", "zh": "路边"}, {"w": "sign", "ipa": "/saɪn/", "zh": "标志"}, {"w": "speeding", "ipa": "/ˈspiːdɪŋ/", "zh": "超速"}, {"w": "speed limit", "ipa": "/spiːd ˈlɪmɪt/", "zh": "限速"}, {"w": "ticket", "ipa": "/ˈtɪkɪt/", "zh": "罚单"}, {"w": "traffic light", "ipa": "/ˈtræfɪk laɪt/", "zh": "红绿灯"}, {"w": "trip", "ipa": "/trɪp/", "zh": "行程"}], "others": [{"w": "ahead (adj.)", "ipa": "/əˈhed/", "zh": "向前，在前"}, {"w": "green (adj.)", "ipa": "/ɡriːn/", "zh": "绿色的"}, {"w": "left (adv.)", "ipa": "/left/", "zh": "向左"}, {"w": "once (adv.)", "ipa": "/wʌns/", "zh": "曾经，有一次"}, {"w": "red (adj.)", "ipa": "/red/", "zh": "红色的"}, {"w": "right (adv.)", "ipa": "/raɪt/", "zh": "向右"}, {"w": "straight (adv.)", "ipa": "/streɪt/", "zh": "直行"}]}, "notes": [{"en": "turn red = become red.", "zh": "turn red 就是变红（指灯变红）。"}, {"en": "When speaking of cars, buses, etc.: pull in = drive in; pull up = drive forward; pull over = drive to the side of the road and stop.", "zh": "指汽车、公交车等时：pull in = 驶入；pull up = 向前开停住；pull over = 开到路边停下。"}, {"en": "To go over a limit is to go faster or farther than you should.", "zh": "go over a limit 就是超出了应有的速度或距离，即超速。"}], "dialogue": [{"speaker": "Tom", "role": "clerk", "en": "Dad, the light is red.", "zh": "爸爸，红灯亮了。"}, {"speaker": "Dad", "role": "mom", "en": "Yes, we stop at red lights and go on green.", "zh": "对，红灯停、绿灯行。"}], "china": [{"en": "In China, everyone must follow the traffic light: stop at red, go on green.", "zh": "在中国，人人都要遵守交通信号灯：红灯停、绿灯行。可以说 stop at red, go on green（红灯停、绿灯行）。"}, {"en": "Children hold their parents' hand when crossing the street.", "zh": "孩子过马路时要拉好大人的手。可以说 hold hands（手拉手）。"}], "en": "Driving Along", "zh": "沿路驾驶", "grammarZh": "一般过去时"}, {"id": 16, "section": 2, "level": 1, "img": "assets/img/unit16.jpg", "grammar": "SIMPLE PAST", "grammarNote": {"en": "The simple past tells the story of a train trip from buying a ticket to getting off. Regular verbs: announced, followed, inserted, opened, waited. Irregular verbs: buy-bought, get-got, have-had, stand-stood, take-took. Passive past (was crowded, was announced) also appears.", "zh": "一般过去时讲述了从买票到下车的整个乘车过程。规则动词：announced、followed、inserted、opened、waited。不规则动词：buy-bought、get-got、have-had、stand-stood、take-took。本单元还出现了被动语态的过去式（was crowded 很挤、was announced 被广播）。"}, "steps": [{"en": "Tom booked a train ticket on his phone.", "zh": "汤姆在手机上订了一张火车票。"}, {"en": "At the station, he showed his ID card at the gate.", "zh": "在车站，他在闸机口刷了身份证。"}, {"en": "The gate opened, and he walked through.", "zh": "闸门打开，他走了过去。"}, {"en": "He followed the signs to the platform.", "zh": "他跟着指示牌走到站台。"}, {"en": "He waited on the platform next to the track.", "zh": "他站在站台上，紧挨着轨道等车。"}, {"en": "The high-speed train arrived, and he got on.", "zh": "高铁到站了，他上了车。"}, {"en": "He found his seat by the window.", "zh": "他找到了靠窗的座位。"}, {"en": "His station was announced...", "zh": "广播报了他要下的站……"}, {"en": "...and he got off the train.", "zh": "然后他下了火车。"}], "vocab": {"verbs": [{"w": "announce", "ipa": "/əˈnaʊns/", "zh": "（广播）报站"}, {"w": "arrive", "ipa": "/əˈraɪv/", "zh": "到达"}, {"w": "book", "ipa": "/bʊk/", "zh": "预订；买票"}, {"w": "find", "ipa": "/faɪnd/", "zh": "找到"}, {"w": "follow", "ipa": "/ˈfɑːloʊ/", "zh": "跟随"}, {"w": "get off", "ipa": "/ɡet ɔːf/", "zh": "下车"}, {"w": "get on", "ipa": "/ɡet ɑːn/", "zh": "上车"}, {"w": "open", "ipa": "/ˈoʊpən/", "zh": "打开"}, {"w": "show", "ipa": "/ʃoʊ/", "zh": "出示"}, {"w": "wait", "ipa": "/weɪt/", "zh": "等待"}], "nouns": [{"w": "gate", "ipa": "/ɡeɪt/", "zh": "闸机口"}, {"w": "ID card", "ipa": "/ˌaɪ ˈdiː kɑːrd/", "zh": "身份证"}, {"w": "platform", "ipa": "/ˈplætfɔːrm/", "zh": "站台"}, {"w": "seat", "ipa": "/siːt/", "zh": "座位"}, {"w": "sign", "ipa": "/saɪn/", "zh": "指示牌"}, {"w": "station", "ipa": "/ˈsteɪʃn/", "zh": "车站"}, {"w": "ticket", "ipa": "/ˈtɪkɪt/", "zh": "车票"}, {"w": "track", "ipa": "/træk/", "zh": "轨道"}, {"w": "train", "ipa": "/treɪn/", "zh": "火车"}], "others": [{"w": "by the window (adverbial)", "ipa": "/baɪ ðə ˈwɪndoʊ/", "zh": "靠窗"}, {"w": "high-speed (adj.)", "ipa": "/ˌhaɪ ˈspiːd/", "zh": "高速的"}]}, "notes": [{"en": "In China you buy train tickets on your phone and show your ID card to get in.", "zh": "在中国，用手机买火车票，刷身份证进站。"}, {"en": "High-speed trains are very fast, so find your seat quickly.", "zh": "高铁很快，上车后要尽快找到座位。"}], "dialogue": [{"speaker": "Mom", "role": "mom", "en": "Tom, which train are we taking?", "zh": "汤姆，我们坐哪一趟车？"}, {"speaker": "Tom", "role": "clerk", "en": "The G123 high-speed train, Mom.", "zh": "G123 次高铁，妈妈。"}, {"speaker": "Tom", "role": "clerk", "en": "It arrives at 10:30.", "zh": "十点半到站。"}], "china": [{"en": "Most Chinese people book train tickets on the 12306 app and go through the gate with their ID card.", "zh": "大多数中国人在 12306 App 上买火车票，刷身份证通过闸机。"}, {"en": "China's high-speed trains can travel at 350 kilometers per hour.", "zh": "中国高铁时速可达 350 公里。"}], "en": "Taking a Train", "zh": "乘火车", "grammarZh": "一般过去时"}, {"id": 17, "section": 2, "level": 1, "img": "assets/img/unit17.jpg", "grammar": "SIMPLE PAST", "grammarNote": {"en": "The simple past narrates a short taxi ride. Regular verbs: hailed, started, checked, stopped. Irregular verbs: get-got into, give-gave, go-went, pay-paid, take-took, tell-told. The thought bubble \"That's about right\" shows a past judgment about the meter.", "zh": "一般过去时讲述了一段短暂的打车经历。规则动词：hailed、started、checked、stopped。不规则动词：get-got into、give-gave、go-went、pay-paid、take-took、tell-told。思想泡泡里的 That's about right（差不多）是对计价器金额的过去判断。"}, "steps": [{"en": "Mom ordered a taxi on her phone.", "zh": "妈妈用手机叫了一辆出租车。"}, {"en": "The taxi came to their building.", "zh": "出租车开到了楼下。"}, {"en": "Jenny and Mom got into the back seat.", "zh": "珍妮和妈妈坐进了后座。"}, {"en": "Jenny told the driver where they wanted to go.", "zh": "珍妮告诉司机他们要去哪里。"}, {"en": "The driver started the meter.", "zh": "司机开始打表。"}, {"en": "During the ride, Jenny looked out the window.", "zh": "路上，珍妮看着窗外。"}, {"en": "The driver stopped in front of their school.", "zh": "司机在学校门口停了下来。"}, {"en": "Mom paid the fare with her phone.", "zh": "妈妈用手机付了车费。"}], "vocab": {"verbs": [{"w": "check", "ipa": "/tʃek/", "zh": "查看"}, {"w": "get into", "ipa": "/ɡet ˈɪntuː/", "zh": "坐进"}, {"w": "look out", "ipa": "/lʊk aʊt/", "zh": "向外看"}, {"w": "order", "ipa": "/ˈɔːrdər/", "zh": "叫（车）；点（单）"}, {"w": "pay", "ipa": "/peɪ/", "zh": "支付"}, {"w": "start", "ipa": "/stɑːrt/", "zh": "开始"}, {"w": "stop", "ipa": "/stɑːp/", "zh": "停"}, {"w": "tell", "ipa": "/tel/", "zh": "告诉"}], "nouns": [{"w": "back seat", "ipa": "/bæk siːt/", "zh": "后座"}, {"w": "driver", "ipa": "/ˈdraɪvər/", "zh": "司机"}, {"w": "fare", "ipa": "/fer/", "zh": "车费"}, {"w": "meter", "ipa": "/ˈmiːtər/", "zh": "计价器"}, {"w": "phone", "ipa": "/foʊn/", "zh": "手机"}, {"w": "taxi", "ipa": "/ˈtæksi/", "zh": "出租车"}], "others": [{"w": "by phone (adverbial)", "ipa": "/baɪ foʊn/", "zh": "用手机"}]}, "notes": [{"en": "You can order a taxi with an app on your phone.", "zh": "可以用手机 App 叫出租车。"}, {"en": "In China, people usually pay the taxi fare with their phones.", "zh": "在中国，人们通常用手机付车费。"}], "dialogue": [{"speaker": "Jenny", "role": "girl", "en": "We're going to Sunny School, please.", "zh": "我们要去阳光小学。"}, {"speaker": "Driver", "role": "clerk", "en": "Okay. Here we go!", "zh": "好的，出发！"}, {"speaker": "Mom", "role": "mom", "en": "How much is the fare?", "zh": "车费多少钱？"}, {"speaker": "Driver", "role": "clerk", "en": "Fifteen yuan.", "zh": "十五元。"}, {"speaker": "Mom", "role": "mom", "en": "I'll pay by phone. Thank you!", "zh": "我用手机支付。谢谢！"}, {"speaker": "Jenny", "role": "girl", "en": "Bye, driver!", "zh": "司机叔叔再见！"}], "china": [{"en": "Chinese people usually order taxis with apps like Didi instead of hailing on the street.", "zh": "中国人一般用滴滴等 App 叫出租车，而不是在路边招手。"}, {"en": "Tipping is not expected in Chinese taxis.", "zh": "在中国坐出租车不用给小费。"}], "en": "Taking a Taxi", "zh": "打出租车", "grammarZh": "一般过去时"}, {"id": 18, "section": 2, "level": 1, "img": "assets/img/unit18.jpg", "grammar": "SIMPLE PAST", "grammarNote": {"en": "The simple past
